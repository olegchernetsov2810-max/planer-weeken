<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Финансы">
<meta name="theme-color" content="#e8efe9">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23a3c9a8'/%3E%3Ctext x='90' y='125' font-size='100' font-family='Georgia' text-anchor='middle' fill='white' font-weight='bold'%3E%E2%82%BD%3C/text%3E%3C/svg%3E">
<title>Финансовый планер</title>
<style>
  html { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }
  :root {
    --bg-grad: linear-gradient(180deg, #e8efe9 0%, #f1f4ef 100%);
    --surface: #ffffff;
    --surface-2: #f7faf7;
    --modal-bg: #f4f7f3;
    --text: #1a1a1a;
    --text-muted: #8a8a8a;
    --border: #dde2dd;
    --border-strong: #b8c2b8;
    --accent: #a3c9a8;
    --accent-soft: #c8dfca;
    --accent-bg: #e2eee3;
    --accent-deep: #6b9c73;
    --row-alt: #f3f6f3;
    --income: #6b9c73;
    --expense: #c97a6a;
    --debt: #b89a5a;
    --shadow: 0 2px 8px rgba(60,80,60,0.06), 0 1px 2px rgba(60,80,60,0.04);
    --shadow-modal: 0 -8px 32px rgba(0,0,0,0.12);
  }
  [data-theme="dark"] {
    --bg-grad: linear-gradient(180deg, #0d0d0d 0%, #131513 100%);
    --surface: #181a18;
    --surface-2: #1f221f;
    --modal-bg: #1c1f1c;
    --text: #f0f0f0;
    --text-muted: #888;
    --border: #2a2d2a;
    --border-strong: #404540;
    --accent: #7fae87;
    --accent-soft: #4a6e50;
    --accent-bg: #1f2a21;
    --accent-deep: #a3c9a8;
    --row-alt: #141614;
    --income: #7fae87;
    --expense: #d68a7a;
    --debt: #c9aa6a;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-modal: 0 -8px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea {
    font-family: inherit;
    color: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"], input[type="number"] {
    -webkit-text-fill-color: var(--text);
    opacity: 1;
  }
  html, body {
    margin: 0; padding: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: var(--bg-grad);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px 14px 80px;
  }

/* Header */
.header {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 14px;
padding: 4px 2px;
}
.month-nav {
display: flex; align-items: center; gap: 8px;
}
.month-title {
font-size: 22px; font-weight: 600; letter-spacing: -0.3px;
font-family: Georgia, serif;
font-style: italic;
min-width: 110px;
}
.icon-btn {
background: transparent; border: none;
color: var(–text-muted);
-webkit-text-fill-color: var(–text-muted);
width: 34px; height: 34px;
display: flex; align-items: center; justify-content: center;
cursor: pointer; padding: 0;
border-radius: 8px;
font-size: 18px;
}
.icon-btn:active { background: var(–accent-bg); }
.header-actions { display: flex; gap: 4px; }

/* Tabs */
.tabs {
display: flex;
background: var(–surface);
border-radius: 10px;
padding: 3px;
margin-bottom: 14px;
border: 1px solid var(–border);
box-shadow: var(–shadow);
overflow-x: auto;
-webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
flex: 1;
background: transparent;
border: none;
padding: 9px 10px;
font-size: 12px;
color: #8a8a8a;
border-radius: 7px;
font-weight: 500;
transition: all 0.2s;
cursor: pointer;
white-space: nowrap;
}
.tabs button.active {
background: #e2eee3;
color: #6b9c73;
font-weight: 600;
}
[data-theme=“dark”] .tabs button { color: #888; }
[data-theme=“dark”] .tabs button.active { background: #1f2a21; color: #a3c9a8; }

/* Cards */
.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 14px;
margin-bottom: 12px;
box-shadow: var(–shadow);
}
.card-title {
font-size: 11px;
color: var(–text-muted);
text-transform: uppercase;
letter-spacing: 0.6px;
margin-bottom: 10px;
font-weight: 600;
}

/* KPI grid */
.kpi-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
margin-bottom: 12px;
}
.kpi {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 10px 12px;
box-shadow: var(–shadow);
}
.kpi-label {
font-size: 10px;
text-transform: uppercase;
letter-spacing: 0.5px;
color: var(–text-muted);
font-weight: 600;
margin-bottom: 3px;
}
.kpi-value {
font-size: 18px;
font-weight: 600;
font-variant-numeric: tabular-nums;
line-height: 1.2;
}
.kpi-sub {
font-size: 10px;
color: var(–text-muted);
margin-top: 2px;
font-variant-numeric: tabular-nums;
}
.kpi-value.income { color: var(–income); -webkit-text-fill-color: var(–income); }
.kpi-value.expense { color: var(–expense); -webkit-text-fill-color: var(–expense); }
.kpi-value.debt { color: var(–debt); -webkit-text-fill-color: var(–debt); }
.kpi-value.balance { color: var(–text); -webkit-text-fill-color: var(–text); }
.kpi-value.balance.negative { color: var(–expense); -webkit-text-fill-color: var(–expense); }

/* Plan/Fact bar */
.pf-row {
display: grid;
grid-template-columns: 1fr auto auto;
align-items: center;
gap: 10px;
padding: 8px 0;
border-bottom: 1px solid var(–border);
font-size: 13px;
}
.pf-row:last-child { border-bottom: none; }
.pf-name {
font-weight: 500;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
min-width: 0;
}
.pf-bar-wrap {
grid-column: 1 / -1;
display: flex; align-items: center; gap: 8px;
margin-top: 4px;
}
.pf-bar {
flex: 1;
height: 6px;
background: var(–row-alt);
border-radius: 3px;
overflow: hidden;
position: relative;
}
.pf-bar-fill {
height: 100%;
background: var(–accent);
transition: width 0.3s;
}
.pf-bar-fill.over { background: var(–expense); }
.pf-bar-text {
font-size: 10px;
color: var(–text-muted);
font-variant-numeric: tabular-nums;
min-width: 38px;
text-align: right;
}
.pf-amount {
font-variant-numeric: tabular-nums;
font-size: 13px;
text-align: right;
}
.pf-amount.plan { color: var(–text-muted); font-size: 11px; }
.pf-amount.fact { font-weight: 600; }

/* Operations list */
.ops-list { margin-top: 4px; }
.op-row {
display: grid;
grid-template-columns: auto 1fr auto auto;
gap: 10px;
align-items: center;
padding: 10px 0;
border-bottom: 1px solid var(–border);
}
.op-row:last-child { border-bottom: none; }
.op-icon {
width: 32px; height: 32px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 14px;
flex-shrink: 0;
}
.op-icon.in { background: var(–accent-bg); color: var(–income); -webkit-text-fill-color: var(–income); }
.op-icon.out { background: #fbe8e3; color: var(–expense); -webkit-text-fill-color: var(–expense); }
[data-theme=“dark”] .op-icon.out { background: #2a1818; }
.op-info { min-width: 0; }
.op-cat {
font-size: 13px;
font-weight: 500;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.op-meta {
font-size: 11px;
color: var(–text-muted);
margin-top: 1px;
}
.op-amount {
font-variant-numeric: tabular-nums;
font-weight: 600;
font-size: 14px;
white-space: nowrap;
}
.op-amount.in { color: var(–income); -webkit-text-fill-color: var(–income); }
.op-amount.out { color: var(–expense); -webkit-text-fill-color: var(–expense); }
.op-del {
background: transparent;
border: none;
color: var(–text-muted);
-webkit-text-fill-color: var(–text-muted);
width: 28px; height: 28px;
border-radius: 6px;
cursor: pointer;
font-size: 16px;
}
.op-del:active { background: var(–row-alt); }

/* Empty */
.empty {
padding: 30px 16px;
text-align: center;
color: var(–text-muted);
}
.empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.6; }
.empty-text { font-size: 13px; line-height: 1.5; }

/* Add buttons */
.add-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 12px;
}
.big-btn {
border: 1.5px dashed var(–border-strong);
background: var(–surface);
color: var(–text);
-webkit-text-fill-color: var(–text);
padding: 12px;
border-radius: 12px;
font-size: 13px;
font-weight: 500;
cursor: pointer;
}
.big-btn.income {
border-color: var(–accent);
color: var(–income);
-webkit-text-fill-color: var(–income);
}
.big-btn.expense {
border-color: #e8b8ad;
color: var(–expense);
-webkit-text-fill-color: var(–expense);
}
[data-theme=“dark”] .big-btn.expense { border-color: #6a3838; }
.big-btn:active { transform: scale(0.98); background: var(–accent-bg); }
.big-btn.expense:active { background: #fbe8e3; }
[data-theme=“dark”] .big-btn.expense:active { background: #2a1818; }

/* Pie chart */
.pie-row {
display: grid;
grid-template-columns: auto 1fr;
gap: 14px;
align-items: center;
}
.pie-svg { width: 110px; height: 110px; flex-shrink: 0; }
.pie-legend {
display: flex;
flex-direction: column;
gap: 6px;
min-width: 0;
}
.legend-row {
display: grid;
grid-template-columns: 10px 1fr auto;
gap: 8px;
align-items: center;
font-size: 12px;
}
.legend-dot {
width: 10px; height: 10px;
border-radius: 50%;
}
.legend-name {
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
.legend-pct {
font-variant-numeric: tabular-nums;
color: var(–text-muted);
font-size: 11px;
}

/* Categories list (settings) */
.cat-section {
margin-bottom: 14px;
}
.cat-section-header {
display: flex; align-items: center; justify-content: space-between;
padding: 10px 14px;
background: var(–accent-bg);
border: 1px solid var(–border);
border-radius: 10px 10px 0 0;
border-bottom: none;
font-size: 13px;
font-weight: 600;
color: var(–accent-deep);
-webkit-text-fill-color: var(–accent-deep);
}
.cat-section-header.expense {
background: #fbe8e3;
color: var(–expense);
-webkit-text-fill-color: var(–expense);
}
[data-theme=“dark”] .cat-section-header.expense { background: #2a1818; }
.cat-section-header.debt {
background: #f5edd9;
color: var(–debt);
-webkit-text-fill-color: var(–debt);
}
[data-theme=“dark”] .cat-section-header.debt { background: #2a2418; }
.cat-list {
background: var(–surface);
border: 1px solid var(–border);
border-top: none;
border-radius: 0 0 10px 10px;
overflow: hidden;
}
.cat-item {
display: flex; align-items: center; gap: 8px;
padding: 10px 12px;
border-bottom: 1px solid var(–border);
font-size: 13px;
}
.cat-item:last-child { border-bottom: none; }
.cat-name { flex: 1; }
.cat-plan {
font-variant-numeric: tabular-nums;
color: var(–text-muted);
font-size: 12px;
}
.cat-del {
background: transparent;
border: none;
color: #c44;
-webkit-text-fill-color: #c44;
width: 28px; height: 28px;
border-radius: 6px;
cursor: pointer;
font-size: 14px;
}
.add-cat-btn {
width: 100%;
background: transparent;
border: none;
color: var(–accent-deep);
-webkit-text-fill-color: var(–accent-deep);
padding: 10px;
font-size: 13px;
font-weight: 600;
cursor: pointer;
}
.add-cat-btn:active { background: var(–accent-bg); }

/* Modal */
.modal-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,0.4);
display: none;
align-items: flex-end;
justify-content: center;
z-index: 100;
backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
.modal {
background: #f4f7f3;
width: 100%;
max-width: 520px;
border-radius: 20px 20px 0 0;
padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
border-top: 1px solid #dde2dd;
color: #1a1a1a;
max-height: 90vh;
overflow-y: auto;
}
[data-theme=“dark”] .modal {
background: #1c1f1c;
border-top-color: #2a2d2a;
color: #f0f0f0;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
width: 36px; height: 4px;
background: var(–border-strong);
border-radius: 2px;
margin: 0 auto 14px;
}
.modal h3 {
margin: 0 0 14px;
font-size: 17px;
font-weight: 600;
}
.modal label {
display: block;
font-size: 11px;
color: var(–text-muted);
text-transform: uppercase;
letter-spacing: 0.5px;
font-weight: 600;
margin-bottom: 5px;
margin-top: 8px;
}
.modal input, .modal select, .modal textarea {
width: 100%;
padding: 12px 14px;
border: 1.5px solid #b8c2b8;
border-radius: 10px;
font-size: 15px;
background: #ffffff;
color: #1a1a1a;
-webkit-text-fill-color: #1a1a1a;
margin-bottom: 4px;
font-family: inherit;
box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
}
[data-theme=“dark”] .modal input, [data-theme=“dark”] .modal select, [data-theme=“dark”] .modal textarea {
background: #1f221f;
color: #f0f0f0;
-webkit-text-fill-color: #f0f0f0;
border-color: #404540;
}
.modal input:focus, .modal select:focus, .modal textarea:focus {
outline: none;
border-color: #6b9c73;
box-shadow: 0 0 0 3px #e2eee3;
}
.modal select {
background-image: url(“data:image/svg+xml;charset=UTF-8,%3csvg xmlns=‘http://www.w3.org/2000/svg’ width=‘12’ height=‘8’ viewBox=‘0 0 12 8’%3e%3cpath fill=’%238a8a8a’ d=‘M6 8L0 0h12z’/%3e%3c/svg%3e”);
background-repeat: no-repeat;
background-position: right 14px center;
padding-right: 36px;
}
.row-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
}
.modal-actions {
display: flex; gap: 8px;
margin-top: 14px;
}
.btn {
flex: 1;
padding: 13px;
border-radius: 10px;
border: none;
font-size: 14px;
font-weight: 600;
cursor: pointer;
font-family: inherit;
}
.btn-primary {
background: #a3c9a8;
color: #ffffff;
-webkit-text-fill-color: #ffffff;
box-shadow: 0 2px 6px rgba(107,156,115,0.25);
}
[data-theme=“dark”] .btn-primary {
color: #0d0d0d;
-webkit-text-fill-color: #0d0d0d;
}
.btn-secondary {
background: #ffffff;
color: #1a1a1a;
-webkit-text-fill-color: #1a1a1a;
border: 1px solid #dde2dd;
}
[data-theme=“dark”] .btn-secondary {
background: #1f221f;
color: #f0f0f0;
-webkit-text-fill-color: #f0f0f0;
border-color: #2a2d2a;
}

/* Type toggle in modal */
.type-toggle {
display: grid;
grid-template-columns: 1fr 1fr;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
padding: 3px;
margin-bottom: 8px;
}
.type-toggle button {
background: transparent;
border: none;
padding: 10px;
font-size: 13px;
font-weight: 600;
border-radius: 7px;
color: var(–text-muted);
-webkit-text-fill-color: var(–text-muted);
cursor: pointer;
}
.type-toggle button.active.income {
background: var(–accent-bg);
color: var(–income);
-webkit-text-fill-color: var(–income);
}
.type-toggle button.active.expense {
background: #fbe8e3;
color: var(–expense);
-webkit-text-fill-color: var(–expense);
}
[data-theme=“dark”] .type-toggle button.active.expense { background: #2a1818; }

/* Toast */
.toast {
position: fixed;
bottom: calc(20px + env(safe-area-inset-bottom));
left: 50%; transform: translateX(-50%);
background: var(–text);
color: var(–surface);
-webkit-text-fill-color: var(–surface);
padding: 10px 18px;
border-radius: 20px;
font-size: 13px;
z-index: 200;
opacity: 0;
transition: opacity 0.3s;
pointer-events: none;
}
.toast.show { opacity: 1; }

/* Year overview */
.year-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 8px;
}
.year-month-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
padding: 10px 12px;
cursor: pointer;
}
.year-month-card.current { border-color: var(–accent); background: var(–accent-bg); }
.year-month-name {
font-weight: 600;
font-size: 13px;
margin-bottom: 4px;
}
.year-month-row {
display: flex; justify-content: space-between;
font-size: 11px;
color: var(–text-muted);
font-variant-numeric: tabular-nums;
margin-top: 2px;
}
.year-month-row .v { color: var(–text); -webkit-text-fill-color: var(–text); font-weight: 500; }
.year-balance {
margin-top: 6px;
padding-top: 6px;
border-top: 1px solid var(–border);
font-size: 13px;
font-weight: 600;
text-align: right;
font-variant-numeric: tabular-nums;
}
.year-balance.pos { color: var(–income); -webkit-text-fill-color: var(–income); }
.year-balance.neg { color: var(–expense); -webkit-text-fill-color: var(–expense); }

/* Initial balance in card */
.initial-balance {
display: flex; align-items: center; justify-content: space-between;
margin-bottom: 8px;
padding-bottom: 8px;
border-bottom: 1px solid var(–border);
}
.initial-balance-label {
font-size: 11px;
color: var(–text-muted);
text-transform: uppercase;
letter-spacing: 0.5px;
font-weight: 600;
}
.initial-balance-value {
font-size: 14px;
font-weight: 600;
font-variant-numeric: tabular-nums;
cursor: pointer;
}
.initial-balance-value:active { opacity: 0.6; }
</style>

</head>
<body>
<div class="app">
  <div class="header">
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">‹</button>
      <div class="month-title" id="monthTitle">Январь</div>
      <button class="icon-btn" id="nextMonth">›</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="Тема">◐</button>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="overview" class="active">Обзор</button>
    <button data-tab="ops">Операции</button>
    <button data-tab="plan">План</button>
    <button data-tab="categories">Категории</button>
    <button data-tab="year">Год</button>
  </div>

  <div id="mainView"></div>
</div>

<!-- Operation modal -->

<div class="modal-overlay" id="opModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="opModalTitle">Новая операция</h3>
    <div class="type-toggle" id="opTypeToggle">
      <button data-type="income" class="active income">↓ Доход</button>
      <button data-type="expense">↑ Расход</button>
    </div>
    <label>Сумма</label>
    <input type="text" inputmode="decimal" id="opAmount" placeholder="0">
    <label>Категория</label>
    <select id="opCategory"></select>
    <div class="row-2">
      <div>
        <label>Дата</label>
        <input type="date" id="opDate">
      </div>
      <div>
        <label>Примечание</label>
        <input type="text" id="opNote" placeholder="—">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="opCancel">Отмена</button>
      <button class="btn btn-primary" id="opSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Category modal -->

<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="catModalTitle">Новая категория</h3>
    <label>Тип</label>
    <select id="catType">
      <option value="income">Доход</option>
      <option value="expense">Расход</option>
      <option value="debt">Долг</option>
    </select>
    <label>Название</label>
    <input type="text" id="catName" placeholder="Например, Зарплата" maxlength="40">
    <label id="catPlanLabel">Плановая сумма на месяц (необязательно)</label>
    <input type="text" inputmode="decimal" id="catPlan" placeholder="0">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="catCancel">Отмена</button>
      <button class="btn btn-primary" id="catSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Initial balance modal -->

<div class="modal-overlay" id="balModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Начальный баланс месяца</h3>
    <label>Сумма на начало месяца</label>
    <input type="text" inputmode="decimal" id="balAmount" placeholder="0">
    <div class="modal-actions">
      <button class="btn btn-secondary" id="balCancel">Отмена</button>
      <button class="btn btn-primary" id="balSave">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const STORAGE_KEY = 'financePlannerData_v1';
const CURRENCY = '₽';
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_RU_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const PIE_COLORS = ['#6b9c73','#a3c9a8','#7fae87','#5a8763','#c9aa6a','#d68a7a','#9bb5a0','#b8c9bc','#8aa593','#cdb480','#e0a899','#7e9686'];

let state = {
  // categories: [{id, type:'income'|'expense'|'debt', name, plan}]
  categories: [],
  // operations: [{id, type:'income'|'expense', categoryId, amount, date:'YYYY-MM-DD', note}]
  operations: [],
  // initialBalance: { 'YYYY-MM': number }
  initialBalance: {},
  theme: 'light',
  tab: 'overview'
};
let viewDate = new Date(); viewDate.setDate(1);

// ---------- Storage ----------
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = { ...state, ...JSON.parse(raw) };
  } catch(e) { console.warn(e); }
  document.documentElement.setAttribute('data-theme', state.theme);
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { toast('Не удалось сохранить'); }
}

// ---------- Helpers ----------
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function ym(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmt(n, opts={}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const sign = n < 0 ? '−' : (opts.showPlus && n > 0 ? '+' : '');
  const formatted = abs.toLocaleString('ru-RU', { maximumFractionDigits: 2, minimumFractionDigits: abs % 1 === 0 ? 0 : 2 });
  return `${sign}${formatted} ${CURRENCY}`;
}
function fmtShort(n) {
  if (!n) return '0';
  const abs = Math.abs(n);
  if (abs >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'М';
  if (abs >= 1e3) return Math.round(n/1e3) + 'К';
  return Math.round(n).toString();
}
function parseAmount(s) {
  if (!s) return 0;
  const cleaned = String(s).replace(/\s/g,'').replace(',','.').replace(/[^\d.\-]/g,'');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(p='id') { return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Computations ----------
function getMonthOps(year, month) {
  const monthStr = `${year}-${String(month+1).padStart(2,'0')}`;
  return state.operations.filter(o => o.date.startsWith(monthStr));
}
function sumByType(ops, type) {
  return ops.filter(o => o.type === type).reduce((s,o) => s + (o.amount||0), 0);
}
function getMonthSummary(year, month) {
  const ops = getMonthOps(year, month);
  const income = sumByType(ops, 'income');
  const expense = sumByType(ops, 'expense');
  const initial = state.initialBalance[`${year}-${String(month+1).padStart(2,'0')}`] || 0;
  return {
    initial, income, expense,
    balance: initial + income - expense,
    netMonth: income - expense
  };
}
function getCategoryFact(categoryId, year, month) {
  return getMonthOps(year, month)
    .filter(o => o.categoryId === categoryId)
    .reduce((s,o) => s + o.amount, 0);
}
function getDebtTotal() {
  return state.categories.filter(c => c.type === 'debt').reduce((s,c) => s + (c.plan||0), 0);
}

// ---------- Render ----------
function setMonthTitle() {
  const m = viewDate.getMonth(), y = viewDate.getFullYear(), now = new Date();
  document.getElementById('monthTitle').textContent = MONTHS_RU[m] + (y === now.getFullYear() ? '' : ' '+y);
}

function render() {
  setMonthTitle();
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  const v = document.getElementById('mainView');
  if (state.tab === 'overview') v.innerHTML = renderOverview();
  else if (state.tab === 'ops') v.innerHTML = renderOps();
  else if (state.tab === 'plan') v.innerHTML = renderPlan();
  else if (state.tab === 'categories') v.innerHTML = renderCategories();
  else if (state.tab === 'year') v.innerHTML = renderYear();
  attachHandlers();
}

// ----- Overview tab -----
function renderOverview() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const s = getMonthSummary(y, m);
  const debt = getDebtTotal();
  const balanceClass = s.balance < 0 ? 'balance negative' : 'balance';

  let html = `<div class="card">
    <div class="initial-balance">
      <span class="initial-balance-label">Начальная сумма</span>
      <span class="initial-balance-value" id="setInitial">${fmt(s.initial)} →</span>
    </div>
    <div class="kpi-grid" style="margin-bottom:0">
      <div class="kpi" style="background:transparent;border:none;box-shadow:none;padding:6px 0">
        <div class="kpi-label">Доходы</div>
        <div class="kpi-value income">${fmt(s.income)}</div>
      </div>
      <div class="kpi" style="background:transparent;border:none;box-shadow:none;padding:6px 0">
        <div class="kpi-label">Расходы</div>
        <div class="kpi-value expense">${fmt(s.expense)}</div>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;font-weight:500">Остаток месяца</span>
      <span class="kpi-value ${balanceClass}" style="font-size:22px">${fmt(s.balance)}</span>
    </div>
  </div>`;

  // Quick add
  html += `<div class="add-row">
    <button class="big-btn income" id="addIncome">＋ Доход</button>
    <button class="big-btn expense" id="addExpense">＋ Расход</button>
  </div>`;

  // Pie: expenses by category
  const expByCat = {};
  getMonthOps(y, m).filter(o => o.type === 'expense').forEach(o => {
    expByCat[o.categoryId] = (expByCat[o.categoryId] || 0) + o.amount;
  });
  const expEntries = Object.entries(expByCat).map(([cid, v]) => {
    const cat = state.categories.find(c => c.id === cid);
    return { name: cat ? cat.name : 'Прочее', value: v };
  }).sort((a,b) => b.value - a.value);

  if (expEntries.length > 0) {
    html += `<div class="card">
      <div class="card-title">Расходы по категориям</div>
      ${renderPieRow(expEntries)}
    </div>`;
  }

  // Pie: incomes
  const incByCat = {};
  getMonthOps(y, m).filter(o => o.type === 'income').forEach(o => {
    incByCat[o.categoryId] = (incByCat[o.categoryId] || 0) + o.amount;
  });
  const incEntries = Object.entries(incByCat).map(([cid, v]) => {
    const cat = state.categories.find(c => c.id === cid);
    return { name: cat ? cat.name : 'Прочее', value: v };
  }).sort((a,b) => b.value - a.value);

  if (incEntries.length > 0) {
    html += `<div class="card">
      <div class="card-title">Доходы по категориям</div>
      ${renderPieRow(incEntries)}
    </div>`;
  }

  if (debt > 0) {
    html += `<div class="card" style="border-color:var(--debt)">
      <div class="card-title" style="color:var(--debt);-webkit-text-fill-color:var(--debt)">Долги</div>
      <div style="font-size:20px;font-weight:600;color:var(--debt);-webkit-text-fill-color:var(--debt)">${fmt(debt)}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Сумма всех текущих обязательств</div>
    </div>`;
  }

  if (state.categories.length === 0) {
    html += `<div class="card"><div class="empty">
      <div class="empty-icon">📊</div>
      <div class="empty-text">Начни с настройки категорий —<br>зайди во вкладку «Категории»</div>
    </div></div>`;
  }

  return html;
}

function renderPieRow(entries) {
  const total = entries.reduce((s,e) => s + e.value, 0);
  if (!total) return '<div class="empty"><div class="empty-text">Нет данных</div></div>';
  const cx=55, cy=55, r=45, ir=22;
  let angle = -Math.PI/2;
  let svg = `<svg class="pie-svg" viewBox="0 0 110 110">`;
  entries.forEach((e, i) => {
    const frac = e.value / total;
    const a2 = angle + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
    const x3 = cx + ir*Math.cos(a2), y3 = cy + ir*Math.sin(a2);
    const x4 = cx + ir*Math.cos(angle), y4 = cy + ir*Math.sin(angle);
    const color = PIE_COLORS[i % PIE_COLORS.length];
    if (entries.length === 1) {
      svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>
              <circle cx="${cx}" cy="${cy}" r="${ir}" fill="var(--surface)"/>`;
    } else {
      svg += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z" fill="${color}"/>`;
    }
    angle = a2;
  });
  svg += `</svg>`;
  const legend = entries.map((e, i) => {
    const pct = ((e.value/total)*100).toFixed(0);
    return `<div class="legend-row">
      <div class="legend-dot" style="background:${PIE_COLORS[i % PIE_COLORS.length]}"></div>
      <div class="legend-name">${escapeHtml(e.name)}</div>
      <div class="legend-pct">${pct}% · ${fmtShort(e.value)}</div>
    </div>`;
  }).join('');
  return `<div class="pie-row">${svg}<div class="pie-legend">${legend}</div></div>`;
}

// ----- Operations tab -----
function renderOps() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const ops = getMonthOps(y, m).slice().sort((a,b) => b.date.localeCompare(a.date) || (b.id < a.id ? -1 : 1));

  let html = `<div class="add-row">
    <button class="big-btn income" id="addIncome">＋ Доход</button>
    <button class="big-btn expense" id="addExpense">＋ Расход</button>
  </div>`;

  if (ops.length === 0) {
    html += `<div class="card"><div class="empty">
      <div class="empty-icon">💸</div>
      <div class="empty-text">Операций за этот месяц пока нет.<br>Добавь первую — кнопками сверху.</div>
    </div></div>`;
    return html;
  }

  // Group by date
  const groups = {};
  ops.forEach(o => { (groups[o.date] = groups[o.date] || []).push(o); });
  const sortedDates = Object.keys(groups).sort().reverse();

  sortedDates.forEach(date => {
    const dayOps = groups[date];
    const dayIn = sumByType(dayOps, 'income');
    const dayOut = sumByType(dayOps, 'expense');
    const d = new Date(date);
    const dateLabel = `${d.getDate()} ${MONTHS_RU[d.getMonth()].toLowerCase()}`;
    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:13px;font-weight:600">${dateLabel}</div>
        <div style="font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums">
          ${dayIn ? `<span style="color:var(--income);-webkit-text-fill-color:var(--income)">+${fmtShort(dayIn)}</span>` : ''}
          ${dayIn && dayOut ? ' · ' : ''}
          ${dayOut ? `<span style="color:var(--expense);-webkit-text-fill-color:var(--expense)">−${fmtShort(dayOut)}</span>` : ''}
        </div>
      </div>
      <div class="ops-list">`;
    dayOps.forEach(o => {
      const cat = state.categories.find(c => c.id === o.categoryId);
      const catName = cat ? cat.name : 'Без категории';
      const icon = o.type === 'income' ? '↓' : '↑';
      html += `<div class="op-row">
        <div class="op-icon ${o.type === 'income' ? 'in' : 'out'}">${icon}</div>
        <div class="op-info">
          <div class="op-cat">${escapeHtml(catName)}</div>
          ${o.note ? `<div class="op-meta">${escapeHtml(o.note)}</div>` : ''}
        </div>
        <div class="op-amount ${o.type === 'income' ? 'in' : 'out'}">${o.type === 'income' ? '+' : '−'}${fmt(o.amount).replace('−','')}</div>
        <button class="op-del" data-op="${o.id}">×</button>
      </div>`;
    });
    html += `</div></div>`;
  });
  return html;
}

// ----- Plan tab -----
function renderPlan() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  let html = '';

  ['expense','income'].forEach(type => {
    const cats = state.categories.filter(c => c.type === type && (c.plan > 0 || getCategoryFact(c.id, y, m) > 0));
    if (cats.length === 0) return;
    const titleText = type === 'income' ? 'Доходы: план / факт' : 'Расходы: план / факт';
    let totalPlan = 0, totalFact = 0;
    cats.forEach(c => { totalPlan += c.plan || 0; totalFact += getCategoryFact(c.id, y, m); });
    html += `<div class="card">
      <div class="card-title">${titleText}</div>`;
    cats.forEach(c => {
      const fact = getCategoryFact(c.id, y, m);
      const plan = c.plan || 0;
      const pct = plan ? Math.min(200, Math.round(fact/plan*100)) : (fact > 0 ? 100 : 0);
      const over = type === 'expense' && fact > plan && plan > 0;
      const widthPct = Math.min(100, plan ? (fact/plan*100) : 0);
      html += `<div>
        <div class="pf-row">
          <div class="pf-name">${escapeHtml(c.name)}</div>
          <div class="pf-amount plan">план ${fmtShort(plan)}</div>
          <div class="pf-amount fact" style="color:${over ? 'var(--expense)' : 'var(--text)'};-webkit-text-fill-color:${over ? 'var(--expense)' : 'var(--text)'}">${fmtShort(fact)}</div>
        </div>
        <div class="pf-bar-wrap" style="margin-top:-4px;margin-bottom:4px">
          <div class="pf-bar"><div class="pf-bar-fill ${over ? 'over' : ''}" style="width:${widthPct}%"></div></div>
          <div class="pf-bar-text">${pct}%</div>
        </div>
      </div>`;
    });
    const totalOver = type === 'expense' && totalFact > totalPlan && totalPlan > 0;
    html += `<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:8px;display:flex;justify-content:space-between;font-size:13px;font-weight:600">
      <span>Итого</span>
      <span style="font-variant-numeric:tabular-nums">
        <span style="color:var(--text-muted);-webkit-text-fill-color:var(--text-muted);font-weight:400;font-size:11px">план ${fmtShort(totalPlan)} · </span>
        <span style="color:${totalOver ? 'var(--expense)' : 'var(--text)'};-webkit-text-fill-color:${totalOver ? 'var(--expense)' : 'var(--text)'}">${fmtShort(totalFact)}</span>
      </span>
    </div>`;
    html += `</div>`;
  });

  // Debts
  const debts = state.categories.filter(c => c.type === 'debt');
  if (debts.length > 0) {
    html += `<div class="card">
      <div class="card-title">Долги</div>`;
    debts.forEach(c => {
      html += `<div class="pf-row">
        <div class="pf-name">${escapeHtml(c.name)}</div>
        <div class="pf-amount plan">долг</div>
        <div class="pf-amount fact" style="color:var(--debt);-webkit-text-fill-color:var(--debt)">${fmt(c.plan || 0)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  if (html === '') {
    html = `<div class="card"><div class="empty">
      <div class="empty-icon">📋</div>
      <div class="empty-text">Запланируй свои доходы и расходы:<br>зайди в «Категории» и проставь плановые суммы.</div>
    </div></div>`;
  }
  return html;
}

// ----- Categories tab -----
function renderCategories() {
  let html = '';
  const groups = [
    { type: 'income', title: 'Доходы', cls: '' },
    { type: 'expense', title: 'Расходы', cls: 'expense' },
    { type: 'debt', title: 'Долги', cls: 'debt' }
  ];
  groups.forEach(g => {
    const cats = state.categories.filter(c => c.type === g.type);
    html += `<div class="cat-section">
      <div class="cat-section-header ${g.cls}">
        <span>${g.title}</span>
        <span style="font-size:11px;font-weight:500;opacity:0.8">${cats.length}</span>
      </div>
      <div class="cat-list">`;
    if (cats.length === 0) {
      html += `<div class="empty" style="padding:14px"><div class="empty-text">Категорий пока нет</div></div>`;
    } else {
      cats.forEach(c => {
        const planLabel = g.type === 'debt' ? 'долг' : 'план/мес';
        html += `<div class="cat-item">
          <div class="cat-name">${escapeHtml(c.name)}</div>
          ${c.plan ? `<div class="cat-plan">${planLabel}: ${fmtShort(c.plan)}</div>` : ''}
          <button class="cat-del" data-edit-cat="${c.id}" title="Изменить">✎</button>
          <button class="cat-del" data-del-cat="${c.id}" title="Удалить">🗑</button>
        </div>`;
      });
    }
    html += `<button class="add-cat-btn" data-add-cat="${g.type}">＋ Добавить ${g.title.toLowerCase()}</button>`;
    html += `</div></div>`;
  });
  return html;
}

// ----- Year tab -----
function renderYear() {
  const y = viewDate.getFullYear();
  const today = new Date();
  let totalIn = 0, totalOut = 0;
  const monthsData = [];
  for (let m = 0; m < 12; m++) {
    const s = getMonthSummary(y, m);
    totalIn += s.income; totalOut += s.expense;
    monthsData.push(s);
  }
  let html = `<div class="card">
    <div class="card-title">Сводка за ${y}</div>
    <div class="kpi-grid" style="margin-bottom:0">
      <div class="kpi" style="background:transparent;border:none;box-shadow:none;padding:4px 0">
        <div class="kpi-label">Доходы</div>
        <div class="kpi-value income">${fmt(totalIn)}</div>
      </div>
      <div class="kpi" style="background:transparent;border:none;box-shadow:none;padding:4px 0">
        <div class="kpi-label">Расходы</div>
        <div class="kpi-value expense">${fmt(totalOut)}</div>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;font-weight:500">Остаток</span>
      <span class="kpi-value ${totalIn-totalOut < 0 ? 'balance negative' : 'balance'}" style="font-size:20px">${fmt(totalIn - totalOut)}</span>
    </div>
  </div>`;

  // Bar chart by month
  const W = 340, H = 130, padL = 8, padR = 8, padT = 10, padB = 22;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const groupW = innerW / 12;
  const barW = (groupW - 4) / 2;
  const maxV = Math.max(1, ...monthsData.map(d => Math.max(d.income, d.expense)));

  let bars = '';
  monthsData.forEach((d, i) => {
    const xStart = padL + i*groupW + 2;
    const incH = (d.income/maxV) * innerH;
    const expH = (d.expense/maxV) * innerH;
    bars += `<rect x="${xStart}" y="${padT+innerH-incH}" width="${barW}" height="${incH}" fill="#6b9c73" rx="1"/>`;
    bars += `<rect x="${xStart+barW+1}" y="${padT+innerH-expH}" width="${barW}" height="${expH}" fill="#c97a6a" rx="1"/>`;
    bars += `<text x="${xStart+barW}" y="${H-6}" text-anchor="middle" font-size="8" fill="#8a8a8a">${MONTHS_RU_SHORT[i].toLowerCase()}</text>`;
  });

  html += `<div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>Доходы / Расходы</span>
      <span style="text-transform:none;letter-spacing:0;font-weight:500">
        <span style="color:var(--income);-webkit-text-fill-color:var(--income)">●</span> доход
        <span style="color:var(--expense);-webkit-text-fill-color:var(--expense);margin-left:6px">●</span> расход
      </span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:140px;display:block" preserveAspectRatio="xMidYMid meet">
      ${bars}
    </svg>
  </div>`;

  // Month cards
  html += `<div class="year-grid">`;
  monthsData.forEach((d, m) => {
    const isCur = (y === today.getFullYear() && m === today.getMonth());
    const future = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
    const net = d.income - d.expense;
    html += `<div class="year-month-card ${isCur ? 'current' : ''}" data-jump-month="${m}">
      <div class="year-month-name">${MONTHS_RU[m]}</div>
      <div class="year-month-row"><span>Доход</span><span class="v" style="color:var(--income);-webkit-text-fill-color:var(--income)">${future && d.income===0 ? '—' : fmtShort(d.income)}</span></div>
      <div class="year-month-row"><span>Расход</span><span class="v" style="color:var(--expense);-webkit-text-fill-color:var(--expense)">${future && d.expense===0 ? '—' : fmtShort(d.expense)}</span></div>
      <div class="year-balance ${net >= 0 ? 'pos' : 'neg'}">${future && net===0 ? '—' : fmt(net, {showPlus: true})}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// ---------- Modals ----------
let opEditing = null;
function openOpModal(type='expense', editId=null) {
  if (state.categories.filter(c => c.type === type).length === 0) {
    toast('Сначала добавь категорию');
    state.tab = 'categories'; render();
    return;
  }
  opEditing = editId;
  document.getElementById('opModalTitle').textContent = editId ? 'Изменить операцию' : 'Новая операция';
  setOpType(type);
  if (editId) {
    const op = state.operations.find(o => o.id === editId);
    if (op) {
      setOpType(op.type);
      document.getElementById('opAmount').value = op.amount;
      document.getElementById('opDate').value = op.date;
      document.getElementById('opNote').value = op.note || '';
      // category set after fillOpCategory
      setTimeout(() => { document.getElementById('opCategory').value = op.categoryId; }, 0);
    }
  } else {
    document.getElementById('opAmount').value = '';
    document.getElementById('opDate').value = ymd(new Date());
    document.getElementById('opNote').value = '';
  }
  document.getElementById('opModal').classList.add('show');
  setTimeout(() => document.getElementById('opAmount').focus(), 200);
}
function setOpType(type) {
  document.querySelectorAll('#opTypeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
    b.classList.toggle('income', b.dataset.type === 'income');
    b.classList.toggle('expense', b.dataset.type === 'expense');
  });
  fillOpCategory(type);
}
function fillOpCategory(type) {
  const sel = document.getElementById('opCategory');
  const cats = state.categories.filter(c => c.type === type);
  sel.innerHTML = cats.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}
function closeOpModal() { document.getElementById('opModal').classList.remove('show'); }
function saveOp() {
  const type = document.querySelector('#opTypeToggle button.active').dataset.type;
  const amount = parseAmount(document.getElementById('opAmount').value);
  const categoryId = document.getElementById('opCategory').value;
  const date = document.getElementById('opDate').value || ymd(new Date());
  const note = document.getElementById('opNote').value.trim();
  if (amount <= 0) { toast('Введи сумму'); return; }
  if (!categoryId) { toast('Выбери категорию'); return; }
  if (opEditing) {
    const op = state.operations.find(o => o.id === opEditing);
    if (op) Object.assign(op, { type, amount, categoryId, date, note });
  } else {
    state.operations.push({ id: uid('op'), type, amount, categoryId, date, note });
  }
  save(); closeOpModal(); render();
  toast(opEditing ? 'Изменено' : 'Добавлено');
  opEditing = null;
}

let catEditing = null;
function openCatModal(type='expense', editId=null) {
  catEditing = editId;
  document.getElementById('catModalTitle').textContent = editId ? 'Изменить категорию' : 'Новая категория';
  document.getElementById('catType').value = type;
  if (editId) {
    const c = state.categories.find(x => x.id === editId);
    if (c) {
      document.getElementById('catType').value = c.type;
      document.getElementById('catName').value = c.name;
      document.getElementById('catPlan').value = c.plan || '';
    }
  } else {
    document.getElementById('catName').value = '';
    document.getElementById('catPlan').value = '';
  }
  updateCatPlanLabel();
  document.getElementById('catModal').classList.add('show');
  setTimeout(() => document.getElementById('catName').focus(), 200);
}
function updateCatPlanLabel() {
  const t = document.getElementById('catType').value;
  const lbl = document.getElementById('catPlanLabel');
  lbl.textContent = t === 'debt' ? 'Сумма долга' : 'Плановая сумма на месяц (необязательно)';
}
function closeCatModal() { document.getElementById('catModal').classList.remove('show'); }
function saveCat() {
  const type = document.getElementById('catType').value;
  const name = document.getElementById('catName').value.trim();
  const plan = parseAmount(document.getElementById('catPlan').value);
  if (!name) { toast('Введи название'); return; }
  if (catEditing) {
    const c = state.categories.find(x => x.id === catEditing);
    if (c) Object.assign(c, { type, name, plan });
  } else {
    state.categories.push({ id: uid('cat'), type, name, plan });
  }
  save(); closeCatModal(); render();
  catEditing = null;
}

function openBalModal() {
  const key = ym(viewDate);
  document.getElementById('balAmount').value = state.initialBalance[key] || '';
  document.getElementById('balModal').classList.add('show');
  setTimeout(() => document.getElementById('balAmount').focus(), 200);
}
function saveBal() {
  const key = ym(viewDate);
  const v = parseAmount(document.getElementById('balAmount').value);
  if (v) state.initialBalance[key] = v;
  else delete state.initialBalance[key];
  save();
  document.getElementById('balModal').classList.remove('show');
  render();
}

// ---------- Handlers ----------
function attachHandlers() {
  document.querySelectorAll('[data-op]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.op;
      if (confirm('Удалить операцию?')) {
        state.operations = state.operations.filter(o => o.id !== id);
        save(); render();
      }
    });
  });
  const aiBtn = document.getElementById('addIncome');
  if (aiBtn) aiBtn.addEventListener('click', () => openOpModal('income'));
  const aeBtn = document.getElementById('addExpense');
  if (aeBtn) aeBtn.addEventListener('click', () => openOpModal('expense'));

  document.querySelectorAll('[data-add-cat]').forEach(b => {
    b.addEventListener('click', () => openCatModal(b.dataset.addCat));
  });
  document.querySelectorAll('[data-edit-cat]').forEach(b => {
    b.addEventListener('click', () => openCatModal(null, b.dataset.editCat));
  });
  document.querySelectorAll('[data-del-cat]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.dataset.delCat;
      const ops = state.operations.filter(o => o.categoryId === id);
      const msg = ops.length > 0
        ? `Удалить категорию? У неё ${ops.length} операций — они станут «Без категории».`
        : 'Удалить категорию?';
      if (confirm(msg)) {
        state.categories = state.categories.filter(c => c.id !== id);
        save(); render();
      }
    });
  });
  document.querySelectorAll('[data-jump-month]').forEach(b => {
    b.addEventListener('click', () => {
      viewDate = new Date(viewDate.getFullYear(), parseInt(b.dataset.jumpMonth), 1);
      state.tab = 'overview'; render();
    });
  });
  const setInit = document.getElementById('setInitial');
  if (setInit) setInit.addEventListener('click', openBalModal);
}

document.querySelectorAll('.tabs button').forEach(b => {
  b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); });
});
document.getElementById('prevMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()-1); render(); });
document.getElementById('nextMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()+1); render(); });
document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', state.theme === 'dark' ? '#0d0d0d' : '#e8efe9');
  save();
});

document.querySelectorAll('#opTypeToggle button').forEach(b => {
  b.addEventListener('click', () => setOpType(b.dataset.type));
});
document.getElementById('opCancel').addEventListener('click', closeOpModal);
document.getElementById('opSave').addEventListener('click', saveOp);
document.getElementById('opModal').addEventListener('click', e => { if (e.target.id === 'opModal') closeOpModal(); });

document.getElementById('catType').addEventListener('change', updateCatPlanLabel);
document.getElementById('catCancel').addEventListener('click', closeCatModal);
document.getElementById('catSave').addEventListener('click', saveCat);
document.getElementById('catModal').addEventListener('click', e => { if (e.target.id === 'catModal') closeCatModal(); });

document.getElementById('balCancel').addEventListener('click', () => document.getElementById('balModal').classList.remove('show'));
document.getElementById('balSave').addEventListener('click', saveBal);
document.getElementById('balModal').addEventListener('click', e => { if (e.target.id === 'balModal') document.getElementById('balModal').classList.remove('show'); });

load();
render();
</script>

</body>
</html>
