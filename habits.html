<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Привычки"/>
<meta name="theme-color" content="#7c5cbf"/>
<title>Трекер привычек</title>
<style>
:root{
  --a:#7c5cbf; --a2:rgba(124,92,191,.12);
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93;
  --border:#e5e5ea; --inp:#f2f2f7;
  --st:env(safe-area-inset-top,44px); --sb:env(safe-area-inset-bottom,20px);
}
.dk{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#636366;--border:#2c2c2e;--inp:#2c2c2e;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;-webkit-font-smoothing:antialiased;}
input,textarea,select,button{font-family:inherit;font-size:16px;}
button{cursor:pointer;}

#sb{height:var(–st);background:var(–card);position:sticky;top:0;z-index:200;}
#hdr{background:var(–card);border-bottom:1px solid var(–border);padding:0 16px 12px;position:sticky;top:var(–st);z-index:200;}
.h1{display:flex;align-items:center;gap:8px;padding-top:10px;}
.logo{font-size:20px;font-weight:800;color:var(–a);flex:1;}
.ico{width:38px;height:38px;border-radius:12px;border:none;background:var(–inp);font-size:18px;display:flex;align-items:center;justify-content:center;}
.hdr-stats{display:flex;gap:10px;margin-top:8px;}
.hstat{flex:1;background:var(–a2);border-radius:12px;padding:8px 10px;text-align:center;}
.hstat-val{font-size:18px;font-weight:800;color:var(–a);}
.hstat-lbl{font-size:10px;color:var(–muted);margin-top:1px;}

/* Навигация по неделям */
#wnav{background:var(–card);border-bottom:1px solid var(–border);
padding:8px 16px;display:flex;align-items:center;gap:8px;position:sticky;z-index:199;}
.warr{width:44px;height:44px;border-radius:12px;border:1.5px solid var(–border);
background:var(–inp);color:var(–text);font-size:22px;
display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.wlbl{flex:1;text-align:center;font-size:13px;font-weight:700;}
.wnow{width:44px;height:44px;border-radius:12px;border:none;
background:var(–a);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}

/* Вкладки */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;
background:var(–card);border-top:1px solid var(–border);display:flex;padding-bottom:var(–sb);}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;
padding:8px 0;border:none;background:transparent;gap:2px;}
.tbi{font-size:22px;}.tbl{font-size:10px;font-weight:500;color:var(–muted);}
.tb.on .tbl{color:var(–a);}

#content{position:fixed;top:0;left:0;right:0;bottom:0;
overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(–sb)+62px);}
#content::-webkit-scrollbar{display:none;}

/* Карточки */
.card{background:var(–card);border-radius:16px;margin:0 16px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.ch{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(–border);}
.ct{font-size:15px;font-weight:700;}.cb{font-size:12px;color:var(–muted);}

/* Привычка строка */
.hab-row{padding:14px 16px;border-bottom:1px solid var(–border);position:relative;}
.hab-row:last-child{border-bottom:none;}
.hab-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.hab-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.hab-info{flex:1;}
.hab-name{font-size:15px;font-weight:700;}
.hab-meta{display:flex;gap:8px;align-items:center;margin-top:3px;}
.hab-streak{font-size:12px;font-weight:700;color:#ff9500;}
.hab-pct{font-size:12px;color:var(–muted);}
.hab-edit{border:none;background:transparent;font-size:16px;opacity:.4;padding:4px;}

/* Дни недели чекбоксы */
.week-days{display:flex;gap:4px;}
.day-check{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.day-lbl{font-size:9px;font-weight:700;color:var(–muted);}
.day-btn{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(–border);
background:transparent;display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:700;color:var(–muted);transition:.15s;max-width:36px;}
.day-btn.done{border-color:var(–a);background:var(–a);color:#fff;}
.day-btn.today{border-color:var(–a);color:var(–a);}
.day-btn.future{opacity:.3;}

/* Статистика привычки */
.hab-stats-row{display:flex;gap:6px;margin-top:8px;}
.hab-stat{flex:1;background:var(–inp);border-radius:10px;padding:8px 6px;text-align:center;}
.hab-stat-val{font-size:14px;font-weight:800;color:var(–a);}
.hab-stat-lbl{font-size:10px;color:var(–muted);margin-top:1px;}

/* Календарь месяца для привычки */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:12px 16px;}
.mgd{aspect-ratio:1;border-radius:8px;border:none;background:var(–inp);
font-size:11px;font-weight:600;color:var(–muted);display:flex;align-items:center;justify-content:center;}
.mgd.done{background:var(–a);color:#fff;}
.mgd.today{border:2px solid var(–a);}
.mgd.empty{background:transparent;}

/* Аналитика */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;}
.sc{background:var(–card);border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.si{font-size:26px;margin-bottom:6px;}.sv{font-size:22px;font-weight:800;color:var(–a);}
.sl2{font-size:11px;color:var(–muted);margin-top:2px;}

/* Бар прогресс привычки */
.hab-progress-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(–border);}
.hab-progress-row:last-child{border-bottom:none;}
.hp-icon{font-size:20px;}
.hp-info{flex:1;}
.hp-name{font-size:13px;font-weight:600;}
.hp-bar{height:4px;background:var(–border);border-radius:2px;margin-top:4px;overflow:hidden;}
.hp-fill{height:100%;border-radius:2px;background:var(–a);transition:width .4s;}
.hp-pct{font-size:13px;font-weight:700;color:var(–a);}

/* Bottom sheets */
.bsheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;}
.bsheet.on{display:flex;}
.bsbox{width:100%;background:var(–card);border-radius:22px 22px 0 0;padding:0 20px calc(var(–sb)+16px);max-height:92vh;overflow-y:auto;}
.bsbox::-webkit-scrollbar{display:none;}
.bsh{width:40px;height:4px;background:var(–border);border-radius:2px;margin:12px auto 16px;}
.bst{font-size:18px;font-weight:700;margin-bottom:16px;}
.bsbtn{width:100%;padding:14px;border-radius:13px;border:none;font-size:16px;font-weight:700;margin-bottom:8px;}
.bsbtn.ok{background:var(–a);color:#fff;}
.bsbtn.cl{background:var(–inp);color:var(–muted);}
.bsbtn.rm{background:#ff3b30;color:#fff;}
.bs-inp{width:100%;background:var(–inp);border:none;border-radius:12px;padding:12px 14px;font-size:16px;color:var(–text);outline:none;margin-bottom:10px;}

/* Выбор цвета */
.color-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.color-dot{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;font-weight:700;}
.color-dot.on{border-color:var(–text);color:#fff;}

/* Частота */
.freq-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.freq-btn{padding:8px 14px;border-radius:10px;border:none;background:var(–inp);font-size:13px;font-weight:600;color:var(–muted);}
.freq-btn.on{background:var(–a);color:#fff;}

/* Тема */
#thOv{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;}
#thOv.on{display:block;}
#thSh{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(–card);
border-radius:22px 22px 0 0;padding:0 20px calc(var(–sb)+20px);
transform:translateY(100%);transition:transform .3s;}
#thSh.on{transform:translateY(0);}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.tdot{aspect-ratio:1;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:transparent;font-weight:700;cursor:pointer;}
.tdot.on{border-color:var(–text);color:#fff;}
.dkrow{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(–inp);border-radius:14px;cursor:pointer;}
.dkl{font-size:15px;font-weight:600;}
.sw{width:51px;height:31px;border-radius:16px;background:var(–border);position:relative;transition:.2s;}
.sw.on{background:#34c759;}.swk{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s;}
.sw.on .swk{left:22px;}

/* FAB */
#fab{position:fixed;right:20px;z-index:99;width:56px;height:56px;border-radius:50%;
background:var(–a);border:none;color:#fff;font-size:28px;box-shadow:0 4px 16px rgba(0,0,0,.2);}

.empty{text-align:center;padding:40px 20px;color:var(–muted);font-size:14px;line-height:1.7;}
.empty-i{font-size:44px;margin-bottom:10px;}

/* ПИКЕР ЭМОДЗИ */
.emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px;max-height:200px;overflow-y:auto;padding:4px;}
.emoji-picker::-webkit-scrollbar{display:none;}
.emoji-btn{aspect-ratio:1;border:2px solid var(–border);border-radius:10px;background:transparent;
display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
.emoji-btn.on{border-color:var(–a);background:var(–a2);}
.emoji-current{display:flex;align-items:center;gap:10px;padding:10px;background:var(–inp);border-radius:12px;margin-bottom:10px;}
.emoji-current-display{width:44px;height:44px;border-radius:11px;background:var(–a2);display:flex;align-items:center;justify-content:center;font-size:24px;}
.emoji-current-text{flex:1;font-size:13px;color:var(–muted);}

/* НАСТРОЙКИ */
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(–border);cursor:pointer;}
.set-row:last-child{border-bottom:none;}
.set-icon{width:36px;height:36px;border-radius:10px;background:var(–a2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.set-info{flex:1;}
.set-name{font-size:14px;font-weight:600;}
.set-desc{font-size:11px;color:var(–muted);margin-top:2px;}
.set-arrow{color:var(–muted);font-size:18px;}
</style>

</head>
<body>
<div id="sb"></div>
<div id="hdr">
  <div class="h1">
    <div class="logo">✨ Привычки</div>
    <button class="ico" onclick="openTh()">🎨</button>
  </div>
  <div class="hdr-stats">
    <div class="hstat"><div class="hstat-val" id="stat-today">0%</div><div class="hstat-lbl">Сегодня</div></div>
    <div class="hstat"><div class="hstat-val" id="stat-week">0%</div><div class="hstat-lbl">Неделя</div></div>
    <div class="hstat"><div class="hstat-val" id="stat-streak">🔥0</div><div class="hstat-lbl">Серия</div></div>
  </div>
</div>

<div id="wnav">
  <button class="warr" onclick="shW(-1)">‹</button>
  <div class="wlbl" id="wlbl"></div>
  <button class="wnow" onclick="goNow()">📅</button>
  <button class="warr" onclick="shW(1)">›</button>
</div>

<div id="content"></div>

<button id="fab" onclick="openNewHabit()">+</button>

<div id="tabs">
  <button class="tb on" onclick="setTab('today',this)"><span class="tbi">📋</span><span class="tbl">Сегодня</span></button>
  <button class="tb" onclick="setTab('week',this)"><span class="tbi">📅</span><span class="tbl">Неделя</span></button>
  <button class="tb" onclick="setTab('stats',this)"><span class="tbi">📊</span><span class="tbl">Статистика</span></button>
  <button class="tb" onclick="setTab('manage',this)"><span class="tbi">⚙️</span><span class="tbl">Привычки</span></button>
</div>

<!-- Редактор привычки -->

<div class="bsheet" id="habitSheet" onclick="closeBSheet('habitSheet',event)">
  <div class="bsbox">
    <div class="bsh"></div>
    <div class="bst" id="habit-sheet-title">Новая привычка</div>
    <input class="bs-inp" id="h-name" placeholder="Название привычки..."/>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Иконка</div>
    <div class="emoji-current">
      <div class="emoji-current-display" id="emoji-current">⭐</div>
      <div class="emoji-current-text">Выбери эмодзи ниже</div>
    </div>
    <div class="emoji-picker" id="emoji-picker"></div>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Цвет</div>
    <div class="color-grid" id="color-grid"></div>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Частота</div>
    <div class="freq-row">
      <button class="freq-btn on" id="freq-daily" onclick="setFreq('daily')">Каждый день</button>
      <button class="freq-btn" id="freq-weekdays" onclick="setFreq('weekdays')">Пн–Пт</button>
      <button class="freq-btn" id="freq-weekend" onclick="setFreq('weekend')">Сб–Вс</button>
      <button class="freq-btn" id="freq-custom" onclick="setFreq('custom')">Свои дни</button>
    </div>
    <div id="custom-days-row" style="display:none;margin-bottom:14px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((d,i)=>
          `<button class="freq-btn" id="cd-${i}" onclick="toggleCustomDay(${i})">${d}</button>`).join("")}
      </div>
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Цель (раз в день)</div>
    <input class="bs-inp" id="h-goal" type="number" placeholder="1 (по умолчанию)" inputmode="numeric"/>
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;">Напоминание</div>
    <input class="bs-inp" id="h-remind" type="time" placeholder="Время напоминания"/>
    <button class="bsbtn ok" onclick="saveHabit()">Сохранить</button>
    <button class="bsbtn rm" id="h-del-btn" onclick="deleteHabit()" style="display:none">Удалить привычку</button>
    <button class="bsbtn cl" onclick="closeBSheet('habitSheet')">Отмена</button>
  </div>
</div>

<!-- Детали привычки -->

<div class="bsheet" id="detailSheet" onclick="closeBSheet('detailSheet',event)">
  <div class="bsbox">
    <div class="bsh"></div>
    <div id="detail-content"></div>
    <button class="bsbtn cl" onclick="closeBSheet('detailSheet')">Закрыть</button>
  </div>
</div>

<!-- Тема -->

<div id="thOv" onclick="closeTh()"></div>
<div id="thSh">
  <div class="bsh" style="margin-top:12px;"></div>
  <div style="font-size:18px;font-weight:700;margin-bottom:14px;">Оформление</div>
  <div class="tgrid" id="tgrid"></div>
  <div class="dkrow" onclick="togDk()">
    <div class="dkl">🌙 Тёмный режим</div>
    <div class="sw" id="dsw"><div class="swk"></div></div>
  </div>
</div>

<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)"/>

<script>
// ── КОНСТАНТЫ ──
const SK="habits_v1";
const COLORS=["#7c5cbf","#4a9e7f","#3a7fd5","#e07b39","#c4566a","#3a9fa8","#c9a227","#e03a3a","#2ecc71","#ff9500","#0a84ff","#ff3b30"];
const DAYS_SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const THEMES=[
  {n:"Фиолетовый",a:"#7c5cbf"},{n:"Зелёный",a:"#4a9e7f"},{n:"Синий",a:"#3a7fd5"},
  {n:"Оранжевый",a:"#e07b39"},{n:"Розовый",a:"#c4566a"},{n:"Бирюзовый",a:"#3a9fa8"},
  {n:"Жёлтый",a:"#c9a227"},{n:"Красный",a:"#e03a3a"},
];

let D={habits:[],log:{}}, tab="today";
let cw=wkKey(new Date());
let ti=+(localStorage.getItem("hab_ti")||0), dk=localStorage.getItem("hab_dk")==="1";
let editHabitIdx=-1, editColor=0, editFreq="daily", editCustomDays=[0,1,2,3,4];
let editIcon="⭐";

const EMOJI_LIST=["⭐","🏃","💧","📚","🧘","💪","🍎","😴","☀️","🎯","💊","🌱","✍️","🎨","🎵","🚴","🏋️","🧠","☕","🥗","🦷","🛌","💻","📱","🚶","🏊","🎸","🎮","🍵","🥦","🥛","🍇","📖","🌿","🌞","🌙","⛹️","🏆","✨","🔥","💡","🎓","💼","📝","🧹","🛁","🪥","💰","❤️","😊","🙏","🌸","🌳","🐕","🐈","☘️"];

function buildEmojiPicker(){
  document.getElementById("emoji-picker").innerHTML=EMOJI_LIST.map(em=>
    `<button class="emoji-btn ${em===editIcon?"on":""}" onclick="pickIcon('${em}')">${em}</button>`
  ).join("");
  document.getElementById("emoji-current").textContent=editIcon;
}
function pickIcon(em){editIcon=em;buildEmojiPicker();}

function exportData(){
  const dataStr=JSON.stringify(D,null,2);
  const blob=new Blob([dataStr],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="habits-backup-"+todayStr()+".json";a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(imported.habits&&imported.log){
        if(confirm("Заменить все текущие данные?")){
          D=imported;save();render();alert("✅ Данные импортированы!");
        }
      } else alert("❌ Неверный формат файла");
    }catch(err){alert("❌ Ошибка чтения файла");}
  };
  reader.readAsText(file);
  event.target.value="";
}
function confirmReset(){
  if(confirm("⚠️ Удалить ВСЕ привычки и записи?\nЭто действие нельзя отменить!")){
    D={habits:[],log:{}};save();render();
  }
}

function load(){try{D=JSON.parse(localStorage.getItem(SK)||'{"habits":[],"log":{}}');}catch(e){D={habits:[],log:{}};}}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function getLog(){if(!D.log)D.log={};return D.log;}

// ── ДАТЫ ──
function localStr(date){
  const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;
}
function monday(date){
  const d=new Date(date),n=d.getDay(),df=n===0?-6:1-n;
  d.setDate(d.getDate()+df);d.setHours(0,0,0,0);return d;
}
function wkKey(date){return localStr(monday(date));}
function shiftKey(k,n){const p=k.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n*7);return wkKey(d);}
function todayStr(){return localStr(new Date());}
function isFuture(dateStr){return dateStr>todayStr();}
function dayOfWeek(dateStr){const p=dateStr.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);return d.getDay()===0?6:d.getDay()-1;}
function fwk(k){
  const p=k.split("-");const s=new Date(+p[0],+p[1]-1,+p[2]);const e=new Date(s);e.setDate(e.getDate()+6);
  return s.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"})+" – "+e.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"});
}
function getWeekDates(wk){
  const p=wk.split("-"),dates=[];
  for(let i=0;i<7;i++){const d=new Date(+p[0],+p[1]-1,+p[2]+i);dates.push(localStr(d));}
  return dates;
}

// ── ПРИВЫЧКА АКТИВНА В ДЕНЬ? ──
function isActiveDay(habit,dateStr){
  const dow=dayOfWeek(dateStr);
  if(habit.freq==="daily")return true;
  if(habit.freq==="weekdays")return dow<5;
  if(habit.freq==="weekend")return dow>=5;
  if(habit.freq==="custom")return(habit.customDays||[0,1,2,3,4,5,6]).includes(dow);
  return true;
}

// ── ЛОГ ──
function isChecked(habitId,dateStr){return!!(getLog()[dateStr]&&getLog()[dateStr][habitId]);}
function toggle(habitId,dateStr){
  if(isFuture(dateStr))return;
  if(!getLog()[dateStr])getLog()[dateStr]={};
  getLog()[dateStr][habitId]=!getLog()[dateStr][habitId];
  save();render();
}

// ── СТАТИСТИКА ──
function getStreak(habit){
  let streak=0,d=new Date();
  for(let i=0;i<365;i++){
    const ds=localStr(d);
    if(isFuture(ds)){d.setDate(d.getDate()-1);continue;}
    if(!isActiveDay(habit,ds)){d.setDate(d.getDate()-1);continue;}
    if(isChecked(habit.id,ds)){streak++;}
    else if(i>0){break;}
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function getMonthPct(habit,year,month){
  let total=0,done=0;
  const daysInM=new Date(year,month+1,0).getDate();
  for(let d=1;d<=daysInM;d++){
    const ds=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    if(isFuture(ds))continue;
    if(!isActiveDay(habit,ds))continue;
    total++;
    if(isChecked(habit.id,ds))done++;
  }
  return total?Math.round(done/total*100):0;
}
function getWeekPct(habit,wk){
  const dates=getWeekDates(wk);
  let total=0,done=0;
  dates.forEach(ds=>{
    if(isFuture(ds))return;
    if(!isActiveDay(habit,ds))return;
    total++;if(isChecked(habit.id,ds))done++;
  });
  return total?Math.round(done/total*100):0;
}
function getTodayPct(){
  const today=todayStr();
  const active=D.habits.filter(h=>isActiveDay(h,today));
  if(!active.length)return 0;
  const done=active.filter(h=>isChecked(h.id,today)).length;
  return Math.round(done/active.length*100);
}
function getWeekOverallPct(){
  const dates=getWeekDates(cw);
  let total=0,done=0;
  D.habits.forEach(h=>{
    dates.forEach(ds=>{
      if(isFuture(ds))return;
      if(!isActiveDay(h,ds))return;
      total++;if(isChecked(h.id,ds))done++;
    });
  });
  return total?Math.round(done/total*100):0;
}
function getBestStreak(){
  if(!D.habits.length)return 0;
  return Math.max(...D.habits.map(h=>getStreak(h)));
}

  document.querySelector("meta[name=theme-color]").content=t.a;
}

}

// ── СЕГОДНЯ ──
function renderToday(){
  const today=todayStr();
  const active=D.habits.filter(h=>isActiveDay(h,today));
  if(!active.length)return`<div style="height:12px"></div><div class="empty"><div class="empty-i">✨</div>Нет привычек.<br>Нажмите + чтобы добавить первую!</div>`;

  const done=active.filter(h=>isChecked(h.id,today)).length;
  const pct=Math.round(done/active.length*100);

  const rows=active.map(h=>{
    const checked=isChecked(h.id,today);
    const streak=getStreak(h);
    return`<div class="hab-row" onclick="toggle('${h.id}','${today}')">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="hab-icon" style="background:${h.color}22">${h.icon||"⭐"}</div>
        <div style="flex:1">
          <div class="hab-name" style="${checked?"text-decoration:line-through;opacity:.5":""}">${esc(h.name)}</div>
          <div class="hab-meta">
            ${streak>0?`<span class="hab-streak">🔥 ${streak} дней</span>`:""}
            ${h.remind?`<span style="font-size:11px;color:var(--muted)">🕐 ${h.remind}</span>`:""}
          </div>
        </div>
        <div style="width:32px;height:32px;border-radius:50%;border:2px solid ${checked?h.color:"var(--border)"};
          background:${checked?h.color:"transparent"};display:flex;align-items:center;justify-content:center;
          font-size:16px;color:#fff;flex-shrink:0;transition:.15s;">
          ${checked?"✓":""}
        </div>
      </div>
    </div>`;
  }).join("");

  return`<div style="height:12px"></div>
    <div class="card">
      <div class="ch">
        <span class="ct">Сегодня</span>
        <span class="cb">${done}/${active.length} · ${pct}%</span>
      </div>
      <div style="padding:10px 16px;border-bottom:1px solid var(--border)">
        <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="height:100%;background:var(--a);width:${pct}%;border-radius:4px;transition:width .4s"></div>
        </div>
      </div>
      ${rows}
    </div>`;
}

// ── НЕДЕЛЯ ──
function renderWeek(){
  const dates=getWeekDates(cw);
  const today=todayStr();
  if(!D.habits.length)return`<div style="height:12px"></div><div class="empty"><div class="empty-i">📅</div>Нет привычек.</div>`;

  const rows=D.habits.map(h=>{
    const weekPct=getWeekPct(h,cw);
    const streak=getStreak(h);
    const dayCols=dates.map((ds,i)=>{
      const active=isActiveDay(h,ds);
      const future=isFuture(ds);
      const checked=isChecked(h.id,ds);
      const isToday=ds===today;
      return`<div class="day-check">
        <div class="day-lbl">${DAYS_SHORT[i]}</div>
        <button class="day-btn ${checked?"done":""} ${isToday&&!checked?"today":""} ${future?"future":""}"
          onclick="${!future&&active?"toggle('"+h.id+"','"+ds+"')":"''"};event.stopPropagation()">
          ${checked?"✓":active?(future?"·":"·"):"—"}
        </button>
      </div>`;
    }).join("");
    return`<div class="hab-row">
      <div class="hab-top">
        <div class="hab-icon" style="background:${h.color}22">${h.icon||"⭐"}</div>
        <div class="hab-info">
          <div class="hab-name">${esc(h.name)}</div>
          <div class="hab-meta">
            ${streak>0?`<span class="hab-streak">🔥${streak}</span>`:""}
            <span class="hab-pct">${weekPct}% за неделю</span>
          </div>
        </div>
      </div>
      <div class="week-days">${dayCols}</div>
    </div>`;
  }).join("");

  // Итоговая строка по дням
  const dayTotals=dates.map(ds=>{
    const active=D.habits.filter(h=>isActiveDay(h,ds)&&!isFuture(ds));
    if(!active.length)return`<div class="day-check"><div class="day-lbl" style="opacity:0">·</div><div style="height:32px"></div></div>`;
    const done=active.filter(h=>isChecked(h.id,ds)).length;
    const pct=Math.round(done/active.length*100);
    const isToday=ds===todayStr();
    return`<div class="day-check">
      <div class="day-lbl"></div>
      <div style="width:100%;max-width:36px;padding:4px 2px;border-radius:8px;background:${pct===100?"var(--a)":"var(--inp)"};
        text-align:center;font-size:9px;font-weight:700;color:${pct===100?"#fff":"var(--muted)"};
        border:${isToday?"2px solid var(--a)":"2px solid transparent"}">${pct}%</div>
    </div>`;
  }).join("");

  return`<div style="height:12px"></div>
    <div class="card">
      <div class="ch"><span class="ct">Неделя</span><span class="cb">${fwk(cw)}</span></div>
      ${rows}
      <div style="padding:8px 16px 12px;border-top:1px solid var(--border)">
        <div style="display:flex;gap:4px" class="week-days">${dayTotals}</div>
      </div>
    </div>`;
}

// ── СТАТИСТИКА ──
function renderStats(){
  if(!D.habits.length)return`<div style="height:12px"></div><div class="empty"><div class="empty-i">📊</div>Нет привычек.</div>`;

  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth();

  const rows=D.habits.map(h=>{
    const monthPct=getMonthPct(h,y,m);
    const streak=getStreak(h);
    return`<div class="hab-progress-row">
      <div class="hp-icon">${h.icon||"⭐"}</div>
      <div class="hp-info">
        <div class="hp-name">${esc(h.name)} ${streak>0?`🔥${streak}`:""}</div>
        <div class="hp-bar"><div class="hp-fill" style="width:${monthPct}%;background:${h.color}"></div></div>
      </div>
      <div class="hp-pct" style="color:${h.color}">${monthPct}%</div>
    </div>`;
  }).join("");

  // Календарь текущего месяца для лучшей привычки
  const best=D.habits.reduce((b,h)=>getMonthPct(h,y,m)>getMonthPct(b,y,m)?h:b,D.habits[0]);
  const daysInM=new Date(y,m+1,0).getDate();
  const firstDow=new Date(y,m,1).getDay()===0?6:new Date(y,m,1).getDay()-1;
  let calHtml="";
  for(let i=0;i<firstDow;i++)calHtml+=`<div class="mgd empty"></div>`;
  for(let d=1;d<=daysInM;d++){
    const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const isToday=ds===todayStr();
    const active=isActiveDay(best,ds)&&!isFuture(ds);
    const checked=isChecked(best.id,ds);
    calHtml+=`<div class="mgd ${checked&&active?"done":""} ${isToday?"today":""}" style="${checked&&active?"background:"+best.color:""}">${d}</div>`;
  }

  return`<div style="height:12px"></div>
    <div class="stats-grid">
      <div class="sc"><div class="si">📅</div><div class="sv">${getTodayPct()}%</div><div class="sl2">Сегодня</div></div>
      <div class="sc"><div class="si">🔥</div><div class="sv">${getBestStreak()}</div><div class="sl2">Лучшая серия</div></div>
      <div class="sc"><div class="si">✅</div><div class="sv">${getWeekOverallPct()}%</div><div class="sl2">Эта неделя</div></div>
      <div class="sc"><div class="si">📊</div><div class="sv">${D.habits.length}</div><div class="sl2">Привычек</div></div>
    </div>
    <div class="card"><div class="ch"><span class="ct">За этот месяц</span></div><div style="padding:0 16px">${rows}</div></div>
    ${best?`<div class="card">
      <div class="ch"><span class="ct">${best.icon} ${esc(best.name)}</span><span class="cb">Лучшая привычка</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 16px 14px">
        ${DAYS_SHORT.map(d=>`<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0">${d}</div>`).join("")}
        ${calHtml}
      </div>
    </div>`:""}`;
}

// ── РЕДАКТОР ПРИВЫЧЕК ──
const HABIT_COLORS=["#7c5cbf","#4a9e7f","#3a7fd5","#e07b39","#c4566a","#3a9fa8","#c9a227","#e03a3a","#2ecc71","#ff9500","#0a84ff","#ff3b30"];

function buildColorGrid(){
  document.getElementById("color-grid").innerHTML=HABIT_COLORS.map((c,i)=>
    `<div class="color-dot ${i===editColor?"on":""}" style="background:${c}" onclick="pickColor(${i})">✓</div>`
  ).join("");
}
function pickColor(i){editColor=i;buildColorGrid();}
function setFreq(f){
  editFreq=f;
  ["daily","weekdays","weekend","custom"].forEach(x=>{
    document.getElementById("freq-"+x)?.classList.toggle("on",x===f);
  });
  document.getElementById("custom-days-row").style.display=f==="custom"?"block":"none";
}
function toggleCustomDay(i){
  if(editCustomDays.includes(i))editCustomDays=editCustomDays.filter(x=>x!==i);
  else editCustomDays.push(i);
  editCustomDays.forEach((_,j)=>{});
  [0,1,2,3,4,5,6].forEach(d=>{
    document.getElementById("cd-"+d)?.classList.toggle("on",editCustomDays.includes(d));
  });
}

function openNewHabit(){
  editHabitIdx=-1;editColor=0;editFreq="daily";editCustomDays=[0,1,2,3,4];
  editIcon="⭐";
  document.getElementById("habit-sheet-title").textContent="Новая привычка";
  document.getElementById("h-name").value="";
  document.getElementById("h-goal").value="";
  document.getElementById("h-remind").value="";
  document.getElementById("h-del-btn").style.display="none";
  buildColorGrid();buildEmojiPicker();setFreq("daily");
  openBSheet("habitSheet");
}
function openEditHabit(i){
  editHabitIdx=i;
  const h=D.habits[i];
  editColor=HABIT_COLORS.indexOf(h.color);if(editColor<0)editColor=0;
  editFreq=h.freq||"daily";
  editCustomDays=h.customDays||[0,1,2,3,4];
  editIcon=h.icon||"⭐";
  document.getElementById("habit-sheet-title").textContent="Изменить привычку";
  document.getElementById("h-name").value=h.name||"";
  document.getElementById("h-goal").value=h.goal||"";
  document.getElementById("h-remind").value=h.remind||"";
  document.getElementById("h-del-btn").style.display="block";
  buildColorGrid();buildEmojiPicker();setFreq(editFreq);
  [0,1,2,3,4,5,6].forEach(d=>{
    document.getElementById("cd-"+d)?.classList.toggle("on",editCustomDays.includes(d));
  });
  openBSheet("habitSheet");
}
function saveHabit(){
  const name=document.getElementById("h-name").value.trim();
  if(!name)return;
  const habit={
    id:editHabitIdx>=0?D.habits[editHabitIdx].id:"h"+Date.now(),
    name,
    icon:editIcon||"⭐",
    color:HABIT_COLORS[editColor]||HABIT_COLORS[0],
    freq:editFreq,
    customDays:[...editCustomDays],
    goal:+(document.getElementById("h-goal").value)||1,
    remind:document.getElementById("h-remind").value||"",
  };
  if(editHabitIdx>=0)D.habits[editHabitIdx]=habit;
  else D.habits.push(habit);
  save();closeBSheet("habitSheet");render();
}
function deleteHabit(){
  D.habits.splice(editHabitIdx,1);
  save();closeBSheet("habitSheet");render();
}

// ── BOTTOM SHEETS ──
function openBSheet(id){document.getElementById(id).classList.add("on");}
function closeBSheet(id,e){
  if(!e||e.target===document.getElementById(id))
    document.getElementById(id).classList.remove("on");
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ── РЕНДЕР ──
function render(){
  renderHeader();
  const m=document.getElementById("content");
  if(tab==="today")      m.innerHTML=renderToday();
  else if(tab==="week")  m.innerHTML=renderWeek();
  else if(tab==="stats") m.innerHTML=renderStats();
  else if(tab==="manage")m.innerHTML=renderManage();
  m.scrollTop=0;
}

// ── СТАРТ ──
load();applyTheme();buildTGrid();buildColorGrid();render();
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save();});
window.addEventListener("resize",renderHeader);
</script>
