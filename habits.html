<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Привычки"/>
<meta name="theme-color" content="#7c5cbf"/>
<title>Трекер привычек</title>
<style>
:root{--a:#7c5cbf;--a2:rgba(124,92,191,.12);--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--border:#e5e5ea;--inp:#f2f2f7;--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,20px);}
.dk{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#636366;--border:#2c2c2e;--inp:#2c2c2e;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;position:fixed;width:100%;}
input,textarea,select,button{font-family:inherit;font-size:16px;}
button{cursor:pointer;}
#app{display:flex;flex-direction:column;height:100vh;width:100%;position:fixed;top:0;left:0;}
#topbar{flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);}
#sb{height:var(--st);}
.h1{display:flex;align-items:center;gap:8px;padding:10px 16px 0;}
.logo{font-size:20px;font-weight:800;color:var(--a);flex:1;}
.ico{width:38px;height:38px;border-radius:12px;border:none;background:var(--inp);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.top-extra{padding:8px 16px 12px;}
.hdr-stats{display:flex;gap:8px;}
.hstat{flex:1;background:var(--a2);border-radius:12px;padding:8px;text-align:center;cursor:pointer;border:none;color:var(--text);}
.hstat-val{font-size:16px;font-weight:800;color:var(--a);}
.hstat-lbl{font-size:10px;color:var(--muted);margin-top:1px;}
.weekgraph{display:flex;gap:3px;align-items:flex-end;height:32px;margin-top:8px;}
.wgcol{flex:1;background:var(--a2);border-radius:3px;min-height:3px;position:relative;display:flex;align-items:flex-end;justify-content:center;}
.wgfill{width:100%;background:var(--a);border-radius:3px;}
.wglbl{position:absolute;bottom:-14px;font-size:8px;color:var(--muted);font-weight:600;}
#wnav{flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:8px;}
.warr{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);background:var(--inp);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}
.wlbl{flex:1;text-align:center;font-size:13px;font-weight:700;background:var(--inp);border-radius:12px;padding:10px 8px;cursor:pointer;border:none;color:var(--text);min-height:40px;}
.wlbl:active{background:var(--border);}
.wnow{width:40px;height:40px;border-radius:12px;border:none;background:var(--a);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:#fff;}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 0 calc(150px + var(--sb));}
#content::-webkit-scrollbar{display:none;}
#tabs{flex-shrink:0;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb);}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;border:none;background:transparent;gap:2px;cursor:pointer;}
.tbi{font-size:22px;}
.tbl{font-size:10px;font-weight:500;color:var(--muted);}
.tb.on .tbl{color:var(--a);}
.card{background:var(--card);border-radius:16px;margin:0 16px 12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.ch{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.ct{font-size:15px;font-weight:700;}
.cb{font-size:12px;color:var(--muted);}
.hab-row{padding:14px 16px;border-bottom:1px solid var(--border);position:relative;cursor:pointer;}
.hab-row:last-child{border-bottom:none;}
.hab-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.hab-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.hab-info{flex:1;min-width:0;}
.hab-name{font-size:15px;font-weight:700;}
.hab-meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.hab-streak{font-size:12px;font-weight:700;color:#ff9500;}
.hab-pct{font-size:12px;color:var(--muted);}
.week-days{display:flex;gap:4px;}
.day-check{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.day-lbl{font-size:9px;font-weight:700;color:var(--muted);}
.day-btn{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);transition:.15s;max-width:36px;cursor:pointer;}
.day-btn.done{border-color:var(--a);background:var(--a);color:#fff;}
.day-btn.today{border-color:var(--a);color:var(--a);}
.day-btn.future{opacity:.3;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px;}
.sc{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;border:none;text-align:left;color:var(--text);}
.sc:active{transform:scale(.97);}
.si{font-size:22px;margin-bottom:4px;}
.sv{font-size:18px;font-weight:800;color:var(--a);}
.sl2{font-size:11px;color:var(--muted);margin-top:2px;}
.sc-expand{font-size:10px;color:var(--a);margin-top:4px;}
.detail-box{background:var(--inp);border-radius:12px;padding:12px;margin-bottom:10px;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-lbl{font-size:13px;color:var(--muted);}
.detail-val{font-size:14px;font-weight:700;}
.hab-progress-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.hab-progress-row:last-child{border-bottom:none;}
.hp-icon{font-size:20px;}
.hp-info{flex:1;min-width:0;}
.hp-name{font-size:13px;font-weight:600;}
.hp-bar{height:4px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.hp-fill{height:100%;border-radius:2px;background:var(--a);transition:width .4s;}
.hp-pct{font-size:13px;font-weight:700;color:var(--a);}
.cal-container{padding:10px 14px 14px;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px;}
.cal-day-header{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:2px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);background:transparent;}
.cal-cell.done{background:var(--a);color:#fff;border-color:var(--a);}
.cal-cell.today{border:2px solid var(--a);background:rgba(124,92,191,.1);}
.cal-cell.empty{background:transparent;border:none;}
.bsheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;}
.bsheet.on{display:flex;}
.bsbox{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:0 16px calc(var(--sb)+12px);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.bsbox::-webkit-scrollbar{display:none;}
.bsh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:8px auto 12px;}
.bst{font-size:16px;font-weight:700;margin-bottom:12px;}
.bsbtn{width:100%;padding:12px;border-radius:11px;border:none;font-size:14px;font-weight:700;margin-bottom:7px;cursor:pointer;}
.bsbtn.ok{background:var(--a);color:#fff;}
.bsbtn.cl{background:var(--inp);color:var(--muted);}
.bsbtn.rm{background:#ff3b30;color:#fff;}
.bs-inp{width:100%;background:var(--inp);border:none;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);outline:none;margin-bottom:8px;}
.bs-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px;}
.icon-pick{aspect-ratio:1;border:1.5px solid var(--border);border-radius:7px;background:transparent;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;}
.icon-pick.on{border-color:var(--a);background:var(--a2);}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px;}
.color-dot{aspect-ratio:1;border-radius:50%;border:2.5px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;font-weight:700;}
.color-dot.on{border-color:var(--text);color:#fff;}
.freq-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px;}
.freq-btn{padding:9px 8px;border-radius:9px;border:none;background:var(--inp);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.freq-btn.on{background:var(--a);color:#fff;}
.cd-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.cd-btn{flex:1;min-width:38px;padding:8px;border-radius:9px;border:none;background:var(--inp);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
.cd-btn.on{background:var(--a);color:#fff;}
.cal-pick-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cal-pick-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--inp);font-size:18px;color:var(--text);cursor:pointer;}
.cal-pick-month{flex:1;text-align:center;font-size:15px;font-weight:700;}
.cal-pick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px;}
.cp-d{padding:8px 2px;border-radius:9px;border:none;background:transparent;font-size:13px;color:var(--text);text-align:center;cursor:pointer;}
.cp-d.oth{color:var(--muted);opacity:.5;}
.cp-d.tod{color:var(--a);font-weight:800;}
.cp-d.inw{background:rgba(124,92,191,.15);color:var(--a);font-weight:600;}
#thOv{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;}
#thOv.on{display:block;}
#thSh{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--card);border-radius:22px 22px 0 0;padding:0 20px calc(var(--sb)+20px);transform:translateY(100%);transition:transform .3s;max-height:85vh;overflow-y:auto;}
#thSh.on{transform:translateY(0);}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.tdot{aspect-ratio:1;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;color:transparent;font-weight:700;cursor:pointer;}
.tdot.on{border-color:var(--text);color:#fff;}
.dkrow{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--inp);border-radius:14px;cursor:pointer;}
.dkl{font-size:15px;font-weight:600;}
.sw{width:51px;height:31px;border-radius:16px;background:var(--border);position:relative;transition:.2s;}
.sw.on{background:#34c759;}
.swk{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s;}
.sw.on .swk{left:22px;}
#fab{position:fixed;right:16px;bottom:calc(var(--sb)+72px);width:50px;height:50px;border-radius:50%;background:var(--a);border:none;color:#fff;font-size:26px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:99;display:flex;align-items:center;justify-content:center;opacity:.92;}
#fab:active{opacity:1;transform:scale(.95);}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;line-height:1.7;}
.empty-i{font-size:44px;margin-bottom:10px;}
.notif-banner{margin:0 16px 12px;padding:12px;background:#ff950022;border-radius:12px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.notif-banner-text{flex:1;font-size:12px;color:#ff9500;font-weight:600;}
</style>
</head><body>

<script>
const SK="habits_v1";
const HABIT_COLORS=["#7c5cbf","#4a9e7f","#3a7fd5","#e07b39","#c4566a","#3a9fa8","#c9a227","#e03a3a"];
const HABIT_ICONS=["⭐","🏃","💧","📚","🧘","💪","🍎","😴","☀️","🎯","💊","🌱","✍️","🎨","🎵","🚴","🏋️","🧠","☕","🥗","🦷","🛌","💻","📱"];
const DAYS_SHORT=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const THEMES=[{n:"Фиолетовый",a:"#7c5cbf"},{n:"Зелёный",a:"#4a9e7f"},{n:"Синий",a:"#3a7fd5"},{n:"Оранжевый",a:"#e07b39"},{n:"Розовый",a:"#c4566a"},{n:"Бирюзовый",a:"#3a9fa8"},{n:"Жёлтый",a:"#c9a227"},{n:"Красный",a:"#e03a3a"}];

let D={habits:[],log:{}}, tab=“today”, cw=wkKey(new Date());
let ti=+(localStorage.getItem(“hab_ti”)||0), dk=localStorage.getItem(“hab_dk”)===“1”;
let editHabitIdx=-1, editColor=0, editIcon=0, editFreq=“daily”, editCustomDays=[0,1,2,3,4];
let calPickDate=new Date();

function load(){try{D=JSON.parse(localStorage.getItem(SK)||’{“habits”:[],“log”:{}}’);}catch(e){D={habits:[],log:{}};}}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function getLog(){if(!D.log)D.log={};return D.log;}

function localStr(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,“0”),d=String(date.getDate()).padStart(2,“0”);return y+”-”+m+”-”+d;}
function monday(date){const d=new Date(date),n=d.getDay(),df=n===0?-6:1-n;d.setDate(d.getDate()+df);d.setHours(0,0,0,0);return d;}
function wkKey(date){return localStr(monday(date));}
function shiftKey(k,n){const p=k.split(”-”);const d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n*7);return wkKey(d);}
function todayStr(){return localStr(new Date());}
function isFuture(dateStr){return dateStr>todayStr();}
function dayOfWeek(dateStr){const p=dateStr.split(”-”);const d=new Date(+p[0],+p[1]-1,+p[2]);return d.getDay()===0?6:d.getDay()-1;}
function fwk(k){const p=k.split(”-”);const s=new Date(+p[0],+p[1]-1,+p[2]);const e=new Date(s);e.setDate(e.getDate()+6);return s.toLocaleDateString(“ru-RU”,{day:“2-digit”,month:“short”})+” – “+e.toLocaleDateString(“ru-RU”,{day:“2-digit”,month:“short”});}
function getWeekDates(wk){const p=wk.split(”-”),dates=[];for(let i=0;i<7;i++){const d=new Date(+p[0],+p[1]-1,+p[2]+i);dates.push(localStr(d));}return dates;}

function isActiveDay(habit,dateStr){const dow=dayOfWeek(dateStr);if(habit.freq===“daily”)return true;if(habit.freq===“weekdays”)return dow<5;if(habit.freq===“weekend”)return dow>=5;if(habit.freq===“custom”)return(habit.customDays||[0,1,2,3,4,5,6]).includes(dow);return true;}
function isChecked(habitId,dateStr){return!!(getLog()[dateStr]&&getLog()[dateStr][habitId]);}
function toggle(habitId,dateStr){if(isFuture(dateStr))return;if(!getLog()[dateStr])getLog()[dateStr]={};getLog()[dateStr][habitId]=!getLog()[dateStr][habitId];save();render();}

function getStreak(habit){let streak=0,d=new Date();for(let i=0;i<365;i++){const ds=localStr(d);if(isFuture(ds)){d.setDate(d.getDate()-1);continue;}if(!isActiveDay(habit,ds)){d.setDate(d.getDate()-1);continue;}if(isChecked(habit.id,ds)){streak++;}else if(i>0){break;}d.setDate(d.getDate()-1);}return streak;}
function getMonthPct(habit,year,month){let total=0,done=0;const daysInM=new Date(year,month+1,0).getDate();for(let d=1;d<=daysInM;d++){const ds=year+”-”+String(month+1).padStart(2,“0”)+”-”+String(d).padStart(2,“0”);if(isFuture(ds))continue;if(!isActiveDay(habit,ds))continue;total++;if(isChecked(habit.id,ds))done++;}return total?Math.round(done/total*100):0;}
function getWeekPct(habit,wk){const dates=getWeekDates(wk);let total=0,done=0;dates.forEach(ds=>{if(isFuture(ds))return;if(!isActiveDay(habit,ds))return;total++;if(isChecked(habit.id,ds))done++;});return total?Math.round(done/total*100):0;}
function getTodayPct(){const today=todayStr();const active=D.habits.filter(h=>isActiveDay(h,today));if(!active.length)return 0;const done=active.filter(h=>isChecked(h.id,today)).length;return Math.round(done/active.length*100);}
function getWeekOverallPct(){const dates=getWeekDates(cw);let total=0,done=0;D.habits.forEach(h=>{dates.forEach(ds=>{if(isFuture(ds))return;if(!isActiveDay(h,ds))return;total++;if(isChecked(h.id,ds))done++;});});return total?Math.round(done/total*100):0;}
function getBestStreak(){if(!D.habits.length)return 0;return Math.max(…D.habits.map(h=>getStreak(h)));}
function getFocusHabit(){if(!D.habits.length)return null;const now=new Date();let worst=D.habits[0],worstPct=getMonthPct(D.habits[0],now.getFullYear(),now.getMonth());D.habits.forEach(h=>{const p=getMonthPct(h,now.getFullYear(),now.getMonth());if(p<worstPct){worst=h;worstPct=p;}});return worst;}

function buildTGrid(){document.getElementById(“tgrid”).innerHTML=THEMES.map((t,i)=>`<div class="tdot ${i===ti?"on":""}" style="background:${t.a}" onclick="pickT(${i})">✓</div>`).join(””);}
function pickT(i){ti=i;localStorage.setItem(“hab_ti”,i);applyTheme();buildTGrid();render();}
function togDk(){dk=!dk;localStorage.setItem(“hab_dk”,dk?“1”:“0”);applyTheme();render();}

function buildWeekGraph(){

const active=D.habits.filter(h=>isActiveDay(h,ds)&&!isFuture(ds));

return `<div class="wgcol" style="${isToday?"background:rgba(124,92,191,.25)":""}"><div class="wgfill" style="height:${pct}%"></div><div class="wglbl">${DAYS_SHORT[i].charAt(0)}</div></div>`;

document.getElementById(“weekgraph”).innerHTML=html;
}

return ‘<div class="hab-progress-row" onclick="openHabitDetail(\''+h.id+'\')"><div class="hp-icon">’+(h.icon||“⭐”)+’</div><div class="hp-info"><div class="hp-name">’+esc(h.name)+’ ‘+(streak>0?‘🔥’+streak:””)+’</div><div class="hp-bar"><div class="hp-fill" style="width:'+monthPct+'%;background:'+h.color+'"></div></div></div><div class="hp-pct" style="color:'+h.color+'">’+monthPct+’%</div></div>’;

const best=D.habits.reduce((b,h)=>getMonthPct(h,y,m)>getMonthPct(b,y,m)?h:b,D.habits[0]);

}

function openHabitDetail(habitId){
const h=D.habits.find(x=>x.id===habitId);
if(!h)return;
const now=new Date();
const mp=getMonthPct(h,now.getFullYear(),now.getMonth());
const wp=getWeekPct(h,wkKey(new Date()));
const s=getStreak(h);
const daysInM=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
const firstDow=new Date(now.getFullYear(),now.getMonth(),1).getDay()===0?6:new Date(now.getFullYear(),now.getMonth(),1).getDay()-1;
let calHtml=””;
for(let i=0;i<firstDow;i++)calHtml+=’<div class="cal-cell empty"></div>’;
for(let d=1;d<=daysInM;d++){
const ds=now.getFullYear()+”-”+String(now.getMonth()+1).padStart(2,“0”)+”-”+String(d).padStart(2,“0”);
const isToday=ds===todayStr();
const active=isActiveDay(h,ds)&&!isFuture(ds);
const checked=isChecked(h.id,ds);
calHtml+=’<div class=“cal-cell ‘+(checked&&active?“done”:””)+’ ‘+(isToday?“today”:””)+’” style=”’+(checked&&active?“background:”+h.color:””)+’”>’+d+’</div>’;
}
const freqText=h.freq===“daily”?“Каждый день”:h.freq===“weekdays”?“Пн–Пт”:h.freq===“weekend”?“Сб–Вс”:“Свои дни”;
const headers=DAYS_SHORT.map(d=>’<div class="cal-day-header">’+d+’</div>’).join(””);
const html=’<div style="padding:14px;background:'+h.color+'22;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;"><span style="font-size:32px">’+h.icon+’</span><div><div style="font-size:18px;font-weight:700">’+esc(h.name)+’</div>’+(h.note?’<div style="font-size:12px;color:var(--muted);margin-top:2px">”’+esc(h.note)+’”</div>’:””)+’</div></div><div class="detail-box"><div class="detail-row"><span class="detail-lbl">За месяц</span><span class="detail-val" style="color:'+h.color+'">’+mp+’%</span></div><div class="detail-row"><span class="detail-lbl">За неделю</span><span class="detail-val">’+wp+’%</span></div><div class="detail-row"><span class="detail-lbl">Серия</span><span class="detail-val">🔥 ‘+s+’</span></div><div class="detail-row"><span class="detail-lbl">Частота</span><span class="detail-val">’+freqText+’</span></div></div><div class="bs-lbl">Календарь месяца</div><div class="cal-head">’+headers+’</div><div class="cal-grid">’+calHtml+’</div>’;
document.getElementById(“detail-content”).innerHTML=html;
openBSheet(“detailSheet”);
}

function buildIconGrid(){document.getElementById(“icon-grid”).innerHTML=HABIT_ICONS.map((c,i)=>’<div class=“icon-pick ‘+(i===editIcon?“on”:””)+’” onclick=“pickIcon(’+i+’)”>’+c+’</div>’).join(””);}
function pickIcon(i){editIcon=i;buildIconGrid();}
function buildColorGrid(){document.getElementById(“color-grid”).innerHTML=HABIT_COLORS.map((c,i)=>’<div class=“color-dot ‘+(i===editColor?“on”:””)+’” style=“background:’+c+’” onclick=“pickColor(’+i+’)”>✓</div>’).join(””);}
function pickColor(i){editColor=i;buildColorGrid();}
function setFreq(f){editFreq=f;[“daily”,“weekdays”,“weekend”,“custom”].forEach(x=>{const el=document.getElementById(“freq-”+x);if(el)el.classList.toggle(“on”,x===f);});document.getElementById(“custom-days-row”).style.display=f===“custom”?“block”:“none”;if(f===“custom”)renderCustomDays();}
function renderCustomDays(){document.getElementById(“custom-days”).innerHTML=[0,1,2,3,4,5,6].map(i=>’<button class=“cd-btn ‘+(editCustomDays.includes(i)?“on”:””)+’” onclick=“toggleCustomDay(’+i+’)”>’+DAYS_SHORT[i]+’</button>’).join(””);}
function toggleCustomDay(i){if(editCustomDays.includes(i))editCustomDays=editCustomDays.filter(x=>x!==i);else editCustomDays.push(i);renderCustomDays();}

function openNewHabit(){
editHabitIdx=-1;editColor=Math.floor(Math.random()*HABIT_COLORS.length);editIcon=0;editFreq=“daily”;editCustomDays=[0,1,2,3,4];
document.getElementById(“habit-sheet-title”).textContent=“Новая привычка”;
document.getElementById(“h-name”).value=””;
document.getElementById(“h-remind”).value=””;
document.getElementById(“h-note”).value=””;
document.getElementById(“h-del-btn”).style.display=“none”;
buildIconGrid();buildColorGrid();setFreq(“daily”);
openBSheet(“habitSheet”);
}
function openEditHabit(i){
editHabitIdx=i;
const h=D.habits[i];
editColor=HABIT_COLORS.indexOf(h.color);if(editColor<0)editColor=0;
editIcon=HABIT_ICONS.indexOf(h.icon);if(editIcon<0)editIcon=0;
editFreq=h.freq||“daily”;
editCustomDays=h.customDays||[0,1,2,3,4];
document.getElementById(“habit-sheet-title”).textContent=“Изменить привычку”;
document.getElementById(“h-name”).value=h.name||””;
document.getElementById(“h-remind”).value=h.remind||””;
document.getElementById(“h-note”).value=h.note||””;
document.getElementById(“h-del-btn”).style.display=“block”;
buildIconGrid();buildColorGrid();setFreq(editFreq);
openBSheet(“habitSheet”);
}
function saveHabit(){
const name=document.getElementById(“h-name”).value.trim();
if(!name)return;
const remindVal=document.getElementById(“h-remind”).value;
const habit={
id:editHabitIdx>=0?D.habits[editHabitIdx].id:“h”+Date.now(),
name:name,
icon:HABIT_ICONS[editIcon]||“⭐”,
color:HABIT_COLORS[editColor]||HABIT_COLORS[0],
freq:editFreq,
customDays:[…editCustomDays],
remind:remindVal||””,
note:document.getElementById(“h-note”).value.trim()||””
};
if(editHabitIdx>=0)D.habits[editHabitIdx]=habit;
else D.habits.push(habit);
save();
if(remindVal&&“Notification” in window&&Notification.permission===“default”)Notification.requestPermission();
closeBSheet(“habitSheet”);render();
}
function deleteHabit(){if(!confirm(“Удалить привычку?”))return;D.habits.splice(editHabitIdx,1);save();closeBSheet(“habitSheet”);render();}

function openWeekPicker(){const p=cw.split(”-”);calPickDate=new Date(+p[0],+p[1]-1,+p[2]);renderCalPick();openBSheet(“calPickSheet”);}
function calPickMo(n){calPickDate.setMonth(calPickDate.getMonth()+n);renderCalPick();}
function renderCalPick(){
const y=calPickDate.getFullYear(),m=calPickDate.getMonth();
document.getElementById(“cal-pick-month”).textContent=calPickDate.toLocaleDateString(“ru-RU”,{month:“long”,year:“numeric”});
const first=new Date(y,m,1),startDay=(first.getDay()===0?6:first.getDay()-1);
const daysInM=new Date(y,m+1,0).getDate();
const today=new Date();today.setHours(0,0,0,0);
let html=’<div class="cal-day-header">Пн</div><div class="cal-day-header">Вт</div><div class="cal-day-header">Ср</div><div class="cal-day-header">Чт</div><div class="cal-day-header">Пт</div><div class="cal-day-header">Сб</div><div class="cal-day-header">Вс</div>’;
const prev=new Date(y,m,0).getDate();
for(let i=startDay-1;i>=0;i–)html+=’<button class="cp-d oth" onclick="pickDay('+y+','+(m===0?11:m-1)+','+(prev-i)+')">’+(prev-i)+’</button>’;
for(let d=1;d<=daysInM;d++){
const date=new Date(y,m,d);
const isToday=date.getTime()===today.getTime();
const inw=wkKey(date)===cw;
let cls=“cp-d”;
if(inw)cls+=” inw”;
if(isToday&&!inw)cls+=” tod”;
html+=’<button class="'+cls+'" onclick="pickDay('+y+','+m+','+d+')">’+d+’</button>’;
}
document.getElementById(“cal-pick-grid”).innerHTML=html;
}
function pickDay(y,m,d){cw=wkKey(new Date(y,m,d));closeBSheet(“calPickSheet”);render(true);}

function exportData(){const dataStr=JSON.stringify(D,null,2);const blob=new Blob([dataStr],{type:“application/json”});const url=URL.createObjectURL(blob);const a=document.createElement(“a”);a.href=url;a.download=“habits-backup-”+todayStr()+”.json”;a.click();URL.revokeObjectURL(url);}
function importData(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(e){try{const imported=JSON.parse(e.target.result);if(imported.habits&&imported.log){if(confirm(“Заменить все текущие данные?”)){D=imported;save();render();alert(“✅ Данные импортированы”);}}else alert(“❌ Неверный формат”);}catch(err){alert(“❌ Ошибка чтения”);}};reader.readAsText(file);}
function confirmReset(){if(confirm(“⚠️ Удалить ВСЕ привычки и записи?\nЭто действие нельзя отменить!”)){D={habits:[],log:{}};save();render();}}

function askNotifPermission(){
if(!(“Notification” in window)){alert(“Браузер не поддерживает уведомления”);return;}
if(Notification.permission===“granted”){alert(“✅ Уведомления уже включены”);return;}
if(Notification.permission===“denied”){alert(“❌ Уведомления заблокированы. Включи их в настройках Safari.”);return;}
Notification.requestPermission().then(p=>{if(p===“granted”)alert(“✅ Уведомления включены!”);render();});
}

function openBSheet(id){document.getElementById(id).classList.add(“on”);}
function closeBSheet(id,e){if(!e||e.target===document.getElementById(id))document.getElementById(id).classList.remove(“on”);}
function esc(s){return(s||””).replace(/&/g,”&”).replace(/</g,”<”).replace(/>/g,”>”);}

function render(resetScroll){
renderHeader();
const m=document.getElementById(“content”);
const savedScroll=m.scrollTop;
if(tab===“today”)m.innerHTML=renderToday();
else if(tab===“week”)m.innerHTML=renderWeek();
else if(tab===“stats”)m.innerHTML=renderStats();
else if(tab===“manage”)m.innerHTML=renderManage();
if(resetScroll)m.scrollTop=0;else m.scrollTop=savedScroll;
}

function checkReminders(){
if(!(“Notification” in window)||Notification.permission!==“granted”)return;
const now=new Date();
const hh=String(now.getHours()).padStart(2,“0”);
const mm=String(now.getMinutes()).padStart(2,“0”);
const currentTime=hh+”:”+mm;
const today=todayStr();
const lastNotifKey=“hab_notif_”+today;
let notifiedToday=[];
try{notifiedToday=JSON.parse(localStorage.getItem(lastNotifKey)||”[]”);}catch(e){}
D.habits.forEach(h=>{
if(h.remind===currentTime&&isActiveDay(h,today)&&!isChecked(h.id,today)&&!notifiedToday.includes(h.id)){
try{
new Notification(“⏰ “+h.name,{body:“Время выполнить привычку!”,tag:“habit-”+h.id});
notifiedToday.push(h.id);
localStorage.setItem(lastNotifKey,JSON.stringify(notifiedToday));
}catch(e){}
}
});
}

function init(){
try{
load();
applyTheme();
buildTGrid();
buildIconGrid();
buildColorGrid();
render();
}catch(e){
console.error(“Init error:”,e);
alert(“Ошибка загрузки: “+e.message);
}
}
if(document.readyState===“loading”){
document.addEventListener(“DOMContentLoaded”,init);
}else{
init();
}
window.addEventListener(“beforeunload”,save);
document.addEventListener(“visibilitychange”,function(){if(document.visibilityState===“hidden”)save();else checkReminders();});
setInterval(checkReminders,60000);
setTimeout(checkReminders,3000);
</script>
