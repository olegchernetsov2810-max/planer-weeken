<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Привычки"/>
<meta name="theme-color" content="#7c5cbf"/>
<title>Трекер привычек</title>

<style>
:root{
  --a:#7c5cbf;
  --a2:rgba(124,92,191,.12);

  --bg:#f2f2f7;
  --card:#ffffff;
  --text:#1c1c1e;
  --muted:#8e8e93;
  --border:#e5e5ea;
  --inp:#f2f2f7;

  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}

.dk{
  --bg:#000;
  --card:#1c1c1e;
  --text:#fff;
  --muted:#8e8e93;
  --border:#2c2c2e;
  --inp:#2c2c2e;
}

*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  position:relative;
}

input,textarea,select,button{
  font-family:inherit;
  font-size:16px;
}

button{
  cursor:pointer;
}

/* === APP === */
#app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* === TOP === */
#topbar{
  flex-shrink:0;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

#sb{
  height:var(--st);
}

.h1{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px 0;
}

.logo{
  flex:1;
  font-size:20px;
  font-weight:800;
  color:var(--a);
}

.ico{
  width:38px;
  height:38px;
  border:none;
  border-radius:12px;
  background:var(--inp);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.top-extra{
  padding:8px 16px 16px;
}

.hdr-stats{
  display:flex;
  gap:8px;
}

.hstat{
  flex:1;
  background:var(--a2);
  border-radius:12px;
  padding:8px;
  text-align:center;
}

.hstat-val{
  font-size:16px;
  font-weight:800;
  color:var(--a);
}

.hstat-lbl{
  margin-top:2px;
  font-size:10px;
  color:var(--muted);
}

.weekgraph{
  display:flex;
  gap:3px;
  align-items:flex-end;
  height:32px;
  margin-top:8px;
}

.wgcol{
  position:relative;
  flex:1;
  min-height:3px;
  border-radius:3px;
  background:var(--a2);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.wgfill{
  width:100%;
  border-radius:3px;
  background:var(--a);
}

.wglbl{
  position:absolute;
  bottom:-14px;
  font-size:8px;
  color:var(--muted);
  font-weight:600;
}

/* === WEEK NAV === */
#wnav{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.warr,
.wnow{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:none;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.warr{
  background:var(--inp);
  border:1.5px solid var(--border);
  color:var(--text);
}

.wnow{
  background:var(--a);
  color:#fff;
}

.wlbl{
  flex:1;
  border:none;
  border-radius:12px;
  background:var(--inp);
  color:var(--text);
  text-align:center;
  padding:10px 8px;
  font-size:13px;
  font-weight:700;
}

/* === CONTENT === */
#content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px 0 calc(130px + var(--sb));
}

#content::-webkit-scrollbar{
  display:none;
}

/* === TABS === */
#tabs{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:var(--sb);
}

.tb{
  flex:1;
  border:none;
  background:transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:8px 0;
}

.tbi{
  font-size:22px;
}

.tbl{
  font-size:10px;
  font-weight:500;
  color:var(--muted);
}

.tb.on .tbl{
  color:var(--a);
}

/* === FAB === */
#fab{
  position:fixed;
  right:16px;
  bottom:calc(72px + var(--sb));
  z-index:99;

  width:56px;
  height:56px;
  border:none;
  border-radius:50%;
  background:var(--a);
  color:#fff;
  font-size:30px;
  box-shadow:0 6px 18px rgba(0,0,0,.22);

  display:flex;
  align-items:center;
  justify-content:center;
}

/* === CARD === */
.card{
  margin:0 16px 12px;
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}

.ch{
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.ct{
  font-size:15px;
  font-weight:700;
}

.cb{
  font-size:12px;
  color:var(--muted);
}

/* === HABITS === */
.hab-row{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
}

.hab-row:last-child{
  border-bottom:none;
}

.hab-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.hab-icon{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.hab-info{
  flex:1;
  min-width:0;
}

.hab-name{
  font-size:15px;
  font-weight:700;
}

.hab-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:3px;
}

.hab-streak{
  font-size:12px;
  font-weight:700;
  color:#ff9500;
}

.hab-pct{
  font-size:12px;
  color:var(--muted);
}

.week-days{
  display:flex;
  gap:4px;
}

.day-check{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.day-lbl{
  font-size:9px;
  font-weight:700;
  color:var(--muted);
}

.day-btn{
  width:100%;
  max-width:36px;
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid var(--border);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
}

.day-btn.done{
  border-color:var(--a);
  background:var(--a);
  color:#fff;
}

.day-btn.today{
  border-color:var(--a);
  color:var(--a);
}

.day-btn.future{
  opacity:.3;
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.empty-i{
  font-size:44px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div id="app">
  <div id="topbar">
    <div id="sb"></div>

    <div class="h1">
      <div class="logo">✨ Привычки</div>
      <button class="ico">🎨</button>
    </div>

    <div class="top-extra">
      <div class="hdr-stats">
        <div class="hstat"><div class="hstat-val">0%</div><div class="hstat-lbl">Сегодня</div></div>
        <div class="hstat"><div class="hstat-val">0%</div><div class="hstat-lbl">Неделя</div></div>
        <div class="hstat"><div class="hstat-val">🔥0</div><div class="hstat-lbl">Серия</div></div>
        <div class="hstat"><div class="hstat-val">⭐</div><div class="hstat-lbl">Фокус</div></div>
      </div>

      <div class="weekgraph">
        <div class="wgcol"><div class="wgfill" style="height:20%"></div><div class="wglbl">П</div></div>
        <div class="wgcol"><div class="wgfill" style="height:50%"></div><div class="wglbl">В</div></div>
        <div class="wgcol"><div class="wgfill" style="height:80%"></div><div class="wglbl">С</div></div>
        <div class="wgcol"><div class="wgfill" style="height:40%"></div><div class="wglbl">Ч</div></div>
        <div class="wgcol"><div class="wgfill" style="height:60%"></div><div class="wglbl">П</div></div>
        <div class="wgcol"><div class="wgfill" style="height:30%"></div><div class="wglbl">С</div></div>
        <div class="wgcol"><div class="wgfill" style="height:70%"></div><div class="wglbl">В</div></div>
      </div>
    </div>
  </div>

  <div id="wnav">
    <button class="warr">‹</button>
    <button class="wlbl">08 июл – 14 июл · Эта неделя</button>
    <button class="wnow">📅</button>
    <button class="warr">›</button>
  </div>

  <div id="content">
    <div class="card">
      <div class="ch">
        <span class="ct">Сегодня</span>
        <span class="cb">0/0 · 0%</span>
      </div>

      <div class="empty">
        <div class="empty-i">✨</div>
        Нажмите + чтобы добавить первую привычку
      </div>
    </div>
  </div>

  <button id="fab">+</button>

  <div id="tabs">
    <button class="tb on"><span class="tbi">📋</span><span class="tbl">Сегодня</span></button>
    <button class="tb"><span class="tbi">📅</span><span class="tbl">Неделя</span></button>
    <button class="tb"><span class="tbi">📊</span><span class="tbl">Статистика</span></button>
    <button class="tb"><span class="tbi">⚙️</span><span class="tbl">Привычки</span></button>
  </div>
</div>
</body>
</html>
