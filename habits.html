<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="theme-color" content="#e8efe9">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23a3c9a8'/%3E%3Cpath d='M55 90l25 25 50-50' stroke='white' stroke-width='12' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogItCi0YDQtdC60LXRgCDQv9GA0LjQstGL0YfQtdC6IiwKICAic2hvcnRfbmFtZSI6ICLQotGA0LXQutC10YAiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgIm9yaWVudGF0aW9uIjogInBvcnRyYWl0IiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjZmZmZmZmIiwKICAidGhlbWVfY29sb3IiOiAiI2EzYzlhOCIKfQ==">
<title>Трекер привычек</title>
<style>
  html {
    color-scheme: light;
  }
  [data-theme="dark"] { color-scheme: dark; }
  :root {
    --bg: #eef2ee;
    --bg-grad: linear-gradient(180deg, #e8efe9 0%, #f1f4ef 100%);
    --surface: #ffffff;
    --surface-2: #f7faf7;
    --modal-bg: #f4f7f3;
    --text: #1a1a1a;
    --text-muted: #8a8a8a;
    --border: #dde2dd;
    --border-strong: #b8c2b8;
    --check-border: #9aa89a;
    --accent: #a3c9a8;
    --accent-soft: #c8dfca;
    --accent-bg: #e2eee3;
    --accent-deep: #6b9c73;
    --row-alt: #f3f6f3;
    --shadow: 0 2px 8px rgba(60,80,60,0.06), 0 1px 2px rgba(60,80,60,0.04);
    --shadow-modal: 0 -8px 32px rgba(0,0,0,0.12);
  }
  [data-theme="dark"] {
    --bg: #0d0d0d;
    --bg-grad: linear-gradient(180deg, #0d0d0d 0%, #131513 100%);
    --surface: #181a18;
    --surface-2: #1f221f;
    --modal-bg: #1c1f1c;
    --text: #f0f0f0;
    --text-muted: #888;
    --border: #2a2d2a;
    --border-strong: #404540;
    --check-border: #555a55;
    --accent: #7fae87;
    --accent-soft: #4a6e50;
    --accent-bg: #1f2a21;
    --accent-deep: #a3c9a8;
    --row-alt: #141614;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-modal: 0 -8px 32px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea {
    font-family: inherit;
    color: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"] {
    -webkit-text-fill-color: var(--text);
    opacity: 1;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background: var(--bg-grad);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 12px 14px 80px;
  }
  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
    padding: 4px 2px;
  }
  .month-nav {
    display: flex; align-items: center; gap: 10px;
  }
  .month-title {
    font-size: 22px; font-weight: 600; letter-spacing: -0.3px;
    font-family: 'Georgia', serif;
    font-style: italic;
  }
  .icon-btn {
    background: none; border: none;
    color: var(--text-muted);
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    border-radius: 8px;
    font-size: 18px;
  }
  .icon-btn:active { background: var(--accent-bg); }
  .header-actions { display: flex; gap: 4px; }

/* Toggle */
.view-toggle {
display: flex;
background: var(–surface);
border-radius: 10px;
padding: 3px;
margin-bottom: 14px;
border: 1px solid var(–border);
box-shadow: var(–shadow);
}
.view-toggle button {
flex: 1;
background: transparent;
border: none;
padding: 9px;
font-size: 13px;
color: #8a8a8a;
border-radius: 7px;
font-weight: 500;
transition: all 0.2s;
cursor: pointer;
}
.view-toggle button.active {
background: #e2eee3;
color: #6b9c73;
font-weight: 600;
}
[data-theme=“dark”] .view-toggle button { color: #888; }
[data-theme=“dark”] .view-toggle button.active { background: #1f2a21; color: #a3c9a8; }

/* Progress summary */
.summary {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 12px 14px;
margin-bottom: 14px;
display: flex; align-items: center; gap: 12px;
box-shadow: var(–shadow);
}
.summary-text { flex: 1; }
.summary-label {
font-size: 11px; color: var(–text-muted);
text-transform: uppercase; letter-spacing: 0.5px;
margin-bottom: 2px;
}
.summary-value {
font-size: 14px; font-weight: 500;
}
.summary-percent {
font-size: 22px; font-weight: 600;
color: var(–accent-deep);
font-variant-numeric: tabular-nums;
}
.summary-bar {
flex: 2;
height: 8px;
background: var(–border);
border-radius: 4px;
overflow: hidden;
position: relative;
}
.summary-bar-fill {
height: 100%;
background: var(–accent);
border-radius: 4px;
transition: width 0.4s ease;
}

/* Tracker grid */
.tracker {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
overflow: hidden;
margin-bottom: 14px;
box-shadow: var(–shadow);
}
.tracker-scroll {
overflow-x: auto;
-webkit-overflow-scrolling: touch;
}
.tracker-table {
border-collapse: collapse;
width: 100%;
font-size: 11px;
}
.tracker-table th, .tracker-table td {
padding: 0;
text-align: center;
vertical-align: middle;
border-right: 1px solid var(–border);
border-bottom: 1px solid var(–border);
}
.tracker-table tr:last-child td { border-bottom: none; }
.tracker-table th:last-child, .tracker-table td:last-child { border-right: none; }
.tracker-table thead th {
background: var(–row-alt);
color: var(–text-muted);
font-weight: 500;
font-size: 10px;
padding: 6px 0;
position: sticky; top: 0;
z-index: 2;
}
.tracker-table thead th .dow {
font-size: 9px; opacity: 0.7;
display: block;
}
.tracker-table thead th .dnum {
font-size: 11px;
display: block;
}
.habit-name {
text-align: left !important;
padding: 0 8px !important;
font-size: 12px;
min-width: 110px; max-width: 110px;
width: 110px;
position: sticky; left: 0;
background: var(–surface);
z-index: 1;
border-right: 1px solid var(–border-strong) !important;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
tr:nth-child(even) .habit-name { background: var(–row-alt); }
.habit-row td.day-cell {
width: 30px; height: 34px;
cursor: pointer;
user-select: none;
}
.habit-row:nth-child(even) td { background: var(–row-alt); }
.habit-row:nth-child(even) .habit-name { background: var(–row-alt); }

.check {
display: inline-block;
width: 20px; height: 20px;
border: 1.5px solid #9aa89a;
border-radius: 4px;
background: #ffffff;
position: relative;
transition: all 0.15s;
box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
}
[data-theme=“dark”] .check {
background: #0f110f;
border-color: #555a55;
box-shadow: inset 0 1px 0 rgba(0,0,0,0.3);
}
.day-cell.today .check {
border-color: #6b9c73;
border-width: 2px;
box-shadow: 0 0 0 2px #e2eee3;
}
[data-theme=“dark”] .day-cell.today .check {
border-color: #a3c9a8;
box-shadow: 0 0 0 2px #1f2a21;
}
.day-cell.checked .check {
background: #6b9c73;
border-color: #6b9c73;
box-shadow: 0 1px 3px rgba(107,156,115,0.3);
}
[data-theme=“dark”] .day-cell.checked .check {
background: #7fae87;
border-color: #7fae87;
}
.day-cell.checked .check::after {
content: ‘’;
position: absolute;
left: 6px; top: 2px;
width: 5px; height: 10px;
border: solid #ffffff;
border-width: 0 2px 2px 0;
transform: rotate(45deg);
}
[data-theme=“dark”] .day-cell.checked .check::after {
border-color: #0d0d0d;
}
.day-cell.future .check {
opacity: 0.35;
pointer-events: none;
background: #f3f6f3;
}
[data-theme=“dark”] .day-cell.future .check {
background: #141614;
}
.day-cell:active .check {
transform: scale(0.85);
}

.progress-cell {
min-width: 80px; max-width: 80px;
width: 80px;
padding: 4px 6px !important;
text-align: left !important;
border-left: 1px solid var(–border-strong) !important;
}
.progress-row-bar {
height: 6px;
background: var(–border);
border-radius: 3px;
overflow: hidden;
margin-bottom: 2px;
}
.progress-row-fill {
height: 100%;
background: var(–accent);
border-radius: 3px;
transition: width 0.3s;
}
.progress-row-text {
font-size: 9px;
color: var(–text-muted);
font-variant-numeric: tabular-nums;
}

/* Footer rows of table (totals) */
.totals-row td {
background: var(–row-alt) !important;
font-size: 9px;
color: var(–text-muted);
padding: 4px 0 !important;
height: auto;
}
.totals-row .habit-name {
font-size: 10px;
padding: 4px 8px !important;
color: var(–text-muted);
}

/* Empty state */
.empty {
padding: 40px 20px;
text-align: center;
color: var(–text-muted);
}
.empty-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.5; }
.empty-text { font-size: 13px; line-height: 1.5; }

/* Add button */
.add-habit-btn {
width: 100%;
background: var(–surface);
border: 1.5px dashed var(–border-strong);
color: var(–text-muted);
padding: 12px;
border-radius: 12px;
font-size: 13px;
cursor: pointer;
margin-bottom: 14px;
font-weight: 500;
}
.add-habit-btn:active { background: var(–accent-bg); border-color: var(–accent); color: var(–text); }

/* Chart */
.chart-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 14px;
margin-bottom: 14px;
box-shadow: var(–shadow);
}
.chart-title {
font-size: 12px;
color: var(–text-muted);
text-transform: uppercase;
letter-spacing: 0.5px;
margin-bottom: 10px;
}
.chart-svg { width: 100%; height: 110px; display: block; }

/* Year stats */
.year-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 14px;
margin-bottom: 14px;
box-shadow: var(–shadow);
}
.year-title {
text-align: center;
font-family: Georgia, serif;
font-style: italic;
font-size: 16px;
margin-bottom: 12px;
}
.year-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 6px;
}
.year-month {
border: 1px solid var(–border);
border-radius: 8px;
padding: 6px 4px;
text-align: center;
font-size: 10px;
}
.year-month.current { border-color: var(–accent); background: var(–accent-bg); }
.year-month-name {
font-weight: 600;
margin-bottom: 4px;
font-size: 11px;
}
.year-month-stat {
color: var(–text-muted);
font-size: 9px;
line-height: 1.3;
}
.year-month-pct {
color: var(–accent-deep);
font-weight: 600;
font-size: 12px;
margin-top: 2px;
font-variant-numeric: tabular-nums;
}

/* Modal */
.modal-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,0.4);
display: none;
align-items: flex-end;
justify-content: center;
z-index: 100;
backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
.modal {
background: #f4f7f3;
width: 100%;
max-width: 520px;
border-radius: 20px 20px 0 0;
padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
border-top: 1px solid #dde2dd;
color: #1a1a1a;
}
[data-theme=“dark”] .modal {
background: #1c1f1c;
border-top-color: #2a2d2a;
color: #f0f0f0;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
width: 36px; height: 4px;
background: var(–border-strong);
border-radius: 2px;
margin: 0 auto 14px;
}
.modal h3 {
margin: 0 0 14px;
font-size: 16px;
font-weight: 600;
}
.modal input, .modal select {
width: 100%;
padding: 13px 14px;
border: 1.5px solid var(–border-strong);
border-radius: 10px;
font-size: 15px;
background: var(–surface);
color: var(–text);
margin-bottom: 12px;
font-family: inherit;
box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
}
.modal input:focus { outline: none; border-color: var(–accent-deep); box-shadow: 0 0 0 3px var(–accent-bg); }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.btn {
flex: 1;
padding: 13px;
border-radius: 10px;
border: none;
font-size: 14px;
font-weight: 600;
cursor: pointer;
font-family: inherit;
}
.btn-primary {
background: #a3c9a8;
color: #ffffff !important;
-webkit-text-fill-color: #ffffff;
box-shadow: 0 2px 6px rgba(107,156,115,0.25);
}
[data-theme=“dark”] .btn-primary {
color: #0d0d0d !important;
-webkit-text-fill-color: #0d0d0d;
}
.btn-secondary {
background: #ffffff;
color: #1a1a1a !important;
-webkit-text-fill-color: #1a1a1a;
border: 1px solid #dde2dd;
}
[data-theme=“dark”] .btn-secondary {
background: #1f221f;
color: #f0f0f0 !important;
-webkit-text-fill-color: #f0f0f0;
border-color: #2a2d2a;
}
.btn-danger { background: #fff0f0; color: #c44 !important; -webkit-text-fill-color: #c44; border: 1px solid #fcc; }
[data-theme=“dark”] .btn-danger { background: #2a1818; color: #f88 !important; -webkit-text-fill-color: #f88; border-color: #4a2828; }
.emoji-grid {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 4px;
margin-bottom: 12px;
max-height: 140px;
overflow-y: auto;
padding: 6px;
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
}
.emoji-btn {
background: none; border: none;
aspect-ratio: 1;
font-size: 20px;
border-radius: 7px;
cursor: pointer;
transition: all 0.15s;
}
.emoji-btn:active { transform: scale(0.9); }
.emoji-btn.selected {
background: var(–accent);
box-shadow: 0 1px 3px rgba(107,156,115,0.3);
}

/* Habit list in modal */
.habit-edit-list { max-height: 50vh; overflow-y: auto; }
.habit-edit-row {
display: flex; align-items: center; gap: 8px;
padding: 10px 0;
border-bottom: 1px solid var(–border);
}
.habit-edit-row:last-child { border-bottom: none; }
.habit-edit-emoji { font-size: 18px; width: 28px; text-align: center; }
.habit-edit-name { flex: 1; font-size: 14px; }
.habit-edit-del {
background: none; border: none;
color: #c44; font-size: 18px;
width: 32px; height: 32px;
border-radius: 8px;
cursor: pointer;
}

/* Toast */
.toast {
position: fixed;
bottom: calc(20px + env(safe-area-inset-bottom));
left: 50%; transform: translateX(-50%);
background: var(–text);
color: var(–bg);
padding: 10px 18px;
border-radius: 20px;
font-size: 13px;
z-index: 200;
opacity: 0;
transition: opacity 0.3s;
pointer-events: none;
}
.toast.show { opacity: 1; }

/* Install hint */
.install-hint {
background: var(–accent-bg);
border: 1px solid var(–accent-soft);
border-radius: 12px;
padding: 12px 14px;
font-size: 12px;
margin-bottom: 14px;
line-height: 1.5;
position: relative;
}
.install-hint b { color: var(–accent-deep); }
.install-hint .close-hint {
position: absolute;
top: 6px; right: 6px;
background: none; border: none;
font-size: 18px;
color: var(–text-muted);
width: 24px; height: 24px;
border-radius: 6px;
cursor: pointer;
}
</style>

</head>
<body>
<div class="app">
  <div class="header">
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">‹</button>
      <div class="month-title" id="monthTitle">Январь</div>
      <button class="icon-btn" id="nextMonth">›</button>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="editBtn" title="Привычки">✎</button>
      <button class="icon-btn" id="themeBtn" title="Тема">◐</button>
    </div>
  </div>

  <div class="view-toggle">
    <button id="viewWeek">Неделя</button>
    <button id="viewMonth" class="active">Месяц</button>
    <button id="viewYear">Год</button>
  </div>

  <div id="installHint" class="install-hint" style="display:none">
    <button class="close-hint" id="closeHint">×</button>
    <b>Добавь на главный экран</b><br>
    Нажми <b>Поделиться</b> → <b>На экран «Домой»</b> — будет работать как приложение.
  </div>

  <div id="mainView"></div>
</div>

<!-- Add habit modal -->

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Новая привычка</h3>
    <input type="text" id="habitInput" placeholder="Название привычки" maxlength="40">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Эмодзи:</div>
    <div class="emoji-grid" id="emojiGrid"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelAdd">Отмена</button>
      <button class="btn btn-primary" id="confirmAdd">Добавить</button>
    </div>
  </div>
</div>

<!-- Edit habits modal -->

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Мои привычки</h3>
    <div class="habit-edit-list" id="habitEditList"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="closeEdit">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ---------- State & Storage ----------
const STORAGE_KEY = 'habitTrackerData_v1';
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_RU_SHORT = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const DOW_RU = ['вс','пн','вт','ср','чт','пт','сб'];
const EMOJIS = ['⏰','💪','📖','📅','💰','🎯','🚱','🌿','📔','🚿','🧘','🏃','🚴','🎨','✍️','💻','🌅','💧','🍎','🥗','💤','🧠','📚','🎵','🌱','☀️','🔥','⚡','🏆','🎪','🌊','🍃'];

let state = {
  habits: [],   // {id, name, emoji}
  log: {},      // { 'YYYY-MM-DD': { habitId: true } }
  theme: 'light',
  view: 'month' // 'week' | 'month' | 'year'
};

let viewDate = new Date();
viewDate.setDate(1);

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch(e) { console.warn('Load failed', e); }
  document.documentElement.setAttribute('data-theme', state.theme);
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { toast('Не удалось сохранить'); }
}

// ---------- Date helpers ----------
function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function daysInMonth(year, month) {
  return new Date(year, month+1, 0).getDate();
}
function isToday(d) {
  const t = new Date();
  return d.getDate() === t.getDate() && d.getMonth() === t.getMonth() && d.getFullYear() === t.getFullYear();
}
function isFuture(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  return d > t;
}
function getWeekDates(today) {
  // Monday start week
  const d = new Date(today);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  const week = [];
  for (let i = 0; i < 7; i++) {
    const x = new Date(d);
    x.setDate(d.getDate()+i);
    week.push(x);
  }
  return week;
}

// ---------- Computations ----------
function isChecked(habitId, dateStr) {
  return !!(state.log[dateStr] && state.log[dateStr][habitId]);
}
function toggleCheck(habitId, dateStr) {
  if (!state.log[dateStr]) state.log[dateStr] = {};
  if (state.log[dateStr][habitId]) {
    delete state.log[dateStr][habitId];
    if (Object.keys(state.log[dateStr]).length === 0) delete state.log[dateStr];
  } else {
    state.log[dateStr][habitId] = true;
  }
  save();
}
function habitMonthStats(habitId, year, month) {
  const days = daysInMonth(year, month);
  let done = 0, possible = 0;
  const today = new Date(); today.setHours(23,59,59,999);
  for (let d = 1; d <= days; d++) {
    const date = new Date(year, month, d);
    if (date > today) continue;
    possible++;
    if (isChecked(habitId, ymd(date))) done++;
  }
  return { done, total: days, possible };
}
function dayCompletion(year, month, day) {
  if (!state.habits.length) return { pct: 0, done: 0, total: 0 };
  const date = new Date(year, month, day);
  if (isFuture(date)) return { pct: null, done: 0, total: state.habits.length };
  const dateStr = ymd(date);
  let done = 0;
  state.habits.forEach(h => { if (isChecked(h.id, dateStr)) done++; });
  return { pct: Math.round(done / state.habits.length * 100), done, total: state.habits.length };
}
function monthSummary(year, month) {
  const days = daysInMonth(year, month);
  const today = new Date();
  let done = 0, possible = 0;
  for (let d = 1; d <= days; d++) {
    const date = new Date(year, month, d);
    if (date > today) continue;
    state.habits.forEach(h => {
      possible++;
      if (isChecked(h.id, ymd(date))) done++;
    });
  }
  return { done, possible, pct: possible ? Math.round(done / possible * 1000)/10 : 0 };
}

// ---------- Render ----------
function setMonthTitle() {
  const m = viewDate.getMonth();
  const y = viewDate.getFullYear();
  const now = new Date();
  const yearSuffix = (y === now.getFullYear()) ? '' : ` ${y}`;
  document.getElementById('monthTitle').textContent = MONTHS_RU[m] + yearSuffix;
}

function render() {
  setMonthTitle();
  const view = document.getElementById('mainView');

  if (state.view === 'year') {
    view.innerHTML = renderYearView();
    return;
  }

  // Summary
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const sum = monthSummary(y, m);
  const totalPossible = state.habits.length * daysInMonth(y, m);

  let html = '';
  html += `<div class="summary">
    <div class="summary-text">
      <div class="summary-label">Выполнено</div>
      <div class="summary-value">${sum.done} / ${totalPossible}</div>
    </div>
    <div class="summary-bar"><div class="summary-bar-fill" style="width:${sum.pct}%"></div></div>
    <div class="summary-percent">${sum.pct}%</div>
  </div>`;

  if (state.habits.length === 0) {
    html += `<div class="tracker"><div class="empty">
      <div class="empty-icon">📝</div>
      <div class="empty-text">Запиши привычки,<br>которые хочешь внедрить в свою жизнь</div>
    </div></div>`;
    html += `<button class="add-habit-btn" onclick="openAddModal()">＋ Добавить первую привычку</button>`;
  } else {
    html += renderTracker();
    html += `<button class="add-habit-btn" onclick="openAddModal()">＋ Добавить привычку</button>`;
    if (state.view === 'month') html += renderChart();
  }

  view.innerHTML = html;
  attachCellHandlers();
}

function renderTracker() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  let dates;
  if (state.view === 'week') {
    dates = getWeekDates(new Date());
  } else {
    const days = daysInMonth(y, m);
    dates = [];
    for (let d = 1; d <= days; d++) dates.push(new Date(y, m, d));
  }

  let html = '<div class="tracker"><div class="tracker-scroll"><table class="tracker-table">';

  // Header
  html += '<thead><tr><th class="habit-name">Мои привычки</th>';
  dates.forEach(d => {
    html += `<th><span class="dow">${DOW_RU[d.getDay()]}</span><span class="dnum">${d.getDate()}</span></th>`;
  });
  html += '<th class="progress-cell">Прогресс</th></tr></thead>';

  // Body
  html += '<tbody>';
  state.habits.forEach(h => {
    html += `<tr class="habit-row"><td class="habit-name">${h.emoji} ${escapeHtml(h.name)}</td>`;
    let done = 0, possible = 0;
    const today = new Date(); today.setHours(23,59,59,999);
    dates.forEach(d => {
      const dStr = ymd(d);
      const checked = isChecked(h.id, dStr);
      const future = isFuture(d);
      const todayCls = isToday(d) ? ' today' : '';
      const futCls = future ? ' future' : '';
      const checkCls = checked ? ' checked' : '';
      if (!future) { possible++; if (checked) done++; }
      html += `<td class="day-cell${checkCls}${todayCls}${futCls}" data-habit="${h.id}" data-date="${dStr}"><span class="check"></span></td>`;
    });
    const total = dates.length;
    const pct = total ? Math.round(done/total*100) : 0;
    html += `<td class="progress-cell">
      <div class="progress-row-bar"><div class="progress-row-fill" style="width:${pct}%"></div></div>
      <div class="progress-row-text">${done} / ${total}</div>
    </td>`;
    html += '</tr>';
  });

  // Totals row (per-day completion %)
  if (state.view === 'month') {
    html += '<tr class="totals-row"><td class="habit-name">Прогресс</td>';
    dates.forEach(d => {
      const c = dayCompletion(d.getFullYear(), d.getMonth(), d.getDate());
      const txt = c.pct === null ? '–' : c.pct + '%';
      html += `<td>${txt}</td>`;
    });
    html += '<td class="progress-cell"></td></tr>';
  }

  html += '</tbody></table></div></div>';
  return html;
}

function renderChart() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const days = daysInMonth(y, m);
  const points = [];
  for (let d = 1; d <= days; d++) {
    const c = dayCompletion(y, m, d);
    points.push(c.pct === null ? null : c.pct);
  }
  const W = 320, H = 90, padX = 8, padY = 6;
  const innerW = W - padX*2, innerH = H - padY*2;
  const stepX = innerW / (days - 1 || 1);

  // Build path (ignore nulls by closing)
  let pathD = '';
  let started = false;
  let lastX = padX, lastY = H - padY;
  points.forEach((p, i) => {
    if (p === null) return;
    const x = padX + i * stepX;
    const yy = padY + innerH - (p / 100) * innerH;
    if (!started) { pathD += `M ${x} ${H-padY} L ${x} ${yy}`; started = true; }
    else { pathD += ` L ${x} ${yy}`; }
    lastX = x; lastY = yy;
  });
  if (started) pathD += ` L ${lastX} ${H-padY} Z`;

  // Grid lines
  const gridLines = [0, 25, 50, 75, 100].map(v => {
    const yy = padY + innerH - (v / 100) * innerH;
    return `<line x1="${padX}" y1="${yy}" x2="${W-padX}" y2="${yy}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 2"/>`;
  }).join('');

  return `<div class="chart-card">
    <div class="chart-title">График выполнения</div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${gridLines}
      <path d="${pathD}" fill="var(--accent-soft)" opacity="0.6"/>
      <path d="${pathD.replace(/Z$/,'').replace(/^M [^L]+L/, 'M ')}" fill="none" stroke="var(--accent-deep)" stroke-width="1.2"/>
    </svg>
  </div>`;
}

function renderYearView() {
  const y = viewDate.getFullYear();
  const today = new Date();
  let html = `<div class="year-card">
    <div class="year-title">Статистика за ${y}</div>
    <div class="year-grid">`;
  for (let m = 0; m < 12; m++) {
    if (state.habits.length === 0) {
      html += `<div class="year-month">
        <div class="year-month-name">${MONTHS_RU_SHORT[m]}</div>
        <div class="year-month-stat">—</div>
        <div class="year-month-pct">0%</div>
      </div>`;
      continue;
    }
    const sum = monthSummary(y, m);
    const isCurrent = (y === today.getFullYear() && m === today.getMonth());
    const future = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
    html += `<div class="year-month${isCurrent ? ' current' : ''}" onclick="jumpTo(${y},${m})" style="cursor:pointer">
      <div class="year-month-name">${MONTHS_RU_SHORT[m]}</div>
      <div class="year-month-stat">Привычек: ${state.habits.length}</div>
      <div class="year-month-stat">${sum.done} / ${sum.possible || '—'}</div>
      <div class="year-month-pct">${future ? '—' : sum.pct.toFixed(1)+'%'}</div>
    </div>`;
  }
  html += `</div></div>`;

  // Year chart
  const monthData = [];
  for (let m = 0; m < 12; m++) {
    const today = new Date();
    const future = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
    monthData.push(future ? null : monthSummary(y, m).pct);
  }
  const W = 320, H = 100, padX = 8, padY = 6;
  const innerW = W - padX*2, innerH = H - padY*2;
  const stepX = innerW / 11;
  let pathD = '';
  let started = false, lastX = padX;
  monthData.forEach((p, i) => {
    if (p === null) return;
    const x = padX + i * stepX;
    const yy = padY + innerH - (p / 100) * innerH;
    if (!started) { pathD += `M ${x} ${H-padY} L ${x} ${yy}`; started = true; }
    else { pathD += ` L ${x} ${yy}`; }
    lastX = x;
  });
  if (started) pathD += ` L ${lastX} ${H-padY} Z`;

  html += `<div class="chart-card">
    <div class="chart-title">Прогресс по месяцам</div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${[0,25,50,75,100].map(v=>{const yy=padY+innerH-(v/100)*innerH;return `<line x1="${padX}" y1="${yy}" x2="${W-padX}" y2="${yy}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 2"/>`;}).join('')}
      <path d="${pathD}" fill="var(--accent-soft)" opacity="0.6"/>
    </svg>
  </div>`;

  return html;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Interactions ----------
function attachCellHandlers() {
  document.querySelectorAll('.day-cell').forEach(cell => {
    if (cell.classList.contains('future')) return;
    cell.addEventListener('click', () => {
      const habitId = cell.dataset.habit;
      const date = cell.dataset.date;
      toggleCheck(habitId, date);
      cell.classList.toggle('checked');
      // Re-render to update stats (debounced quickly)
      clearTimeout(window._renderTimer);
      window._renderTimer = setTimeout(render, 100);
    });
  });
}

let pendingEmoji = '⭐';
function openAddModal() {
  document.getElementById('habitInput').value = '';
  pendingEmoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map(e =>
    `<button class="emoji-btn${e===pendingEmoji?' selected':''}" data-emoji="${e}">${e}</button>`
  ).join('');
  grid.querySelectorAll('.emoji-btn').forEach(b => {
    b.addEventListener('click', () => {
      pendingEmoji = b.dataset.emoji;
      grid.querySelectorAll('.emoji-btn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('habitInput').focus(), 200);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
}
function confirmAdd() {
  const name = document.getElementById('habitInput').value.trim();
  if (!name) { toast('Введи название'); return; }
  state.habits.push({
    id: 'h_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name, emoji: pendingEmoji
  });
  save();
  closeAddModal();
  render();
  toast('Привычка добавлена');
}

function openEditModal() {
  const list = document.getElementById('habitEditList');
  if (state.habits.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-text">Пока нет привычек</div></div>';
  } else {
    list.innerHTML = state.habits.map(h =>
      `<div class="habit-edit-row">
        <div class="habit-edit-emoji">${h.emoji}</div>
        <div class="habit-edit-name">${escapeHtml(h.name)}</div>
        <button class="habit-edit-del" data-id="${h.id}">🗑</button>
      </div>`
    ).join('');
    list.querySelectorAll('.habit-edit-del').forEach(b => {
      b.addEventListener('click', () => {
        if (confirm('Удалить привычку? История останется в данных.')) {
          state.habits = state.habits.filter(h => h.id !== b.dataset.id);
          save();
          openEditModal();
          render();
        }
      });
    });
  }
  document.getElementById('editModal').classList.add('show');
}
function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
}

function jumpTo(year, month) {
  viewDate = new Date(year, month, 1);
  state.view = 'month';
  document.getElementById('viewMonth').classList.add('active');
  document.getElementById('viewWeek').classList.remove('active');
  document.getElementById('viewYear').classList.remove('active');
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Wire up ----------
document.getElementById('prevMonth').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() - 1);
  render();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() + 1);
  render();
});
document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', state.theme === 'dark' ? '#0d0d0d' : '#e8efe9');
  save();
});
document.getElementById('editBtn').addEventListener('click', openEditModal);
document.getElementById('viewWeek').addEventListener('click', e => { state.view='week'; document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); render(); });
document.getElementById('viewMonth').addEventListener('click', e => { state.view='month'; document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); render(); });
document.getElementById('viewYear').addEventListener('click', e => { state.view='year'; document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); render(); });
document.getElementById('cancelAdd').addEventListener('click', closeAddModal);
document.getElementById('confirmAdd').addEventListener('click', confirmAdd);
document.getElementById('closeEdit').addEventListener('click', closeEditModal);
document.getElementById('addModal').addEventListener('click', e => { if (e.target.id === 'addModal') closeAddModal(); });
document.getElementById('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeEditModal(); });

// Show install hint on iOS Safari first time
function checkInstallHint() {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.navigator.standalone;
  const dismissed = localStorage.getItem('hintDismissed');
  if (isIOS && !standalone && !dismissed) {
    document.getElementById('installHint').style.display = 'block';
  }
}
document.getElementById('closeHint').addEventListener('click', () => {
  document.getElementById('installHint').style.display = 'none';
  localStorage.setItem('hintDismissed', '1');
});

// Init
load();
checkInstallHint();
render();

// Expose for inline handlers
window.openAddModal = openAddModal;
window.jumpTo = jumpTo;
</script>
