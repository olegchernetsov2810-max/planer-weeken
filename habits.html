<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Привычки"/>
<meta name="theme-color" content="#7c5cbf"/>
<title>Трекер привычек</title>
<style>
:root {
  --a: #7c5cbf;
  --a2: rgba(124,92,191,.12);
  --bg: #f2f2f7;
  --card: #fff;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --border: #e5e5ea;
  --inp: #f2f2f7;
  --st: env(safe-area-inset-top, 44px);
  --sb: env(safe-area-inset-bottom, 20px);
}
.dk {
  --bg: #000;
  --card: #1c1c1e;
  --text: #fff;
  --muted: #636366;
  --border: #2c2c2e;
  --inp: #2c2c2e;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  -webkit-font-smoothing: antialiased;
  position: fixed;
  width: 100%;
}
input, textarea, select, button {
  font-family: inherit;
  font-size: 16px;
}
button {
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

#app {
display: flex;
flex-direction: column;
height: 100vh;
width: 100%;
}
#topbar {
flex-shrink: 0;
background: var(–card);
border-bottom: 1px solid var(–border);
}
#sb {
height: var(–st);
}
.h1 {
display: flex;
align-items: center;
gap: 8px;
padding: 10px 16px 0;
}
.logo {
font-size: 20px;
font-weight: 800;
color: var(–a);
flex: 1;
}
.ico {
width: 38px;
height: 38px;
border-radius: 12px;
background: var(–inp);
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
}

.top-extra {
padding: 8px 16px 12px;
}
.hdr-stats {
display: flex;
gap: 8px;
}
.hstat {
flex: 1;
background: var(–a2);
border-radius: 12px;
padding: 8px;
text-align: center;
color: var(–text);
}
.hstat-val {
font-size: 16px;
font-weight: 800;
color: var(–a);
}
.hstat-lbl {
font-size: 10px;
color: var(–muted);
margin-top: 1px;
}

.weekgraph {
display: flex;
gap: 3px;
align-items: flex-end;
height: 32px;
margin-top: 8px;
}
.wgcol {
flex: 1;
background: var(–a2);
border-radius: 3px;
min-height: 3px;
position: relative;
display: flex;
align-items: flex-end;
justify-content: center;
}
.wgfill {
width: 100%;
background: var(–a);
border-radius: 3px;
}
.wglbl {
position: absolute;
bottom: -14px;
font-size: 8px;
color: var(–muted);
font-weight: 600;
}

#wnav {
flex-shrink: 0;
background: var(–card);
border-bottom: 1px solid var(–border);
padding: 8px 16px;
display: flex;
align-items: center;
gap: 8px;
}
.warr {
width: 40px;
height: 40px;
border-radius: 12px;
border: 1.5px solid var(–border);
background: var(–inp);
color: var(–text);
font-size: 20px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.wlbl {
flex: 1;
text-align: center;
font-size: 13px;
font-weight: 700;
background: var(–inp);
border-radius: 12px;
padding: 10px 8px;
color: var(–text);
min-height: 40px;
}
.wlbl:active {
background: var(–border);
}
.wnow {
width: 40px;
height: 40px;
border-radius: 12px;
background: var(–a);
color: #fff;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}

#content {
flex: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
padding: 12px 0 calc(150px + var(–sb));
}
#content::-webkit-scrollbar {
display: none;
}

#tabs {
position: fixed;
bottom: 0;
left: 0;
right: 0;
z-index: 100;
background: var(–card);
border-top: 1px solid var(–border);
display: flex;
padding-bottom: var(–sb);
}
.tb {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 8px 0;
gap: 2px;
}
.tbi {
font-size: 22px;
}
.tbl {
font-size: 10px;
font-weight: 500;
color: var(–muted);
}
.tb.on .tbl {
color: var(–a);
}

.card {
background: var(–card);
border-radius: 16px;
margin: 0 16px 12px;
overflow: hidden;
box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.ch {
padding: 12px 16px;
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(–border);
}
.ct {
font-size: 15px;
font-weight: 700;
}
.cb {
font-size: 12px;
color: var(–muted);
}

.hab-row {
padding: 14px 16px;
border-bottom: 1px solid var(–border);
position: relative;
}
.hab-row:last-child {
border-bottom: none;
}
.hab-top {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 10px;
}
.hab-icon {
width: 40px;
height: 40px;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 22px;
flex-shrink: 0;
}
.hab-info {
flex: 1;
min-width: 0;
}
.hab-name {
font-size: 15px;
font-weight: 700;
}
.hab-meta {
display: flex;
gap: 8px;
align-items: center;
margin-top: 3px;
flex-wrap: wrap;
}
.hab-streak {
font-size: 12px;
font-weight: 700;
color: #ff9500;
}
.hab-pct {
font-size: 12px;
color: var(–muted);
}

.week-days {
display: flex;
gap: 4px;
}
.day-check {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.day-lbl {
font-size: 9px;
font-weight: 700;
color: var(–muted);
}
.day-btn {
width: 100%;
aspect-ratio: 1;
border-radius: 50%;
border: 2px solid var(–border);
background: transparent;
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
font-weight: 700;
color: var(–muted);
transition: .15s;
max-width: 36px;
}
.day-btn.done {
border-color: var(–a);
background: var(–a);
color: #fff;
}
.day-btn.today {
border-color: var(–a);
color: var(–a);
}
.day-btn.future {
opacity: .3;
}

.stats-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
padding: 0 16px 12px;
}
.sc {
background: var(–card);
border-radius: 14px;
padding: 14px;
box-shadow: 0 1px 4px rgba(0,0,0,.06);
text-align: left;
color: var(–text);
}
.sc:active {
transform: scale(.97);
}
.si {
font-size: 22px;
margin-bottom: 4px;
}
.sv {
font-size: 18px;
font-weight: 800;
color: var(–a);
}
.sl2 {
font-size: 11px;
color: var(–muted);
margin-top: 2px;
}
.sc-expand {
font-size: 10px;
color: var(–a);
margin-top: 4px;
}

.detail-box {
background: var(–inp);
border-radius: 12px;
padding: 12px;
margin-bottom: 10px;
}
.detail-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 0;
border-bottom: 1px solid var(–border);
}
.detail-row:last-child {
border-bottom: none;
}
.detail-lbl {
font-size: 13px;
color: var(–muted);
}
.detail-val {
font-size: 14px;
font-weight: 700;
}

.hab-progress-row {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid var(–border);
}
.hab-progress-row:last-child {
border-bottom: none;
}
.hp-icon {
font-size: 20px;
}
.hp-info {
flex: 1;
min-width: 0;
}
.hp-name {
font-size: 13px;
font-weight: 600;
}
.hp-bar {
height: 4px;
background: var(–border);
border-radius: 2px;
margin-top: 4px;
overflow: hidden;
}
.hp-fill {
height: 100%;
border-radius: 2px;
background: var(–a);
transition: width .4s;
}
.hp-pct {
font-size: 13px;
font-weight: 700;
color: var(–a);
}

.cal-container {
padding: 10px 14px 14px;
}
.cal-head {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 3px;
margin-bottom: 6px;
}
.cal-day-header {
text-align: center;
font-size: 10px;
font-weight: 700;
color: var(–muted);
padding: 2px 0;
}
.cal-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 3px;
}
.cal-cell {
aspect-ratio: 1;
border-radius: 7px;
border: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
font-weight: 600;
color: var(–muted);
background: transparent;
}
.cal-cell.done {
background: var(–a);
color: #fff;
border-color: var(–a);
}
.cal-cell.today {
border: 2px solid var(–a);
background: rgba(124,92,191,.1);
}
.cal-cell.empty {
background: transparent;
border: none;
}

.bsheet {
position: fixed;
inset: 0;
background: rgba(0,0,0,.5);
z-index: 500;
display: none;
align-items: flex-end;
}
.bsheet.on {
display: flex;
}
.bsbox {
width: 100%;
background: var(–card);
border-radius: 20px 20px 0 0;
padding: 0 16px calc(var(–sb) + 12px);
max-height: 88vh;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.bsbox::-webkit-scrollbar {
display: none;
}
.bsh {
width: 36px;
height: 4px;
background: var(–border);
border-radius: 2px;
margin: 8px auto 12px;
}
.bst {
font-size: 16px;
font-weight: 700;
margin-bottom: 12px;
}
.bsbtn {
width: 100%;
padding: 12px;
border-radius: 11px;
font-size: 14px;
font-weight: 700;
margin-bottom: 7px;
}
.bsbtn.ok {
background: var(–a);
color: #fff;
}
.bsbtn.cl {
background: var(–inp);
color: var(–muted);
}
.bsbtn.rm {
background: #ff3b30;
color: #fff;
}
.bs-inp {
width: 100%;
background: var(–inp);
border: none;
border-radius: 10px;
padding: 10px 12px;
font-size: 14px;
color: var(–text);
outline: none;
margin-bottom: 8px;
}
.bs-lbl {
font-size: 10px;
font-weight: 700;
color: var(–muted);
margin-bottom: 5px;
text-transform: uppercase;
letter-spacing: .4px;
}

.icon-grid {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 4px;
margin-bottom: 12px;
}
.icon-pick {
aspect-ratio: 1;
border: 1.5px solid var(–border);
border-radius: 7px;
background: transparent;
display: flex;
align-items: center;
justify-content: center;
font-size: 15px;
}
.icon-pick.on {
border-color: var(–a);
background: var(–a2);
}

.color-grid {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 5px;
margin-bottom: 12px;
}
.color-dot {
aspect-ratio: 1;
border-radius: 50%;
border: 2.5px solid transparent;
display: flex;
align-items: center;
justify-content: center;
color: transparent;
font-size: 13px;
font-weight: 700;
}
.color-dot.on {
border-color: var(–text);
color: #fff;
}

.freq-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 5px;
margin-bottom: 10px;
}
.freq-btn {
padding: 9px 8px;
border-radius: 9px;
background: var(–inp);
font-size: 12px;
font-weight: 600;
color: var(–muted);
}
.freq-btn.on {
background: var(–a);
color: #fff;
}

.cd-row {
display: flex;
gap: 5px;
margin-bottom: 10px;
flex-wrap: wrap;
}
.cd-btn {
flex: 1;
min-width: 38px;
padding: 8px;
border-radius: 9px;
background: var(–inp);
font-size: 12px;
font-weight: 600;
color: var(–muted);
}
.cd-btn.on {
background: var(–a);
color: #fff;
}

.cal-pick-nav {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 10px;
}
.cal-pick-btn {
width: 36px;
height: 36px;
border-radius: 10px;
background: var(–inp);
font-size: 18px;
color: var(–text);
}
.cal-pick-month {
flex: 1;
text-align: center;
font-size: 15px;
font-weight: 700;
}
.cal-pick-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 3px;
margin-bottom: 14px;
}
.cp-d {
padding: 8px 2px;
border-radius: 9px;
background: transparent;
font-size: 13px;
color: var(–text);
text-align: center;
}
.cp-d.oth {
color: var(–muted);
opacity: .5;
}
.cp-d.tod {
color: var(–a);
font-weight: 800;
}
.cp-d.inw {
background: rgba(124,92,191,.15);
color: var(–a);
font-weight: 600;
}

#thOv {
position: fixed;
inset: 0;
background: rgba(0,0,0,.5);
z-index: 200;
display: none;
}
#thOv.on {
display: block;
}
#thSh {
position: fixed;
bottom: 0;
left: 0;
right: 0;
z-index: 201;
background: var(–card);
border-radius: 22px 22px 0 0;
padding: 0 20px calc(var(–sb) + 20px);
transform: translateY(100%);
transition: transform .3s;
max-height: 85vh;
overflow-y: auto;
}
#thSh.on {
transform: translateY(0);
}
.tgrid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
margin-bottom: 18px;
}
.tdot {
aspect-ratio: 1;
border-radius: 50%;
border: 3px solid transparent;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
color: transparent;
font-weight: 700;
}
.tdot.on {
border-color: var(–text);
color: #fff;
}
.dkrow {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px;
background: var(–inp);
border-radius: 14px;
}
.dkl {
font-size: 15px;
font-weight: 600;
}
.sw {
width: 51px;
height: 31px;
border-radius: 16px;
background: var(–border);
position: relative;
transition: .2s;
}
.sw.on {
background: #34c759;
}
.swk {
position: absolute;
top: 2px;
left: 2px;
width: 27px;
height: 27px;
border-radius: 50%;
background: #fff;
box-shadow: 0 2px 4px rgba(0,0,0,.2);
transition: .2s;
}
.sw.on .swk {
left: 22px;
}

#fab {
position: fixed;
right: 16px;
bottom: calc(var(–sb) + 72px);
width: 50px;
height: 50px;
border-radius: 50%;
background: var(–a);
color: #fff;
font-size: 26px;
box-shadow: 0 4px 16px rgba(0,0,0,.25);
z-index: 99;
display: flex;
align-items: center;
justify-content: center;
opacity: .92;
}
#fab:active {
opacity: 1;
transform: scale(.95);
}

.empty {
text-align: center;
padding: 40px 20px;
color: var(–muted);
font-size: 14px;
line-height: 1.7;
}
.empty-i {
font-size: 44px;
margin-bottom: 10px;
}

.notif-banner {
margin: 0 16px 12px;
padding: 12px;
background: #ff950022;
border-radius: 12px;
display: flex;
align-items: center;
gap: 10px;
}
.notif-banner-text {
flex: 1;
font-size: 12px;
color: #ff9500;
font-weight: 600;
}
</style>

</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="sb"></div>
    <div class="h1">
      <div class="logo">✨ Привычки</div>
      <button class="ico" onclick="openTh()">🎨</button>
    </div>
    <div class="top-extra">
      <div class="hdr-stats">
        <button class="hstat" onclick="openStatDetail('today')">
          <div class="hstat-val" id="stat-today">0%</div>
          <div class="hstat-lbl">Сегодня</div>
        </button>
        <button class="hstat" onclick="openStatDetail('week')">
          <div class="hstat-val" id="stat-week">0%</div>
          <div class="hstat-lbl">Неделя</div>
        </button>
        <button class="hstat" onclick="openStatDetail('streak')">
          <div class="hstat-val" id="stat-streak">🔥0</div>
          <div class="hstat-lbl">Серия</div>
        </button>
        <button class="hstat" onclick="openStatDetail('focus')">
          <div class="hstat-val" id="stat-focus" style="font-size:14px">⭐</div>
          <div class="hstat-lbl">Фокус</div>
        </button>
      </div>
      <div class="weekgraph" id="weekgraph"></div>
    </div>
  </div>

  <div id="wnav">
    <button class="warr" onclick="shW(-1)">‹</button>
    <button class="wlbl" id="wlbl" onclick="openWeekPicker()"></button>
    <button class="wnow" onclick="goNow()">📅</button>
    <button class="warr" onclick="shW(1)">›</button>
  </div>

  <div id="content"></div>

<button id="fab" onclick="openNewHabit()">+</button>

  <div id="tabs">
    <button class="tb on" onclick="setTab('today',this)"><span class="tbi">📋</span><span class="tbl">Сегодня</span></button>
    <button class="tb" onclick="setTab('week',this)"><span class="tbi">📅</span><span class="tbl">Неделя</span></button>
    <button class="tb" onclick="setTab('stats',this)"><span class="tbi">📊</span><span class="tbl">Статистика</span></button>
    <button class="tb" onclick="setTab('manage',this)"><span class="tbi">⚙️</span><span class="tbl">Привычки</span></button>
  </div>
</div>

<div class="bsheet" id="habitSheet" onclick="closeBSheet('habitSheet',event)">
  <div class="bsbox">
    <div class="bsh"></div>
    <div class="bst" id="habit-sheet-title">Новая привычка</div>
    <div class="bs-lbl">Название</div>
    <input class="bs-inp" id="h-name" placeholder="Например: пить воду"/>
    <div class="bs-lbl">Иконка</div>
    <div class="icon-grid" id="icon-grid"></div>
    <div class="bs-lbl">Цвет</div>
    <div class="color-grid" id="color-grid"></div>
    <div class="bs-lbl">Частота</div>
    <div class="freq-row">
      <button class="freq-btn on" id="freq-daily" onclick="setFreq('daily')">Каждый день</button>
      <button class="freq-btn" id="freq-weekdays" onclick="setFreq('weekdays')">Пн–Пт</button>
      <button class="freq-btn" id="freq-weekend" onclick="setFreq('weekend')">Сб–Вс</button>
      <button class="freq-btn" id="freq-custom" onclick="setFreq('custom')">Свои дни</button>
    </div>
    <div id="custom-days-row" style="display:none">
      <div class="cd-row" id="custom-days"></div>
    </div>
    <div class="bs-lbl">Время напоминания</div>
    <input class="bs-inp" id="h-remind" type="time"/>
    <div class="bs-lbl">Заметка</div>
    <input class="bs-inp" id="h-note" placeholder="Зачем эта привычка..."/>
    <button class="bsbtn ok" onclick="saveHabit()">Сохранить</button>
    <button class="bsbtn rm" id="h-del-btn" onclick="deleteHabit()" style="display:none">Удалить</button>
    <button class="bsbtn cl" onclick="closeBSheet('habitSheet')">Отмена</button>
  </div>
</div>

<div class="bsheet" id="detailSheet" onclick="closeBSheet('detailSheet',event)">
  <div class="bsbox">
    <div class="bsh"></div>
    <div id="detail-content"></div>
    <button class="bsbtn cl" onclick="closeBSheet('detailSheet')">Закрыть</button>
  </div>
</div>

<div class="bsheet" id="calPickSheet" onclick="closeBSheet('calPickSheet',event)">
  <div class="bsbox">
    <div class="bsh"></div>
    <div class="bst">📅 Выбрать неделю</div>
    <div class="cal-pick-nav">
      <button class="cal-pick-btn" onclick="calPickMo(-1)">‹</button>
      <div class="cal-pick-month" id="cal-pick-month"></div>
      <button class="cal-pick-btn" onclick="calPickMo(1)">›</button>
    </div>
    <div class="cal-pick-grid" id="cal-pick-grid"></div>
    <button class="bsbtn cl" onclick="closeBSheet('calPickSheet')">Закрыть</button>
  </div>
</div>

<div id="thOv" onclick="closeTh()"></div>
<div id="thSh">
  <div class="bsh" style="margin-top:12px"></div>
  <div style="font-size:18px;font-weight:700;margin-bottom:14px">Оформление</div>
  <div class="tgrid" id="tgrid"></div>
  <div class="dkrow" onclick="togDk()">
    <div class="dkl">🌙 Тёмный режим</div>
    <div class="sw" id="dsw"><div class="swk"></div></div>
  </div>
</div>

<script>
var SK = "habits_v1";
var HABIT_COLORS = ["#7c5cbf","#4a9e7f","#3a7fd5","#e07b39","#c4566a","#3a9fa8","#c9a227","#e03a3a"];
var HABIT_ICONS = ["⭐","🏃","💧","📚","🧘","💪","🍎","😴","☀️","🎯","💊","🌱","✍️","🎨","🎵","🚴","🏋️","🧠","☕","🥗","🦷","🛌","💻","📱"];
var DAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var THEMES = [
  {n:"Фиолетовый",a:"#7c5cbf"},
  {n:"Зелёный",a:"#4a9e7f"},
  {n:"Синий",a:"#3a7fd5"},
  {n:"Оранжевый",a:"#e07b39"},
  {n:"Розовый",a:"#c4566a"},
  {n:"Бирюзовый",a:"#3a9fa8"},
  {n:"Жёлтый",a:"#c9a227"},
  {n:"Красный",a:"#e03a3a"}
];

var D = {habits:[], log:{}};
var tab = "today";
var cw = wkKey(new Date());
var ti = +(localStorage.getItem("hab_ti") || 0);
var dk = localStorage.getItem("hab_dk") === "1";
var editHabitIdx = -1;
var editColor = 0;
var editIcon = 0;
var editFreq = "daily";
var editCustomDays = [0,1,2,3,4];
var calPickDate = new Date();

function load() {
  try {
    D = JSON.parse(localStorage.getItem(SK) || '{"habits":[],"log":{}}');
  } catch(e) {
    D = {habits:[], log:{}};
  }
}
function save() {
  try {
    localStorage.setItem(SK, JSON.stringify(D));
  } catch(e) {}
}
function getLog() {
  if (!D.log) D.log = {};
  return D.log;
}

function localStr(date) {
  var y = date.getFullYear();
  var m = String(date.getMonth()+1).padStart(2,"0");
  var d = String(date.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+d;
}
function monday(date) {
  var d = new Date(date);
  var n = d.getDay();
  var df = n===0 ? -6 : 1-n;
  d.setDate(d.getDate()+df);
  d.setHours(0,0,0,0);
  return d;
}
function wkKey(date) {
  return localStr(monday(date));
}
function shiftKey(k, n) {
  var p = k.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n*7);
  return wkKey(d);
}
function todayStr() {
  return localStr(new Date());
}
function isFuture(dateStr) {
  return dateStr > todayStr();
}
function dayOfWeek(dateStr) {
  var p = dateStr.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.getDay()===0 ? 6 : d.getDay()-1;
}
function fwk(k) {
  var p = k.split("-");
  var s = new Date(+p[0], +p[1]-1, +p[2]);
  var e = new Date(s);
  e.setDate(e.getDate()+6);
  return s.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"}) + " – " + e.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"});
}
function getWeekDates(wk) {
  var p = wk.split("-");
  var dates = [];
  for (var i=0; i<7; i++) {
    var d = new Date(+p[0], +p[1]-1, +p[2]+i);
    dates.push(localStr(d));
  }
  return dates;
}

function isActiveDay(habit, dateStr) {
  var dow = dayOfWeek(dateStr);
  if (habit.freq === "daily") return true;
  if (habit.freq === "weekdays") return dow < 5;
  if (habit.freq === "weekend") return dow >= 5;
  if (habit.freq === "custom") return (habit.customDays || [0,1,2,3,4,5,6]).indexOf(dow) >= 0;
  return true;
}

function isChecked(habitId, dateStr) {
  return !!(getLog()[dateStr] && getLog()[dateStr][habitId]);
}
function toggle(habitId, dateStr) {
  if (isFuture(dateStr)) return;
  if (!getLog()[dateStr]) getLog()[dateStr] = {};
  getLog()[dateStr][habitId] = !getLog()[dateStr][habitId];
  save();
  render();
}

function getStreak(habit) {
  var streak = 0;
  var d = new Date();
  for (var i=0; i<365; i++) {
    var ds = localStr(d);
    if (isFuture(ds)) { d.setDate(d.getDate()-1); continue; }
    if (!isActiveDay(habit, ds)) { d.setDate(d.getDate()-1); continue; }
    if (isChecked(habit.id, ds)) {
      streak++;
    } else if (i > 0) {
      break;
    }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function getMonthPct(habit, year, month) {
  var total = 0;
  var done = 0;
  var daysInM = new Date(year, month+1, 0).getDate();
  for (var d=1; d<=daysInM; d++) {
    var ds = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    if (isFuture(ds)) continue;
    if (!isActiveDay(habit, ds)) continue;
    total++;
    if (isChecked(habit.id, ds)) done++;
  }
  return total ? Math.round(done/total*100) : 0;
}

function getWeekPct(habit, wk) {
  var dates = getWeekDates(wk);
  var total = 0, done = 0;
  for (var i=0; i<dates.length; i++) {
    var ds = dates[i];
    if (isFuture(ds)) continue;
    if (!isActiveDay(habit, ds)) continue;
    total++;
    if (isChecked(habit.id, ds)) done++;
  }
  return total ? Math.round(done/total*100) : 0;
}

function getTodayPct() {
  var today = todayStr();
  var active = D.habits.filter(function(h){ return isActiveDay(h, today); });
  if (!active.length) return 0;
  var done = active.filter(function(h){ return isChecked(h.id, today); }).length;
  return Math.round(done/active.length*100);
}

function getWeekOverallPct() {
  var dates = getWeekDates(cw);
  var total = 0, done = 0;
  for (var i=0; i<D.habits.length; i++) {
    for (var j=0; j<dates.length; j++) {
      var ds = dates[j];
      if (isFuture(ds)) continue;
      if (!isActiveDay(D.habits[i], ds)) continue;
      total++;
      if (isChecked(D.habits[i].id, ds)) done++;
    }
  }
  return total ? Math.round(done/total*100) : 0;
}

function getBestStreak() {
  if (!D.habits.length) return 0;
  var best = 0;
  for (var i=0; i<D.habits.length; i++) {
    var s = getStreak(D.habits[i]);
    if (s > best) best = s;
  }
  return best;
}

function getFocusHabit() {
  if (!D.habits.length) return null;
  var now = new Date();
  var worst = D.habits[0];
  var worstPct = getMonthPct(D.habits[0], now.getFullYear(), now.getMonth());
  for (var i=1; i<D.habits.length; i++) {
    var p = getMonthPct(D.habits[i], now.getFullYear(), now.getMonth());
    if (p < worstPct) {
      worst = D.habits[i];
      worstPct = p;
    }
  }
  return worst;
}

function applyTheme() {
  var t = THEMES[ti];
  document.documentElement.style.setProperty("--a", t.a);
  document.documentElement.style.setProperty("--a2", t.a + "22");
  document.body.classList.toggle("dk", dk);
  var sw = document.getElementById("dsw");
  if (sw) sw.classList.toggle("on", dk);
  var meta = document.querySelector("meta[name=theme-color]");
  if (meta) meta.content = t.a;
}

function buildTGrid() {
  var html = "";
  for (var i=0; i<THEMES.length; i++) {
    html += '<div class="tdot ' + (i===ti ? "on" : "") + '" style="background:' + THEMES[i].a + '" onclick="pickT(' + i + ')">✓</div>';
  }
  document.getElementById("tgrid").innerHTML = html;
}

function pickT(i) {
  ti = i;
  localStorage.setItem("hab_ti", i);
  applyTheme();
  buildTGrid();
  render();
}

function togDk() {
  dk = !dk;
  localStorage.setItem("hab_dk", dk ? "1" : "0");
  applyTheme();
  render();
}

function openTh() {
  document.getElementById("thSh").classList.add("on");
  document.getElementById("thOv").classList.add("on");
}
function closeTh() {
  document.getElementById("thSh").classList.remove("on");
  document.getElementById("thOv").classList.remove("on");
}

function shW(n) {
  cw = shiftKey(cw, n);
  render(true);
}
function goNow() {
  cw = wkKey(new Date());
  render(true);
}
function setTab(name, btn) {
  tab = name;
  var tabs = document.querySelectorAll(".tb");
  for (var i=0; i<tabs.length; i++) tabs[i].classList.remove("on");
  btn.classList.add("on");
  render(true);
}

function buildWeekGraph() {
  var dates = getWeekDates(wkKey(new Date()));
  var today = todayStr();
  var html = "";
  for (var i=0; i<dates.length; i++) {
    var ds = dates[i];
    var active = D.habits.filter(function(h){ return isActiveDay(h, ds) && !isFuture(ds); });
    var done = active.filter(function(h){ return isChecked(h.id, ds); }).length;
    var pct = active.length ? Math.round(done/active.length*100) : 0;
    var isToday = ds === today;
    html += '<div class="wgcol" style="' + (isToday ? "background:rgba(124,92,191,.25)" : "") + '">';
    html += '<div class="wgfill" style="height:' + pct + '%"></div>';
    html += '<div class="wglbl">' + DAYS_SHORT[i].charAt(0) + '</div>';
    html += '</div>';
  }
  document.getElementById("weekgraph").innerHTML = html;
}

function renderHeader() {
  document.getElementById("wlbl").innerHTML = "📅 " + fwk(cw) + (cw === wkKey(new Date()) ? " · сейчас" : "");
  document.getElementById("stat-today").textContent = getTodayPct() + "%";
  document.getElementById("stat-week").textContent = getWeekOverallPct() + "%";
  document.getElementById("stat-streak").textContent = "🔥" + getBestStreak();
  var focus = getFocusHabit();
  document.getElementById("stat-focus").textContent = focus ? focus.icon : "⭐";
  buildWeekGraph();
}

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderToday() {
  var today = todayStr();
  var active = D.habits.filter(function(h){ return isActiveDay(h, today); });
  var banner = "";
  if ("Notification" in window && Notification.permission === "default") {
    var hasRemind = false;
    for (var i=0; i<D.habits.length; i++) if (D.habits[i].remind) hasRemind = true;
    if (hasRemind) {
      banner = '<div class="notif-banner" onclick="askNotifPermission()"><span>🔔</span><div class="notif-banner-text">Включить уведомления для напоминаний</div><span style="color:#ff9500">›</span></div>';
    }
  }
  if (!active.length) {
    return banner + '<div class="empty"><div class="empty-i">✨</div>Нет привычек на сегодня.<br>Нажмите + чтобы добавить!</div>';
  }
  var done = active.filter(function(h){ return isChecked(h.id, today); }).length;
  var pct = Math.round(done/active.length*100);
  var rows = "";
  for (var i=0; i<active.length; i++) {
    var h = active[i];
    var checked = isChecked(h.id, today);
    var streak = getStreak(h);
    rows += '<div class="hab-row" onclick="toggle(\'' + h.id + '\',\'' + today + '\')">';
    rows += '<div style="display:flex;align-items:center;gap:12px">';
    rows += '<div class="hab-icon" style="background:' + h.color + '22">' + (h.icon || "⭐") + '</div>';
    rows += '<div style="flex:1;min-width:0">';
    rows += '<div class="hab-name" style="' + (checked ? "text-decoration:line-through;opacity:.5" : "") + '">' + esc(h.name) + '</div>';
    rows += '<div class="hab-meta">';
    if (streak > 0) rows += '<span class="hab-streak">🔥 ' + streak + '</span>';
    if (h.remind) rows += '<span style="font-size:11px;color:var(--muted)">🕐 ' + h.remind + '</span>';
    rows += '</div></div>';
    rows += '<div style="width:32px;height:32px;border-radius:50%;border:2px solid ' + (checked ? h.color : "var(--border)") + ';background:' + (checked ? h.color : "transparent") + ';display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0">' + (checked ? "✓" : "") + '</div>';
    rows += '</div></div>';
  }
  return banner +
    '<div class="card">' +
    '<div class="ch"><span class="ct">Сегодня</span><span class="cb">' + done + '/' + active.length + ' · ' + pct + '%</span></div>' +
    '<div style="padding:10px 16px;border-bottom:1px solid var(--border)"><div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;background:var(--a);width:' + pct + '%;border-radius:4px;transition:width .4s"></div></div></div>' +
    rows +
    '</div>';
}

function renderWeek() {
  var dates = getWeekDates(cw);
  var today = todayStr();
  if (!D.habits.length) return '<div class="empty"><div class="empty-i">📅</div>Нет привычек.</div>';
  var rows = "";
  for (var k=0; k<D.habits.length; k++) {
    var h = D.habits[k];
    var weekPct = getWeekPct(h, cw);
    var streak = getStreak(h);
    var dayCols = "";
    for (var i=0; i<dates.length; i++) {
      var ds = dates[i];
      var active = isActiveDay(h, ds);
      var future = isFuture(ds);
      var checked = isChecked(h.id, ds);
      var isToday = ds === today;
      var onclick = (!future && active) ? 'event.stopPropagation();toggle(\'' + h.id + '\',\'' + ds + '\')' : 'event.stopPropagation()';
      dayCols += '<div class="day-check"><div class="day-lbl">' + DAYS_SHORT[i] + '</div>';
      dayCols += '<button class="day-btn ' + (checked ? "done" : "") + ' ' + (isToday && !checked ? "today" : "") + ' ' + (future ? "future" : "") + '" onclick="' + onclick + '">';
      dayCols += (checked ? "✓" : (active ? "·" : "—")) + '</button></div>';
    }
    rows += '<div class="hab-row"><div class="hab-top">';
    rows += '<div class="hab-icon" style="background:' + h.color + '22">' + (h.icon || "⭐") + '</div>';
    rows += '<div class="hab-info"><div class="hab-name">' + esc(h.name) + '</div>';
    rows += '<div class="hab-meta">';
    if (streak > 0) rows += '<span class="hab-streak">🔥' + streak + '</span>';
    rows += '<span class="hab-pct">' + weekPct + '%</span></div></div></div>';
    rows += '<div class="week-days">' + dayCols + '</div></div>';
  }
  return '<div class="card"><div class="ch"><span class="ct">Неделя</span><span class="cb">' + fwk(cw) + '</span></div>' + rows + '</div>';
}

function renderStats() {
  if (!D.habits.length) return '<div class="empty"><div class="empty-i">📊</div>Нет привычек.</div>';
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var rows = "";
  for (var i=0; i<D.habits.length; i++) {
    var h = D.habits[i];
    var monthPct = getMonthPct(h, y, m);
    var streak = getStreak(h);
    rows += '<div class="hab-progress-row" onclick="openHabitDetail(\'' + h.id + '\')">';
    rows += '<div class="hp-icon">' + (h.icon || "⭐") + '</div>';
    rows += '<div class="hp-info"><div class="hp-name">' + esc(h.name) + ' ' + (streak > 0 ? "🔥" + streak : "") + '</div>';
    rows += '<div class="hp-bar"><div class="hp-fill" style="width:' + monthPct + '%;background:' + h.color + '"></div></div></div>';
    rows += '<div class="hp-pct" style="color:' + h.color + '">' + monthPct + '%</div></div>';
  }
  var best = D.habits[0];
  var bestPct = getMonthPct(best, y, m);
  for (var i=1; i<D.habits.length; i++) {
    var p = getMonthPct(D.habits[i], y, m);
    if (p > bestPct) { best = D.habits[i]; bestPct = p; }
  }
  var daysInM = new Date(y, m+1, 0).getDate();
  var firstDow = new Date(y, m, 1).getDay() === 0 ? 6 : new Date(y, m, 1).getDay() - 1;
  var calHtml = "";
  for (var i=0; i<firstDow; i++) calHtml += '<div class="cal-cell empty"></div>';
  for (var d=1; d<=daysInM; d++) {
    var ds = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    var isToday = ds === todayStr();
    var active = isActiveDay(best, ds) && !isFuture(ds);
    var checked = isChecked(best.id, ds);
    calHtml += '<div class="cal-cell ' + (checked && active ? "done" : "") + ' ' + (isToday ? "today" : "") + '" style="' + (checked && active ? "background:" + best.color : "") + '">' + d + '</div>';
  }
  var bestCal = "";
  if (best) {
    var headers = "";
    for (var i=0; i<DAYS_SHORT.length; i++) headers += '<div class="cal-day-header">' + DAYS_SHORT[i] + '</div>';
    bestCal = '<div class="card"><div class="ch"><span class="ct">' + best.icon + ' ' + esc(best.name) + '</span><span class="cb">Лучшая</span></div><div class="cal-container"><div class="cal-head">' + headers + '</div><div class="cal-grid">' + calHtml + '</div></div></div>';
  }
  return '<div class="stats-grid">' +
    '<button class="sc" onclick="openStatDetail(\'today\')"><div class="si">📅</div><div class="sv">' + getTodayPct() + '%</div><div class="sl2">Сегодня</div><div class="sc-expand">Подробнее ›</div></button>' +
    '<button class="sc" onclick="openStatDetail(\'streak\')"><div class="si">🔥</div><div class="sv">' + getBestStreak() + '</div><div class="sl2">Лучшая серия</div><div class="sc-expand">Подробнее ›</div></button>' +
    '<button class="sc" onclick="openStatDetail(\'week\')"><div class="si">✅</div><div class="sv">' + getWeekOverallPct() + '%</div><div class="sl2">Неделя</div><div class="sc-expand">Подробнее ›</div></button>' +
    '<button class="sc" onclick="openStatDetail(\'all\')"><div class="si">📊</div><div class="sv">' + D.habits.length + '</div><div class="sl2">Привычек</div><div class="sc-expand">Все ›</div></button>' +
    '</div>' +
    '<div class="card"><div class="ch"><span class="ct">За месяц</span><span class="cb">Нажми для деталей</span></div><div style="padding:0 16px">' + rows + '</div></div>' +
    bestCal;
}

function renderManage() {
  var total = D.habits.length;
  var totalLogs = Object.keys(getLog()).length;
  var notifStatus = "❌ Не поддерживаются";
  if ("Notification" in window) {
    if (Notification.permission === "granted") notifStatus = "✅ Включены";
    else if (Notification.permission === "denied") notifStatus = "❌ Заблокированы в настройках";
    else notifStatus = "⚠️ Нажми чтобы включить";
  }
  var habitsCard = "";
  if (!total) {
    habitsCard = '<div class="empty"><div class="empty-i">⚙️</div>Нет привычек.<br>Нажмите + чтобы добавить!</div>';
  } else {
    var rows = "";
    for (var i=0; i<D.habits.length; i++) {
      var h = D.habits[i];
      var streak = getStreak(h);
      var now = new Date();
      var monthPct = getMonthPct(h, now.getFullYear(), now.getMonth());
      var freqText = h.freq === "daily" ? "Каждый день" : h.freq === "weekdays" ? "Пн–Пт" : h.freq === "weekend" ? "Сб–Вс" : "Свои дни";
      rows += '<div class="hab-row" onclick="openEditHabit(' + i + ')"><div class="hab-top">';
      rows += '<div class="hab-icon" style="background:' + h.color + '22">' + (h.icon || "⭐") + '</div>';
      rows += '<div class="hab-info"><div class="hab-name">' + esc(h.name) + '</div>';
      rows += '<div class="hab-meta"><span class="hab-pct">' + freqText + '</span>';
      if (h.remind) rows += '<span style="font-size:11px;color:var(--muted)">🕐 ' + h.remind + '</span>';
      if (streak > 0) rows += '<span class="hab-streak">🔥' + streak + '</span>';
      rows += '</div>';
      if (h.note) rows += '<div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">"' + esc(h.note) + '"</div>';
      rows += '</div>';
      rows += '<div style="text-align:right;flex-shrink:0"><div style="font-size:13px;font-weight:700;color:' + h.color + '">' + monthPct + '%</div><div style="font-size:10px;color:var(--muted)">за месяц</div></div>';
      rows += '</div></div>';
    }
    habitsCard = '<div class="card"><div class="ch"><span class="ct">Все привычки</span><span class="cb">' + total + '</span></div>' + rows + '</div>';
  }
  return habitsCard +
    '<div class="card">' +
    '<div class="ch"><span class="ct">⚙️ Настройки</span></div>' +
    '<div style="padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)" onclick="askNotifPermission()"><div><div style="font-size:14px;font-weight:600">🔔 Уведомления</div><div style="font-size:12px;color:var(--muted)">' + notifStatus + '</div></div><div style="font-size:18px;color:var(--muted)">›</div></div>' +
    '<div style="padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)" onclick="openTh()"><div><div style="font-size:14px;font-weight:600">🎨 Тема и цвет</div><div style="font-size:12px;color:var(--muted)">' + THEMES[ti].n + (dk ? " · Тёмная" : " · Светлая") + '</div></div><div style="font-size:18px;color:var(--muted)">›</div></div>' +
    '<div style="padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)" onclick="exportData()"><div><div style="font-size:14px;font-weight:600">📥 Экспорт данных</div><div style="font-size:12px;color:var(--muted)">Скачать резервную копию</div></div><div style="font-size:18px;color:var(--muted)">›</div></div>' +
    '<div style="padding:14px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)" onclick="document.getElementById(\'import-input\').click()"><div><div style="font-size:14px;font-weight:600">📤 Импорт данных</div><div style="font-size:12px;color:var(--muted)">Восстановить из файла</div></div><div style="font-size:18px;color:var(--muted)">›</div></div>' +
    '<input type="file" id="import-input" style="display:none" accept=".json" onchange="importData(event)"/>' +
    '<div style="padding:14px 16px;display:flex;justify-content:space-between" onclick="confirmReset()"><div><div style="font-size:14px;font-weight:600;color:#ff3b30">🗑 Сбросить все данные</div><div style="font-size:12px;color:var(--muted)">' + total + ' привычек · ' + totalLogs + ' записей</div></div><div style="font-size:18px;color:var(--muted)">›</div></div>' +
    '</div>';
}

function openStatDetail(type) {
  var html = "";
  if (type === "today") {
    var today = todayStr();
    var active = D.habits.filter(function(h){ return isActiveDay(h, today); });
    var done = active.filter(function(h){ return isChecked(h.id, today); });
    var undone = active.filter(function(h){ return !isChecked(h.id, today); });
    html = '<div class="bst">📅 Сегодня · ' + getTodayPct() + '%</div>';
    html += '<div class="detail-box"><div class="detail-row"><span class="detail-lbl">Всего привычек</span><span class="detail-val">' + active.length + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Выполнено</span><span class="detail-val" style="color:var(--a)">' + done.length + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Осталось</span><span class="detail-val" style="color:#ff9500">' + undone.length + '</span></div></div>';
    if (undone.length) {
      html += '<div class="bs-lbl">Осталось выполнить</div>';
      for (var i=0; i<undone.length; i++) {
        html += '<div style="padding:10px;background:var(--inp);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">' + undone[i].icon + '</span><span style="font-size:14px;font-weight:600">' + esc(undone[i].name) + '</span></div>';
      }
    }
    if (done.length) {
      html += '<div class="bs-lbl" style="margin-top:12px">Выполнено</div>';
      for (var i=0; i<done.length; i++) {
        html += '<div style="padding:10px;background:var(--a2);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">' + done[i].icon + '</span><span style="font-size:14px;font-weight:600">' + esc(done[i].name) + '</span><span style="margin-left:auto;color:var(--a)">✓</span></div>';
      }
    }
  } else if (type === "week") {
    var pct = getWeekOverallPct();
    var dates = getWeekDates(cw);
    var total = 0, done = 0;
    for (var i=0; i<D.habits.length; i++) {
      for (var j=0; j<dates.length; j++) {
        var ds = dates[j];
        if (isFuture(ds)) continue;
        if (!isActiveDay(D.habits[i], ds)) continue;
        total++;
        if (isChecked(D.habits[i].id, ds)) done++;
      }
    }
    html = '<div class="bst">✅ Неделя · ' + pct + '%</div>';
    html += '<div class="detail-box"><div class="detail-row"><span class="detail-lbl">Период</span><span class="detail-val">' + fwk(cw) + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Всего отметок</span><span class="detail-val">' + total + '</span></div>';
    html += '<div class="detail-row"><span class="detail-lbl">Выполнено</span><span class="detail-val" style="color:var(--a)">' + done + '</span></div></div>';
    html += '<div class="bs-lbl">По привычкам</div>';
    for (var i=0; i<D.habits.length; i++) {
      var h = D.habits[i];
      var wp = getWeekPct(h, cw);
      html += '<div style="padding:10px;background:var(--inp);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">' + h.icon + '</span><span style="flex:1;font-size:13px;font-weight:600">' + esc(h.name) + '</span><span style="color:' + h.color + ';font-weight:700">' + wp + '%</span></div>';
    }
  } else if (type === "streak") {
    var sorted = D.habits.slice().sort(function(a,b){ return getStreak(b) - getStreak(a); });
    html = '<div class="bst">🔥 Серии дней</div>';
    html += '<div class="detail-box"><div class="detail-row"><span class="detail-lbl">Лучшая серия</span><span class="detail-val">🔥 ' + getBestStreak() + ' дней</span></div></div>';
    html += '<div class="bs-lbl">По привычкам</div>';
    for (var i=0; i<sorted.length; i++) {
      var h = sorted[i];
      var s = getStreak(h);
      html += '<div style="padding:10px;background:var(--inp);border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><span style="font-size:18px">' + h.icon + '</span><span style="flex:1;font-size:13px;font-weight:600">' + esc(h.name) + '</span><span style="color:#ff9500;font-weight:700">🔥 ' + s + '</span></div>';
    }
  } else if (type === "focus") {
    var focus = getFocusHabit();
    if (!focus) {
      html = '<div class="bst">⭐ Фокус</div><p style="color:var(--muted)">Добавьте привычки</p>';
    } else {
      var now = new Date();
      var mp = getMonthPct(focus, now.getFullYear(), now.getMonth());
      html = '<div class="bst">⭐ Привычка для фокуса</div>';
      html += '<div style="padding:14px;background:' + focus.color + '22;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px"><span style="font-size:32px">' + focus.icon + '</span><div><div style="font-size:16px;font-weight:700">' + esc(focus.name) + '</div><div style="font-size:12px;color:var(--muted);margin-top:2px">Эту привычку нужно прокачать</div></div></div>';
      html += '<div class="detail-box"><div class="detail-row"><span class="detail-lbl">За месяц</span><span class="detail-val" style="color:' + focus.color + '">' + mp + '%</span></div>';
      html += '<div class="detail-row"><span class="detail-lbl">Серия</span><span class="detail-val">🔥 ' + getStreak(focus) + '</span></div></div>';
      html += '<p style="font-size:13px;color:var(--muted);line-height:1.5;padding:0 4px">Сосредоточься на этой привычке — она нуждается в большем внимании.</p>';
    }
  } else if (type === "all") {
    html = '<div class="bst">📊 Все привычки · ' + D.habits.length + '</div>';
    for (var i=0; i<D.habits.length; i++) {
      var h = D.habits[i];
      var now = new Date();
      var mp = getMonthPct(h, now.getFullYear(), now.getMonth());
      var s = getStreak(h);
      var freqText = h.freq === "daily" ? "Каждый день" : h.freq === "weekdays" ? "Пн–Пт" : h.freq === "weekend" ? "Сб–Вс" : "Свои дни";
      html += '<div style="padding:12px;background:var(--inp);border-radius:12px;margin-bottom:8px">';
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:22px">' + h.icon + '</span><span style="flex:1;font-size:14px;font-weight:700">' + esc(h.name) + '</span><span style="color:' + h.color + ';font-weight:700">' + mp + '%</span></div>';
      html += '<div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:6px"><div style="height:100%;background:' + h.color + ';width:' + mp + '%"></div></div>';
      html += '<div style="display:flex;gap:8px;font-size:11px;color:var(--muted)"><span>🔥' + s + ' серия</span><span>' + freqText + '</span></div></div>';
    }
  }
  document.getElementById("detail-content").innerHTML = html;
  openBSheet("detailSheet");
}

function openHabitDetail(habitId) {
  var h = null;
  for (var i=0; i<D.habits.length; i++) if (D.habits[i].id === habitId) { h = D.habits[i]; break; }
  if (!h) return;
  var now = new Date();
  var mp = getMonthPct(h, now.getFullYear(), now.getMonth());
  var wp = getWeekPct(h, wkKey(new Date()));
  var s = getStreak(h);
  var daysInM = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  var firstDow = new Date(now.getFullYear(), now.getMonth(), 1).getDay() === 0 ? 6 : new Date(now.getFullYear(), now.getMonth(), 1).getDay() - 1;
  var calHtml = "";
  for (var i=0; i<firstDow; i++) calHtml += '<div class="cal-cell empty"></div>';
  for (var d=1; d<=daysInM; d++) {
    var ds = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    var isToday = ds === todayStr();
    var active = isActiveDay(h, ds) && !isFuture(ds);
    var checked = isChecked(h.id, ds);
    calHtml += '<div class="cal-cell ' + (checked && active ? "done" : "") + ' ' + (isToday ? "today" : "") + '" style="' + (checked && active ? "background:" + h.color : "") + '">' + d + '</div>';
  }
  var freqText = h.freq === "daily" ? "Каждый день" : h.freq === "weekdays" ? "Пн–Пт" : h.freq === "weekend" ? "Сб–Вс" : "Свои дни";
  var headers = "";
  for (var i=0; i<DAYS_SHORT.length; i++) headers += '<div class="cal-day-header">' + DAYS_SHORT[i] + '</div>';
  var html = '<div style="padding:14px;background:' + h.color + '22;border-radius:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px"><span style="font-size:32px">' + h.icon + '</span><div><div style="font-size:18px;font-weight:700">' + esc(h.name) + '</div>';
  if (h.note) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">"' + esc(h.note) + '"</div>';
  html += '</div></div>';
  html += '<div class="detail-box"><div class="detail-row"><span class="detail-lbl">За месяц</span><span class="detail-val" style="color:' + h.color + '">' + mp + '%</span></div>';
  html += '<div class="detail-row"><span class="detail-lbl">За неделю</span><span class="detail-val">' + wp + '%</span></div>';
  html += '<div class="detail-row"><span class="detail-lbl">Серия</span><span class="detail-val">🔥 ' + s + '</span></div>';
  html += '<div class="detail-row"><span class="detail-lbl">Частота</span><span class="detail-val">' + freqText + '</span></div></div>';
  html += '<div class="bs-lbl">Календарь месяца</div>';
  html += '<div class="cal-head">' + headers + '</div>';
  html += '<div class="cal-grid">' + calHtml + '</div>';
  document.getElementById("detail-content").innerHTML = html;
  openBSheet("detailSheet");
}

function buildIconGrid() {
  var html = "";
  for (var i=0; i<HABIT_ICONS.length; i++) {
    html += '<div class="icon-pick ' + (i===editIcon ? "on" : "") + '" onclick="pickIcon(' + i + ')">' + HABIT_ICONS[i] + '</div>';
  }
  document.getElementById("icon-grid").innerHTML = html;
}
function pickIcon(i) { editIcon = i; buildIconGrid(); }

function buildColorGrid() {
  var html = "";
  for (var i=0; i<HABIT_COLORS.length; i++) {
    html += '<div class="color-dot ' + (i===editColor ? "on" : "") + '" style="background:' + HABIT_COLORS[i] + '" onclick="pickColor(' + i + ')">✓</div>';
  }
  document.getElementById("color-grid").innerHTML = html;
}
function pickColor(i) { editColor = i; buildColorGrid(); }

function setFreq(f) {
  editFreq = f;
  var keys = ["daily","weekdays","weekend","custom"];
  for (var i=0; i<keys.length; i++) {
    var el = document.getElementById("freq-" + keys[i]);
    if (el) el.classList.toggle("on", keys[i] === f);
  }
  document.getElementById("custom-days-row").style.display = f === "custom" ? "block" : "none";
  if (f === "custom") renderCustomDays();
}
function renderCustomDays() {
  var html = "";
  for (var i=0; i<7; i++) {
    html += '<button class="cd-btn ' + (editCustomDays.indexOf(i) >= 0 ? "on" : "") + '" onclick="toggleCustomDay(' + i + ')">' + DAYS_SHORT[i] + '</button>';
  }
  document.getElementById("custom-days").innerHTML = html;
}
function toggleCustomDay(i) {
  var idx = editCustomDays.indexOf(i);
  if (idx >= 0) editCustomDays.splice(idx, 1);
  else editCustomDays.push(i);
  renderCustomDays();
}

function openNewHabit() {
  editHabitIdx = -1;
  editColor = Math.floor(Math.random() * HABIT_COLORS.length);
  editIcon = 0;
  editFreq = "daily";
  editCustomDays = [0,1,2,3,4];
  document.getElementById("habit-sheet-title").textContent = "Новая привычка";
  document.getElementById("h-name").value = "";
  document.getElementById("h-remind").value = "";
  document.getElementById("h-note").value = "";
  document.getElementById("h-del-btn").style.display = "none";
  buildIconGrid();
  buildColorGrid();
  setFreq("daily");
  openBSheet("habitSheet");
}

function openEditHabit(i) {
  editHabitIdx = i;
  var h = D.habits[i];
  editColor = HABIT_COLORS.indexOf(h.color);
  if (editColor < 0) editColor = 0;
  editIcon = HABIT_ICONS.indexOf(h.icon);
  if (editIcon < 0) editIcon = 0;
  editFreq = h.freq || "daily";
  editCustomDays = h.customDays || [0,1,2,3,4];
  document.getElementById("habit-sheet-title").textContent = "Изменить привычку";
  document.getElementById("h-name").value = h.name || "";
  document.getElementById("h-remind").value = h.remind || "";
  document.getElementById("h-note").value = h.note || "";
  document.getElementById("h-del-btn").style.display = "block";
  buildIconGrid();
  buildColorGrid();
  setFreq(editFreq);
  openBSheet("habitSheet");
}

function saveHabit() {
  var name = document.getElementById("h-name").value.trim();
  if (!name) return;
  var remindVal = document.getElementById("h-remind").value;
  var habit = {
    id: editHabitIdx >= 0 ? D.habits[editHabitIdx].id : "h" + Date.now(),
    name: name,
    icon: HABIT_ICONS[editIcon] || "⭐",
    color: HABIT_COLORS[editColor] || HABIT_COLORS[0],
    freq: editFreq,
    customDays: editCustomDays.slice(),
    remind: remindVal || "",
    note: document.getElementById("h-note").value.trim() || ""
  };
  if (editHabitIdx >= 0) D.habits[editHabitIdx] = habit;
  else D.habits.push(habit);
  save();
  if (remindVal && "Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  closeBSheet("habitSheet");
  render();
}

function deleteHabit() {
  if (!confirm("Удалить привычку?")) return;
  D.habits.splice(editHabitIdx, 1);
  save();
  closeBSheet("habitSheet");
  render();
}

function openWeekPicker() {
  var p = cw.split("-");
  calPickDate = new Date(+p[0], +p[1]-1, +p[2]);
  renderCalPick();
  openBSheet("calPickSheet");
}

function calPickMo(n) {
  calPickDate.setMonth(calPickDate.getMonth() + n);
  renderCalPick();
}

function renderCalPick() {
  var y = calPickDate.getFullYear(), m = calPickDate.getMonth();
  document.getElementById("cal-pick-month").textContent = calPickDate.toLocaleDateString("ru-RU", {month:"long", year:"numeric"});
  var first = new Date(y, m, 1);
  var startDay = first.getDay() === 0 ? 6 : first.getDay() - 1;
  var daysInM = new Date(y, m+1, 0).getDate();
  var today = new Date();
  today.setHours(0,0,0,0);
  var html = '<div class="cal-day-header">Пн</div><div class="cal-day-header">Вт</div><div class="cal-day-header">Ср</div><div class="cal-day-header">Чт</div><div class="cal-day-header">Пт</div><div class="cal-day-header">Сб</div><div class="cal-day-header">Вс</div>';
  var prev = new Date(y, m, 0).getDate();
  for (var i=startDay-1; i>=0; i--) {
    html += '<button class="cp-d oth" onclick="pickDay(' + y + ',' + (m===0 ? 11 : m-1) + ',' + (prev-i) + ')">' + (prev-i) + '</button>';
  }
  for (var d=1; d<=daysInM; d++) {
    var date = new Date(y, m, d);
    var isToday = date.getTime() === today.getTime();
    var inw = wkKey(date) === cw;
    var cls = "cp-d";
    if (inw) cls += " inw";
    if (isToday && !inw) cls += " tod";
    html += '<button class="' + cls + '" onclick="pickDay(' + y + ',' + m + ',' + d + ')">' + d + '</button>';
  }
  document.getElementById("cal-pick-grid").innerHTML = html;
}

function pickDay(y, m, d) {
  cw = wkKey(new Date(y, m, d));
  closeBSheet("calPickSheet");
  render(true);
}

function exportData() {
  var dataStr = JSON.stringify(D, null, 2);
  var blob = new Blob([dataStr], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "habits-backup-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      if (imported.habits && imported.log) {
        if (confirm("Заменить все текущие данные?")) {
          D = imported;
          save();
          render();
          alert("✅ Данные импортированы");
        }
      } else {
        alert("❌ Неверный формат");
      }
    } catch(err) {
      alert("❌ Ошибка чтения");
    }
  };
  reader.readAsText(file);
}

function confirmReset() {
  if (confirm("⚠️ Удалить ВСЕ привычки и записи?\nЭто действие нельзя отменить!")) {
    D = {habits:[], log:{}};
    save();
    render();
  }
}

function askNotifPermission() {
  if (!("Notification" in window)) {
    alert("Браузер не поддерживает уведомления");
    return;
  }
  if (Notification.permission === "granted") {
    alert("✅ Уведомления уже включены");
    return;
  }
  if (Notification.permission === "denied") {
    alert("❌ Уведомления заблокированы. Включи их в настройках Safari.");
    return;
  }
  Notification.requestPermission().then(function(p) {
    if (p === "granted") alert("✅ Уведомления включены!");
    render();
  });
}

function openBSheet(id) {
  document.getElementById(id).classList.add("on");
}
function closeBSheet(id, e) {
  if (!e || e.target === document.getElementById(id)) {
    document.getElementById(id).classList.remove("on");
  }
}

function render(resetScroll) {
  renderHeader();
  var m = document.getElementById("content");
  var savedScroll = m.scrollTop;
  if (tab === "today") m.innerHTML = renderToday();
  else if (tab === "week") m.innerHTML = renderWeek();
  else if (tab === "stats") m.innerHTML = renderStats();
  else if (tab === "manage") m.innerHTML = renderManage();
  if (resetScroll) m.scrollTop = 0;
  else m.scrollTop = savedScroll;
}

function checkReminders() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  var now = new Date();
  var hh = String(now.getHours()).padStart(2,"0");
  var mm = String(now.getMinutes()).padStart(2,"0");
  var currentTime = hh + ":" + mm;
  var today = todayStr();
  var lastNotifKey = "hab_notif_" + today;
  var notifiedToday = [];
  try {
    notifiedToday = JSON.parse(localStorage.getItem(lastNotifKey) || "[]");
  } catch(e) {}
  for (var i=0; i<D.habits.length; i++) {
    var h = D.habits[i];
    if (h.remind === currentTime && isActiveDay(h, today) && !isChecked(h.id, today) && notifiedToday.indexOf(h.id) < 0) {
      try {
        new Notification("⏰ " + h.name, {body:"Время выполнить привычку!", tag:"habit-" + h.id});
        notifiedToday.push(h.id);
        localStorage.setItem(lastNotifKey, JSON.stringify(notifiedToday));
      } catch(e) {}
    }
  }
}

function init() {
  load();
  applyTheme();
  buildTGrid();
  buildIconGrid();
  buildColorGrid();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "hidden") save();
  else checkReminders();
});
setInterval(checkReminders, 60000);
setTimeout(checkReminders, 3000);
</script>
