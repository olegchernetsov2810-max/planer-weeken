<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c5cbf">
<title>Привычки</title>
<style>
:root {
  --a: #7c5cbf;
  --bg: #f2f2f7;
  --card: #fff;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --border: #e5e5ea;
  --inp: #f2f2f7;
  --st: env(safe-area-inset-top, 44px);
  --sb: env(safe-area-inset-bottom, 20px);
}
.dk {
  --bg: #000;
  --card: #1c1c1e;
  --text: #fff;
  --muted: #636366;
  --border: #2c2c2e;
  --inp: #2c2c2e;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  -webkit-font-smoothing: antialiased;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}
button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; font-size: 14px; }
input { font-family: inherit; font-size: 16px; }

#hdr {
position: sticky;
top: 0;
background: var(–card);
z-index: 10;
padding-top: var(–st);
box-shadow: 0 1px 0 var(–border);
}
.h1 {
display: flex;
align-items: center;
padding: 10px 16px;
gap: 8px;
}
.logo {
font-size: 20px;
font-weight: 800;
color: var(–a);
flex: 1;
}
.ico {
width: 38px;
height: 38px;
border-radius: 12px;
background: var(–inp);
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
}

#wnav {
display: flex;
align-items: center;
gap: 8px;
padding: 8px 16px;
background: var(–card);
box-shadow: 0 1px 0 var(–border);
}
.warr {
width: 40px;
height: 40px;
border-radius: 12px;
background: var(–inp);
color: var(–text);
font-size: 20px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
}
.wlbl {
flex: 1;
text-align: center;
font-size: 13px;
font-weight: 700;
background: var(–inp);
border-radius: 12px;
padding: 11px;
color: var(–text);
min-height: 40px;
}
.wnow {
width: 40px;
height: 40px;
border-radius: 12px;
background: var(–a);
color: #fff;
font-size: 18px;
flex-shrink: 0;
}

.stats-bar {
display: flex;
gap: 8px;
padding: 12px 16px;
background: var(–card);
}
.sb-item {
flex: 1;
text-align: center;
background: var(–inp);
border-radius: 12px;
padding: 10px 6px;
}
.sb-val {
font-size: 18px;
font-weight: 800;
color: var(–a);
}
.sb-lbl {
font-size: 10px;
color: var(–muted);
margin-top: 2px;
}

#content {
padding: 12px 0 calc(140px + var(–sb));
}

.card {
background: var(–card);
border-radius: 16px;
margin: 0 16px 12px;
overflow: hidden;
box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.ch {
padding: 12px 16px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid var(–border);
}
.ct {
font-size: 15px;
font-weight: 700;
}
.cb {
font-size: 12px;
color: var(–muted);
}

.hab-row {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
border-bottom: 1px solid var(–border);
}
.hab-row:last-child {
border-bottom: none;
}
.hab-icon {
width: 40px;
height: 40px;
border-radius: 12px;
display: flex;
align-items: center;
justify-content: center;
font-size: 22px;
flex-shrink: 0;
}
.hab-info {
flex: 1;
min-width: 0;
}
.hab-name {
font-size: 15px;
font-weight: 700;
}
.hab-meta {
font-size: 12px;
color: var(–muted);
margin-top: 2px;
}
.hab-streak {
color: #ff9500;
font-weight: 700;
}
.hab-check {
width: 32px;
height: 32px;
border-radius: 50%;
border: 2px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
color: #fff;
}
.hab-check.done {
background: var(–a);
border-color: var(–a);
}

.week-grid {
display: grid;
grid-template-columns: 1fr;
gap: 0;
}
.week-row {
padding: 12px 16px;
border-bottom: 1px solid var(–border);
}
.week-row:last-child {
border-bottom: none;
}
.week-row-top {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 8px;
}
.week-days {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 4px;
}
.day-cell {
text-align: center;
}
.day-name {
font-size: 9px;
color: var(–muted);
font-weight: 700;
margin-bottom: 4px;
}
.day-btn {
width: 100%;
aspect-ratio: 1;
max-width: 38px;
margin: 0 auto;
border-radius: 50%;
border: 2px solid var(–border);
background: transparent;
color: var(–muted);
font-size: 12px;
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
}
.day-btn.done {
background: var(–a);
border-color: var(–a);
color: #fff;
}
.day-btn.today {
border-color: var(–a);
}

.month-cal {
padding: 12px 16px;
}
.month-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 4px;
}
.month-cell {
aspect-ratio: 1;
border-radius: 8px;
border: 1px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
color: var(–muted);
}
.month-cell.done {
background: var(–a);
color: #fff;
border-color: var(–a);
}
.month-cell.today {
border: 2px solid var(–a);
}
.month-cell.empty {
border: none;
}

.empty {
text-align: center;
padding: 40px 20px;
color: var(–muted);
font-size: 14px;
}
.empty-i {
font-size: 48px;
margin-bottom: 10px;
}

#tabs {
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: var(–card);
display: flex;
padding-bottom: var(–sb);
z-index: 100;
box-shadow: 0 -1px 0 var(–border), 0 -4px 16px rgba(0,0,0,.04);
}
.tb {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 8px 0;
gap: 2px;
}
.tbi {
font-size: 22px;
}
.tbl {
font-size: 10px;
color: var(–muted);
}
.tb.on .tbl {
color: var(–a);
}

#fab {
position: fixed;
right: 16px;
bottom: calc(var(–sb) + 76px);
width: 50px;
height: 50px;
border-radius: 50%;
background: var(–a);
color: #fff;
font-size: 26px;
box-shadow: 0 4px 16px rgba(0,0,0,.25);
z-index: 99;
display: flex;
align-items: center;
justify-content: center;
}

.bsh {
position: fixed;
inset: 0;
background: rgba(0,0,0,.6);
z-index: 500;
display: none;
align-items: flex-end;
}
.bsh.on {
display: flex;
}
.bsh-box {
width: 100%;
background: var(–card);
border-radius: 20px 20px 0 0;
padding: 16px 16px calc(var(–sb) + 16px);
max-height: 90vh;
overflow-y: auto;
position: relative;
z-index: 501;
}
.bsh-handle {
width: 36px;
height: 4px;
background: var(–border);
border-radius: 2px;
margin: 0 auto 14px;
}
.bsh-title {
font-size: 17px;
font-weight: 700;
margin-bottom: 14px;
}
.bsh-lbl {
font-size: 11px;
font-weight: 700;
color: var(–muted);
margin-bottom: 6px;
text-transform: uppercase;
}
.bsh-inp {
width: 100%;
background: var(–inp);
border: none;
border-radius: 11px;
padding: 11px 13px;
font-size: 15px;
color: var(–text);
outline: none;
margin-bottom: 12px;
}
.bsh-btn {
width: 100%;
padding: 13px;
border-radius: 12px;
font-size: 15px;
font-weight: 700;
margin-bottom: 8px;
}
.bsh-btn.ok {
background: var(–a);
color: #fff;
}
.bsh-btn.cl {
background: var(–inp);
color: var(–muted);
}
.bsh-btn.rm {
background: #ff3b30;
color: #fff;
}

.icon-grid {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 5px;
margin-bottom: 12px;
}
.icon-pick {
aspect-ratio: 1;
border-radius: 8px;
border: 1.5px solid var(–border);
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
}
.icon-pick.on {
border-color: var(–a);
background: rgba(124,92,191,.12);
}

.color-grid {
display: grid;
grid-template-columns: repeat(8, 1fr);
gap: 6px;
margin-bottom: 12px;
}
.color-pick {
aspect-ratio: 1;
border-radius: 50%;
border: 3px solid transparent;
display: flex;
align-items: center;
justify-content: center;
color: transparent;
}
.color-pick.on {
border-color: var(–text);
color: #fff;
}

.freq-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 6px;
margin-bottom: 12px;
}
.freq-btn {
padding: 10px;
border-radius: 10px;
background: var(–inp);
font-size: 13px;
font-weight: 600;
color: var(–muted);
}
.freq-btn.on {
background: var(–a);
color: #fff;
}

.cal-pick {
margin-bottom: 14px;
}
.cal-pick-head {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 10px;
}
.cal-pick-arr {
width: 36px;
height: 36px;
border-radius: 10px;
background: var(–inp);
font-size: 18px;
}
.cal-pick-month {
flex: 1;
text-align: center;
font-size: 15px;
font-weight: 700;
}
.cal-pick-grid {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 3px;
}
.cal-pick-day {
text-align: center;
font-size: 10px;
color: var(–muted);
padding: 4px 0;
font-weight: 700;
}
.cal-pick-cell {
aspect-ratio: 1;
border-radius: 8px;
background: transparent;
font-size: 13px;
color: var(–text);
}
.cal-pick-cell.oth {
color: var(–muted);
opacity: 0.4;
}
.cal-pick-cell.tod {
color: var(–a);
font-weight: 800;
}
.cal-pick-cell.inw {
background: rgba(124,92,191,.15);
color: var(–a);
font-weight: 700;
}

.theme-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
margin-bottom: 16px;
}
.theme-dot {
aspect-ratio: 1;
border-radius: 50%;
border: 3px solid transparent;
display: flex;
align-items: center;
justify-content: center;
color: transparent;
font-size: 18px;
}
.theme-dot.on {
border-color: var(–text);
color: #fff;
}
.dk-row {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px;
background: var(–inp);
border-radius: 12px;
}
.sw {
width: 51px;
height: 31px;
border-radius: 16px;
background: var(–border);
position: relative;
}
.sw.on {
background: #34c759;
}
.swk {
position: absolute;
top: 2px;
left: 2px;
width: 27px;
height: 27px;
border-radius: 50%;
background: #fff;
transition: 0.2s;
}
.sw.on .swk {
left: 22px;
}
</style>

</head>
<body>

<div id="hdr">
  <div class="h1">
    <div class="logo">✨ Привычки</div>
    <button class="ico" onclick="openTheme()">🎨</button>
  </div>
  <div class="stats-bar">
    <div class="sb-item">
      <div class="sb-val" id="stat-today">0%</div>
      <div class="sb-lbl">Сегодня</div>
    </div>
    <div class="sb-item">
      <div class="sb-val" id="stat-week">0%</div>
      <div class="sb-lbl">Неделя</div>
    </div>
    <div class="sb-item">
      <div class="sb-val" id="stat-streak">🔥0</div>
      <div class="sb-lbl">Серия</div>
    </div>
  </div>
</div>

<div id="wnav">
  <button class="warr" onclick="shW(-1)">‹</button>
  <button class="wlbl" id="wlbl" onclick="openCalPick()"></button>
  <button class="wnow" onclick="goNow()">📅</button>
  <button class="warr" onclick="shW(1)">›</button>
</div>

<div id="content"></div>

<button id="fab" onclick="openNewHabit()">+</button>

<div id="tabs">
  <button class="tb on" id="tab-today" onclick="setTab('today')"><span class="tbi">📋</span><span class="tbl">Сегодня</span></button>
  <button class="tb" id="tab-week" onclick="setTab('week')"><span class="tbi">📅</span><span class="tbl">Неделя</span></button>
  <button class="tb" id="tab-stats" onclick="setTab('stats')"><span class="tbi">📊</span><span class="tbl">Статистика</span></button>
  <button class="tb" id="tab-manage" onclick="setTab('manage')"><span class="tbi">⚙️</span><span class="tbl">Настройки</span></button>
</div>

<div class="bsh" id="habitSheet" onclick="closeBSh('habitSheet',event)">
  <div class="bsh-box">
    <div class="bsh-handle"></div>
    <div class="bsh-title" id="habit-title">Новая привычка</div>
    <div class="bsh-lbl">Название</div>
    <input class="bsh-inp" id="h-name" placeholder="Например: пить воду">
    <div class="bsh-lbl">Иконка</div>
    <div class="icon-grid" id="icon-grid"></div>
    <div class="bsh-lbl">Цвет</div>
    <div class="color-grid" id="color-grid"></div>
    <div class="bsh-lbl">Частота</div>
    <div class="freq-grid">
      <button class="freq-btn on" id="freq-daily" onclick="setFreq('daily')">Каждый день</button>
      <button class="freq-btn" id="freq-weekdays" onclick="setFreq('weekdays')">Пн-Пт</button>
      <button class="freq-btn" id="freq-weekend" onclick="setFreq('weekend')">Сб-Вс</button>
      <button class="freq-btn" id="freq-custom" onclick="setFreq('custom')">Свои дни</button>
    </div>
    <div id="custom-days-row" style="display:none;margin-bottom:12px"></div>
    <div class="bsh-lbl">Время напоминания</div>
    <input class="bsh-inp" id="h-remind" type="time">
    <button class="bsh-btn ok" onclick="saveHabit()">Сохранить</button>
    <button class="bsh-btn rm" id="h-del" onclick="deleteHabit()" style="display:none">Удалить</button>
    <button class="bsh-btn cl" onclick="closeBSh('habitSheet')">Отмена</button>
  </div>
</div>

<div class="bsh" id="calSheet" onclick="closeBSh('calSheet',event)">
  <div class="bsh-box">
    <div class="bsh-handle"></div>
    <div class="bsh-title">📅 Выбрать неделю</div>
    <div class="cal-pick-head">
      <button class="cal-pick-arr" onclick="calMo(-1)">‹</button>
      <div class="cal-pick-month" id="cal-month"></div>
      <button class="cal-pick-arr" onclick="calMo(1)">›</button>
    </div>
    <div class="cal-pick-grid" id="cal-grid"></div>
    <button class="bsh-btn cl" onclick="closeBSh('calSheet')" style="margin-top:14px">Закрыть</button>
  </div>
</div>

<div class="bsh" id="themeSheet" onclick="closeBSh('themeSheet',event)">
  <div class="bsh-box">
    <div class="bsh-handle"></div>
    <div class="bsh-title">🎨 Оформление</div>
    <div class="theme-grid" id="theme-grid"></div>
    <div class="dk-row" onclick="togDk()">
      <div style="font-size:15px;font-weight:600">🌙 Тёмная тема</div>
      <div class="sw" id="dk-sw"><div class="swk"></div></div>
    </div>
    <button class="bsh-btn cl" onclick="closeBSh('themeSheet')" style="margin-top:14px">Закрыть</button>
  </div>
</div>

<script>
var SK = "habits_v2";
var COLORS = ["#7c5cbf","#4a9e7f","#3a7fd5","#e07b39","#c4566a","#3a9fa8","#c9a227","#e03a3a"];
var ICONS = ["⭐","🏃","💧","📚","🧘","💪","🍎","😴","☀️","🎯","💊","🌱","✍️","🎨","🎵","🚴","🏋️","🧠","☕","🥗","🦷","🛌","💻","📱"];
var DAYS = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
var THEMES = [
  {n:"Фиолетовый",a:"#7c5cbf"},
  {n:"Зелёный",a:"#4a9e7f"},
  {n:"Синий",a:"#3a7fd5"},
  {n:"Оранжевый",a:"#e07b39"},
  {n:"Розовый",a:"#c4566a"},
  {n:"Бирюзовый",a:"#3a9fa8"},
  {n:"Жёлтый",a:"#c9a227"},
  {n:"Красный",a:"#e03a3a"}
];

var D = {habits: [], log: {}};
var tab = "today";
var cw = wkKey(new Date());
var ti = +(localStorage.getItem("hab_ti") || 0);
var dk = localStorage.getItem("hab_dk") === "1";
var editIdx = -1;
var editColor = 0;
var editIcon = 0;
var editFreq = "daily";
var editCustom = [0,1,2,3,4];
var calDate = new Date();

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function localStr(d) {
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}

function monday(d) {
  var x = new Date(d);
  var n = x.getDay();
  var df = n === 0 ? -6 : 1 - n;
  x.setDate(x.getDate() + df);
  x.setHours(0,0,0,0);
  return x;
}

function wkKey(d) {
  return localStr(monday(d));
}

function shiftWk(k, n) {
  var p = k.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n*7);
  return wkKey(d);
}

function todayStr() {
  return localStr(new Date());
}

function isFuture(s) {
  return s > todayStr();
}

function dayOfWeek(s) {
  var p = s.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.getDay() === 0 ? 6 : d.getDay() - 1;
}

function getWeekDates(k) {
  var p = k.split("-");
  var arr = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(+p[0], +p[1]-1, +p[2]+i);
    arr.push(localStr(d));
  }
  return arr;
}

function fwk(k) {
  var p = k.split("-");
  var s = new Date(+p[0], +p[1]-1, +p[2]);
  var e = new Date(s);
  e.setDate(e.getDate() + 6);
  var opts = {day: "2-digit", month: "short"};
  return s.toLocaleDateString("ru-RU", opts) + " – " + e.toLocaleDateString("ru-RU", opts);
}

function load() {
  try { D = JSON.parse(localStorage.getItem(SK) || '{"habits":[],"log":{}}'); }
  catch(e) { D = {habits:[], log:{}}; }
  if (!D.log) D.log = {};
  if (!D.habits) D.habits = [];
}

function save() {
  try { localStorage.setItem(SK, JSON.stringify(D)); } catch(e) {}
}

function isActive(h, ds) {
  var dow = dayOfWeek(ds);
  if (h.freq === "daily") return true;
  if (h.freq === "weekdays") return dow < 5;
  if (h.freq === "weekend") return dow >= 5;
  if (h.freq === "custom") return (h.customDays || []).indexOf(dow) >= 0;
  return true;
}

function isChecked(id, ds) {
  return !!(D.log[ds] && D.log[ds][id]);
}

function toggle(id, ds) {
  if (isFuture(ds)) return;
  if (!D.log[ds]) D.log[ds] = {};
  D.log[ds][id] = !D.log[ds][id];
  save();
  render();
}

function getStreak(h) {
  var s = 0;
  var d = new Date();
  for (var i = 0; i < 365; i++) {
    var ds = localStr(d);
    if (isFuture(ds)) { d.setDate(d.getDate()-1); continue; }
    if (!isActive(h, ds)) { d.setDate(d.getDate()-1); continue; }
    if (isChecked(h.id, ds)) s++;
    else if (i > 0) break;
    d.setDate(d.getDate()-1);
  }
  return s;
}

function getMonthPct(h, y, m) {
  var t = 0, dn = 0;
  var dim = new Date(y, m+1, 0).getDate();
  for (var d = 1; d <= dim; d++) {
    var ds = y + "-" + pad(m+1) + "-" + pad(d);
    if (isFuture(ds)) continue;
    if (!isActive(h, ds)) continue;
    t++;
    if (isChecked(h.id, ds)) dn++;
  }
  return t ? Math.round(dn/t*100) : 0;
}

function getWeekPct(h, k) {
  var dates = getWeekDates(k);
  var t = 0, dn = 0;
  for (var i = 0; i < 7; i++) {
    var ds = dates[i];
    if (isFuture(ds)) continue;
    if (!isActive(h, ds)) continue;
    t++;
    if (isChecked(h.id, ds)) dn++;
  }
  return t ? Math.round(dn/t*100) : 0;
}

function getTodayPct() {
  var t = todayStr();
  var act = [];
  for (var i = 0; i < D.habits.length; i++) {
    if (isActive(D.habits[i], t)) act.push(D.habits[i]);
  }
  if (!act.length) return 0;
  var dn = 0;
  for (var i = 0; i < act.length; i++) {
    if (isChecked(act[i].id, t)) dn++;
  }
  return Math.round(dn/act.length*100);
}

function getWeekOverallPct() {
  var dates = getWeekDates(cw);
  var t = 0, dn = 0;
  for (var i = 0; i < D.habits.length; i++) {
    for (var j = 0; j < 7; j++) {
      var ds = dates[j];
      if (isFuture(ds)) continue;
      if (!isActive(D.habits[i], ds)) continue;
      t++;
      if (isChecked(D.habits[i].id, ds)) dn++;
    }
  }
  return t ? Math.round(dn/t*100) : 0;
}

function getBestStreak() {
  if (!D.habits.length) return 0;
  var best = 0;
  for (var i = 0; i < D.habits.length; i++) {
    var s = getStreak(D.habits[i]);
    if (s > best) best = s;
  }
  return best;
}

function esc(s) {
  s = (s || "") + "";
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function applyTheme() {
  var t = THEMES[ti];
  document.documentElement.style.setProperty("--a", t.a);
  document.body.classList.toggle("dk", dk);
  var sw = document.getElementById("dk-sw");
  if (sw) sw.classList.toggle("on", dk);
  var meta = document.querySelector("meta[name=theme-color]");
  if (meta) meta.setAttribute("content", t.a);
}

function buildThemeGrid() {
  var html = "";
  for (var i = 0; i < THEMES.length; i++) {
    html += '<div class="theme-dot ' + (i === ti ? "on" : "") + '" style="background:' + THEMES[i].a + '" onclick="pickTheme(' + i + ')">✓</div>';
  }
  document.getElementById("theme-grid").innerHTML = html;
}

function pickTheme(i) {
  ti = i;
  localStorage.setItem("hab_ti", i);
  applyTheme();
  buildThemeGrid();
}

function togDk() {
  dk = !dk;
  localStorage.setItem("hab_dk", dk ? "1" : "0");
  applyTheme();
}

function openTheme() {
  buildThemeGrid();
  document.getElementById("themeSheet").classList.add("on");
}

function shW(n) {
  cw = shiftWk(cw, n);
  render();
}

function goNow() {
  cw = wkKey(new Date());
  render();
}

function setTab(name) {
  tab = name;
  document.getElementById("tab-today").classList.toggle("on", name === "today");
  document.getElementById("tab-week").classList.toggle("on", name === "week");
  document.getElementById("tab-stats").classList.toggle("on", name === "stats");
  document.getElementById("tab-manage").classList.toggle("on", name === "manage");
  render();
}

function renderStats() {
  document.getElementById("stat-today").textContent = getTodayPct() + "%";
  document.getElementById("stat-week").textContent = getWeekOverallPct() + "%";
  document.getElementById("stat-streak").textContent = "🔥" + getBestStreak();
  var lbl = "📅 " + fwk(cw);
  if (cw === wkKey(new Date())) lbl += " · сейчас";
  document.getElementById("wlbl").textContent = lbl;
}

function renderToday() {
  var t = todayStr();
  var act = [];
  for (var i = 0; i < D.habits.length; i++) {
    if (isActive(D.habits[i], t)) act.push(D.habits[i]);
  }
  if (!act.length) {
    return '<div class="empty"><div class="empty-i">✨</div>Нет привычек на сегодня.<br>Нажми + чтобы добавить!</div>';
  }
  var dn = 0;
  for (var i = 0; i < act.length; i++) if (isChecked(act[i].id, t)) dn++;
  var pct = Math.round(dn/act.length*100);
  var html = '<div class="card">';
  html += '<div class="ch"><span class="ct">Сегодня</span><span class="cb">' + dn + '/' + act.length + ' · ' + pct + '%</span></div>';
  for (var i = 0; i < act.length; i++) {
    var h = act[i];
    var checked = isChecked(h.id, t);
    var streak = getStreak(h);
    html += '<div class="hab-row" onclick="toggle(\'' + h.id + '\',\'' + t + '\')">';
    html += '<div class="hab-icon" style="background:' + h.color + '22">' + h.icon + '</div>';
    html += '<div class="hab-info">';
    html += '<div class="hab-name" style="' + (checked ? "text-decoration:line-through;opacity:.5" : "") + '">' + esc(h.name) + '</div>';
    html += '<div class="hab-meta">';
    if (streak > 0) html += '<span class="hab-streak">🔥 ' + streak + '</span> ';
    if (h.remind) html += '🕐 ' + h.remind;
    html += '</div></div>';
    html += '<div class="hab-check ' + (checked ? "done" : "") + '">' + (checked ? "✓" : "") + '</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderWeek() {
  if (!D.habits.length) {
    return '<div class="empty"><div class="empty-i">📅</div>Нет привычек.</div>';
  }
  var dates = getWeekDates(cw);
  var t = todayStr();
  var html = '<div class="card">';
  html += '<div class="ch"><span class="ct">Неделя</span><span class="cb">' + fwk(cw) + '</span></div>';
  for (var i = 0; i < D.habits.length; i++) {
    var h = D.habits[i];
    var wp = getWeekPct(h, cw);
    var streak = getStreak(h);
    html += '<div class="week-row">';
    html += '<div class="week-row-top">';
    html += '<div class="hab-icon" style="background:' + h.color + '22">' + h.icon + '</div>';
    html += '<div class="hab-info"><div class="hab-name">' + esc(h.name) + '</div>';
    html += '<div class="hab-meta">';
    if (streak > 0) html += '<span class="hab-streak">🔥' + streak + '</span> ';
    html += wp + '% за неделю</div></div></div>';
    html += '<div class="week-days">';
    for (var j = 0; j < 7; j++) {
      var ds = dates[j];
      var act = isActive(h, ds);
      var fut = isFuture(ds);
      var ch = isChecked(h.id, ds);
      var isT = ds === t;
      var oc = (!fut && act) ? 'toggle(\'' + h.id + '\',\'' + ds + '\')' : '';
      html += '<div class="day-cell"><div class="day-name">' + DAYS[j] + '</div>';
      html += '<button class="day-btn ' + (ch ? "done" : "") + ' ' + (isT && !ch ? "today" : "") + '" onclick="' + oc + '" style="' + (fut ? "opacity:.3" : "") + '">' + (ch ? "✓" : (act ? "·" : "—")) + '</button>';
      html += '</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

function renderStatsTab() {
  if (!D.habits.length) {
    return '<div class="empty"><div class="empty-i">📊</div>Нет привычек.</div>';
  }
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var html = '<div class="card">';
  html += '<div class="ch"><span class="ct">Прогресс за месяц</span></div>';
  for (var i = 0; i < D.habits.length; i++) {
    var h = D.habits[i];
    var mp = getMonthPct(h, y, m);
    var st = getStreak(h);
    html += '<div class="hab-row">';
    html += '<div class="hab-icon" style="background:' + h.color + '22">' + h.icon + '</div>';
    html += '<div class="hab-info">';
    html += '<div class="hab-name">' + esc(h.name);
    if (st > 0) html += ' <span class="hab-streak">🔥' + st + '</span>';
    html += '</div>';
    html += '<div style="height:5px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden">';
    html += '<div style="height:100%;background:' + h.color + ';width:' + mp + '%"></div>';
    html += '</div></div>';
    html += '<div style="font-size:14px;font-weight:700;color:' + h.color + '">' + mp + '%</div>';
    html += '</div>';
  }
  html += '</div>';

  // Календарь лучшей привычки
  var best = D.habits[0];
  var bestPct = getMonthPct(best, y, m);
  for (var i = 1; i < D.habits.length; i++) {
    var p = getMonthPct(D.habits[i], y, m);
    if (p > bestPct) { best = D.habits[i]; bestPct = p; }
  }
  var dim = new Date(y, m+1, 0).getDate();
  var firstDow = new Date(y, m, 1).getDay() === 0 ? 6 : new Date(y, m, 1).getDay() - 1;
  html += '<div class="card">';
  html += '<div class="ch"><span class="ct">' + best.icon + ' ' + esc(best.name) + '</span><span class="cb">Календарь месяца</span></div>';
  html += '<div class="month-cal">';
  html += '<div class="month-grid">';
  for (var i = 0; i < 7; i++) {
    html += '<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding:2px 0">' + DAYS[i] + '</div>';
  }
  for (var i = 0; i < firstDow; i++) html += '<div class="month-cell empty"></div>';
  for (var d = 1; d <= dim; d++) {
    var ds = y + "-" + pad(m+1) + "-" + pad(d);
    var isT = ds === todayStr();
    var act = isActive(best, ds) && !isFuture(ds);
    var ch = isChecked(best.id, ds);
    html += '<div class="month-cell ' + (ch && act ? "done" : "") + ' ' + (isT ? "today" : "") + '" style="' + (ch && act ? "background:" + best.color : "") + '">' + d + '</div>';
  }
  html += '</div></div></div>';
  return html;
}

function renderManage() {
  var html = '';
  if (!D.habits.length) {
    html = '<div class="empty"><div class="empty-i">⚙️</div>Нет привычек.<br>Нажми + чтобы добавить!</div>';
  } else {
    html = '<div class="card">';
    html += '<div class="ch"><span class="ct">Все привычки</span><span class="cb">' + D.habits.length + '</span></div>';
    for (var i = 0; i < D.habits.length; i++) {
      var h = D.habits[i];
      var ft = h.freq === "daily" ? "Каждый день" : h.freq === "weekdays" ? "Пн-Пт" : h.freq === "weekend" ? "Сб-Вс" : "Свои дни";
      html += '<div class="hab-row" onclick="openEditHabit(' + i + ')">';
      html += '<div class="hab-icon" style="background:' + h.color + '22">' + h.icon + '</div>';
      html += '<div class="hab-info">';
      html += '<div class="hab-name">' + esc(h.name) + '</div>';
      html += '<div class="hab-meta">' + ft;
      if (h.remind) html += ' · 🕐' + h.remind;
      html += '</div></div>';
      html += '<div style="color:var(--muted);font-size:18px">›</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div class="card">';
  html += '<div class="ch"><span class="ct">Настройки</span></div>';
  html += '<div class="hab-row" onclick="openTheme()"><div class="hab-icon" style="background:rgba(124,92,191,.12)">🎨</div><div class="hab-info"><div class="hab-name">Тема и оформление</div><div class="hab-meta">' + THEMES[ti].n + (dk ? " · Тёмная" : " · Светлая") + '</div></div><div style="color:var(--muted);font-size:18px">›</div></div>';
  html += '<div class="hab-row" onclick="exportData()"><div class="hab-icon" style="background:rgba(74,158,127,.12)">📥</div><div class="hab-info"><div class="hab-name">Экспорт данных</div><div class="hab-meta">Сохранить копию</div></div><div style="color:var(--muted);font-size:18px">›</div></div>';
  html += '<div class="hab-row" onclick="document.getElementById(\'imp-inp\').click()"><div class="hab-icon" style="background:rgba(58,127,213,.12)">📤</div><div class="hab-info"><div class="hab-name">Импорт данных</div><div class="hab-meta">Восстановить из файла</div></div><div style="color:var(--muted);font-size:18px">›</div></div>';
  html += '<input type="file" id="imp-inp" accept=".json" style="display:none" onchange="importData(event)">';
  html += '</div>';
  return html;
}

function render() {
  renderStats();
  var c = document.getElementById("content");
  if (tab === "today") c.innerHTML = renderToday();
  else if (tab === "week") c.innerHTML = renderWeek();
  else if (tab === "stats") c.innerHTML = renderStatsTab();
  else if (tab === "manage") c.innerHTML = renderManage();
}

function buildIconGrid() {
  var html = "";
  for (var i = 0; i < ICONS.length; i++) {
    html += '<div class="icon-pick ' + (i === editIcon ? "on" : "") + '" onclick="pickIcon(' + i + ')">' + ICONS[i] + '</div>';
  }
  document.getElementById("icon-grid").innerHTML = html;
}
function pickIcon(i) { editIcon = i; buildIconGrid(); }

function buildColorGrid() {
  var html = "";
  for (var i = 0; i < COLORS.length; i++) {
    html += '<div class="color-pick ' + (i === editColor ? "on" : "") + '" style="background:' + COLORS[i] + '" onclick="pickColor(' + i + ')">✓</div>';
  }
  document.getElementById("color-grid").innerHTML = html;
}
function pickColor(i) { editColor = i; buildColorGrid(); }

function setFreq(f) {
  editFreq = f;
  var keys = ["daily","weekdays","weekend","custom"];
  for (var i = 0; i < keys.length; i++) {
    var el = document.getElementById("freq-" + keys[i]);
    if (el) el.classList.toggle("on", keys[i] === f);
  }
  var row = document.getElementById("custom-days-row");
  if (f === "custom") {
    row.style.display = "block";
    renderCustomDays();
  } else {
    row.style.display = "none";
  }
}
function renderCustomDays() {
  var html = '<div style="display:flex;gap:5px">';
  for (var i = 0; i < 7; i++) {
    var on = editCustom.indexOf(i) >= 0;
    html += '<button class="freq-btn ' + (on ? "on" : "") + '" style="flex:1" onclick="togCustom(' + i + ')">' + DAYS[i] + '</button>';
  }
  html += '</div>';
  document.getElementById("custom-days-row").innerHTML = html;
}
function togCustom(i) {
  var idx = editCustom.indexOf(i);
  if (idx >= 0) editCustom.splice(idx, 1);
  else editCustom.push(i);
  renderCustomDays();
}

function openNewHabit() {
  editIdx = -1;
  editColor = Math.floor(Math.random() * COLORS.length);
  editIcon = 0;
  editFreq = "daily";
  editCustom = [0,1,2,3,4];
  document.getElementById("habit-title").textContent = "Новая привычка";
  document.getElementById("h-name").value = "";
  document.getElementById("h-remind").value = "";
  document.getElementById("h-del").style.display = "none";
  buildIconGrid();
  buildColorGrid();
  setFreq("daily");
  document.getElementById("habitSheet").classList.add("on");
}

function openEditHabit(i) {
  editIdx = i;
  var h = D.habits[i];
  editColor = COLORS.indexOf(h.color);
  if (editColor < 0) editColor = 0;
  editIcon = ICONS.indexOf(h.icon);
  if (editIcon < 0) editIcon = 0;
  editFreq = h.freq || "daily";
  editCustom = (h.customDays || [0,1,2,3,4]).slice();
  document.getElementById("habit-title").textContent = "Изменить привычку";
  document.getElementById("h-name").value = h.name;
  document.getElementById("h-remind").value = h.remind || "";
  document.getElementById("h-del").style.display = "block";
  buildIconGrid();
  buildColorGrid();
  setFreq(editFreq);
  document.getElementById("habitSheet").classList.add("on");
}

function saveHabit() {
  var name = document.getElementById("h-name").value.trim();
  if (!name) return;
  var rem = document.getElementById("h-remind").value;
  var habit = {
    id: editIdx >= 0 ? D.habits[editIdx].id : "h" + Date.now(),
    name: name,
    icon: ICONS[editIcon],
    color: COLORS[editColor],
    freq: editFreq,
    customDays: editCustom.slice(),
    remind: rem || ""
  };
  if (editIdx >= 0) D.habits[editIdx] = habit;
  else D.habits.push(habit);
  save();
  if (rem && "Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  closeBSh("habitSheet");
  render();
}

function deleteHabit() {
  if (!confirm("Удалить привычку?")) return;
  D.habits.splice(editIdx, 1);
  save();
  closeBSh("habitSheet");
  render();
}

function openCalPick() {
  var p = cw.split("-");
  calDate = new Date(+p[0], +p[1]-1, +p[2]);
  renderCalPick();
  document.getElementById("calSheet").classList.add("on");
}

function calMo(n) {
  calDate.setMonth(calDate.getMonth() + n);
  renderCalPick();
}

function renderCalPick() {
  var y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById("cal-month").textContent = calDate.toLocaleDateString("ru-RU", {month:"long", year:"numeric"});
  var first = new Date(y, m, 1);
  var startDay = first.getDay() === 0 ? 6 : first.getDay() - 1;
  var dim = new Date(y, m+1, 0).getDate();
  var today = new Date();
  today.setHours(0,0,0,0);
  var prev = new Date(y, m, 0).getDate();
  var html = "";
  for (var i = 0; i < 7; i++) html += '<div class="cal-pick-day">' + DAYS[i] + '</div>';
  for (var i = startDay - 1; i >= 0; i--) {
    html += '<button class="cal-pick-cell oth" onclick="pickDay(' + y + ',' + (m === 0 ? 11 : m-1) + ',' + (prev-i) + ')">' + (prev-i) + '</button>';
  }
  for (var d = 1; d <= dim; d++) {
    var date = new Date(y, m, d);
    var isT = date.getTime() === today.getTime();
    var inw = wkKey(date) === cw;
    var cls = "cal-pick-cell";
    if (inw) cls += " inw";
    if (isT && !inw) cls += " tod";
    html += '<button class="' + cls + '" onclick="pickDay(' + y + ',' + m + ',' + d + ')">' + d + '</button>';
  }
  document.getElementById("cal-grid").innerHTML = html;
}

function pickDay(y, m, d) {
  cw = wkKey(new Date(y, m, d));
  closeBSh("calSheet");
  render();
}

function exportData() {
  var str = JSON.stringify(D, null, 2);
  var blob = new Blob([str], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "habits-" + todayStr() + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(ev) {
  var f = ev.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(e) {
    try {
      var imp = JSON.parse(e.target.result);
      if (imp.habits && imp.log) {
        if (confirm("Заменить все данные?")) {
          D = imp;
          save();
          render();
          alert("✅ Импортировано");
        }
      } else alert("❌ Неверный формат");
    } catch(err) { alert("❌ Ошибка чтения"); }
  };
  r.readAsText(f);
}

function closeBSh(id, e) {
  if (!e || e.target === document.getElementById(id)) {
    document.getElementById(id).classList.remove("on");
  }
}

function checkReminders() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  var now = new Date();
  var ct = pad(now.getHours()) + ":" + pad(now.getMinutes());
  var t = todayStr();
  var key = "hab_notif_" + t;
  var notified = [];
  try { notified = JSON.parse(localStorage.getItem(key) || "[]"); } catch(e) {}
  for (var i = 0; i < D.habits.length; i++) {
    var h = D.habits[i];
    if (h.remind === ct && isActive(h, t) && !isChecked(h.id, t) && notified.indexOf(h.id) < 0) {
      try {
        new Notification("⏰ " + h.name, {body: "Время выполнить!", tag: "h-" + h.id});
        notified.push(h.id);
        localStorage.setItem(key, JSON.stringify(notified));
      } catch(e) {}
    }
  }
}

function init() {
  load();
  applyTheme();
  render();
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

window.addEventListener("beforeunload", save);
setInterval(checkReminders, 60000);
setTimeout(checkReminders, 3000);
</script>
