<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Планер"/>
<meta name="theme-color" content="#4a9e7f"/>
<title>Планер</title>
<style>
:root{
  --a:#4a9e7f; --a2:rgba(74,158,127,0.15);
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93;
  --border:#e5e5ea; --inp:#f2f2f7;
  --p1:#ff3b30; --p2:#ff9500; --p3:#4a9e7f; --p4:#8e8e93;
  --st:env(safe-area-inset-top,44px); --sb:env(safe-area-inset-bottom,20px);
}
.dk{
  --bg:#000; --card:#1c1c1e; --text:#fff; --muted:#636366;
  --border:#2c2c2e; --inp:#2c2c2e; --a2:rgba(74,158,127,0.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;-webkit-font-smoothing:antialiased;}
input,textarea,select,button{font-family:inherit;font-size:16px;}

/* ── ШАПКА ── */
#sb{height:var(--st);background:var(--card);}
#hdr{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px 10px;}
.h1{display:flex;align-items:center;gap:8px;padding-top:10px;}
.logo{font-size:20px;font-weight:800;color:var(--a);flex:1;letter-spacing:-0.5px;}
.ico{width:36px;height:36px;border-radius:11px;border:none;background:var(--inp);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wbar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.wstat{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
.wtrack{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.wfill{height:100%;border-radius:3px;background:var(--a);transition:width .4s;}

/* ── НАВИГАЦИЯ ПО НЕДЕЛЯМ ── */
#wnav{background:var(--card);border-bottom:1px solid var(--border);padding:8px 16px;
  display:flex;align-items:center;gap:8px;}
.warr{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:16px;cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.wlabel{font-size:13px;font-weight:700;flex:1;text-align:center;}
.wfuture{font-size:11px;font-weight:600;color:var(--a);background:var(--a2);
  padding:3px 8px;border-radius:8px;white-space:nowrap;}

/* ── ДНИ ── */
#daynav{background:var(--card);border-bottom:1px solid var(--border);
  display:flex;padding:8px 12px;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
#daynav::-webkit-scrollbar{display:none;}
.dpill{flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:6px 10px;border-radius:13px;border:none;background:var(--inp);
  cursor:pointer;min-width:44px;position:relative;}
.dpill.on{background:var(--a);}
.dpill.today:not(.on){border:2px solid var(--a);}
.ds{font-size:10px;font-weight:600;color:var(--muted);}
.dpill.on .ds{color:rgba(255,255,255,.8);}
.dn2{font-size:14px;font-weight:700;color:var(--text);}
.dpill.on .dn2{color:#fff;}
.dpill.today:not(.on) .dn2{color:var(--a);}
.ddot{width:5px;height:5px;border-radius:50%;background:var(--a);margin-top:3px;opacity:0;}
.dpill.has .ddot{opacity:1;}
.dpill.on .ddot{background:rgba(255,255,255,.7);}
.dpct{position:absolute;top:-6px;right:-4px;background:var(--a);color:#fff;
  font-size:9px;font-weight:700;border-radius:6px;padding:1px 4px;display:none;}
.dpill.has .dpct{display:block;}
.dpill.on .dpct{background:rgba(255,255,255,.3);color:#fff;}

/* ── ВКЛАДКИ ── */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--sb);}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:8px 0;border:none;background:transparent;cursor:pointer;gap:2px;}
.tbi{font-size:22px;}
.tbl{font-size:10px;font-weight:500;color:var(--muted);}
.tb.on .tbl{color:var(--a);}

/* ── КОНТЕНТ ── */
#content{position:fixed;top:0;left:0;right:0;bottom:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--sb) + 62px);}
#content::-webkit-scrollbar{display:none;}

/* ── КАРТОЧКИ ── */
.card{background:var(--card);border-radius:16px;margin:0 16px 12px;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.ch{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);}
.ct{font-size:15px;font-weight:700;}
.cb{font-size:12px;color:var(--muted);font-weight:500;}

/* ── КОЛЬЦО ПРОГРЕССА ── */
.ring-area{display:flex;align-items:center;gap:20px;padding:20px 20px 16px;}
.rsvg{transform:rotate(-90deg);}
.rtxt{transform:rotate(90deg);transform-box:fill-box;transform-origin:center;}
.rinfo{display:flex;flex-direction:column;gap:10px;flex:1;}
.rrow{display:flex;align-items:center;gap:10px;}
.rval{font-size:24px;font-weight:800;color:var(--a);min-width:48px;}
.rlbl{font-size:13px;color:var(--muted);}

/* ── ЗАДАЧИ ── */
.trow{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--border);position:relative;}
.trow:last-child{border-bottom:none;}
.pbar{width:4px;height:100%;position:absolute;left:0;top:0;bottom:0;border-radius:0;}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.chk.on{background:var(--a);border-color:var(--a);}
.chk.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.tmain{flex:1;display:flex;flex-direction:column;gap:3px;}
.tinp{border:none;background:transparent;outline:none;width:100%;
  font-size:15px;color:var(--text);padding:0;}
.tinp::placeholder{color:var(--muted);}
.tinp.x{text-decoration:line-through;color:var(--muted);}
.tdline{font-size:11px;color:var(--muted);}
.tdline.overdue{color:#ff3b30;font-weight:600;}
.tactions{display:flex;align-items:center;gap:6px;}
.pdot{width:10px;height:10px;border-radius:50%;cursor:pointer;flex-shrink:0;}
.ddbtn{font-size:14px;cursor:pointer;opacity:.5;}
.ddBtn:hover{opacity:1;}

/* ── ПРИОРИТЕТ ЛЕГЕНДА ── */
.plegend{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--border);flex-wrap:wrap;}
.pl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
.plc{width:10px;height:10px;border-radius:50%;}

/* ── ДОБАВИТЬ ЗАДАЧУ ── */
.add-row{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-top:1px solid var(--border);}
.add-inp{flex:1;border:none;background:transparent;outline:none;
  font-size:15px;color:var(--text);}
.add-inp::placeholder{color:var(--muted);}
.add-btn{width:28px;height:28px;border-radius:50%;background:var(--a);border:none;
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;}

/* ── ДНЕВНИК ── */
.df{padding:14px 16px;border-bottom:1px solid var(--border);}
.df:last-child{border-bottom:none;}
.dl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px;}
.dta{border:none;background:var(--inp);border-radius:12px;outline:none;
  width:100%;font-size:15px;color:var(--text);padding:11px 13px;resize:none;line-height:1.5;}
.slrow{display:flex;gap:6px;flex-wrap:wrap;}
.slb{flex:1;min-width:38px;padding:9px 4px;border-radius:10px;border:none;
  background:var(--inp);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;}
.slb.on{background:var(--a);color:#fff;}
.erow{display:flex;gap:6px;}
.eb{flex:1;padding:11px 0;border-radius:12px;border:none;
  background:var(--inp);font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;}
.eb.on{background:var(--a);color:#fff;}
.mrow{display:flex;gap:6px;justify-content:space-between;}
.mb{flex:1;padding:9px 0;border-radius:12px;border:none;
  background:var(--inp);font-size:24px;cursor:pointer;text-align:center;}
.mb.on{background:var(--a);}

/* ── АНАЛИТИКА ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;}
.sc{background:var(--card);border-radius:16px;padding:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);}
.si{font-size:24px;margin-bottom:6px;}
.sv{font-size:22px;font-weight:800;color:var(--a);}
.sl2{font-size:11px;color:var(--muted);margin-top:2px;}
.wrrow{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:16px;gap:4px;}
.wrrow::-webkit-scrollbar{display:none;}
.wri{flex-shrink:0;text-align:center;padding:0 6px;}
.wrd{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.wrc{font-size:10px;color:var(--muted);margin-top:4px;}

/* ── ИСТОРИЯ ── */
.hc{background:var(--card);border-radius:16px;margin:0 16px 10px;
  overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;}
.hc.cur{border:2px solid var(--a);}
.hc.future{border:2px dashed var(--a);opacity:.85;}
.hh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;}
.hwl{font-size:14px;font-weight:700;}
.hsub{font-size:11px;color:var(--muted);margin-top:2px;}
.hpct{font-size:24px;font-weight:800;color:var(--a);}
.hrr{display:flex;padding:0 16px 14px;gap:4px;}
.hri{flex:1;text-align:center;}
.hril{font-size:9px;color:var(--muted);margin-bottom:2px;}

/* ── БУДУЩИЕ ПЛАНЫ ── */
.future-banner{background:var(--a2);border-radius:14px;margin:12px 16px 0;
  padding:12px 14px;display:flex;align-items:center;gap:10px;}
.fb-icon{font-size:24px;}
.fb-text{font-size:13px;color:var(--a);font-weight:600;line-height:1.4;}

/* ── ДЕДЛАЙН ПИКЕР ── */
#dlpicker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:flex-end;padding-bottom:var(--sb);}
#dlpicker.on{display:flex;}
.dlbox{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px;}
.dlbox h3{font-size:17px;font-weight:700;margin-bottom:14px;}
.dl-inp{width:100%;background:var(--inp);border:none;border-radius:12px;
  padding:12px 14px;font-size:16px;color:var(--text);outline:none;margin-bottom:12px;}
.dl-btns{display:flex;gap:10px;}
.dl-btn{flex:1;padding:13px;border-radius:13px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
.dl-btn.ok{background:var(--a);color:#fff;}
.dl-btn.cl{background:var(--inp);color:var(--muted);}
.dl-btn.rm{background:#ff3b30;color:#fff;}

/* ── ПРИОРИТЕТ ПИКЕР ── */
#ppicker{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
  display:none;align-items:flex-end;padding-bottom:var(--sb);}
#ppicker.on{display:flex;}
.ppbox{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:20px;}
.ppbox h3{font-size:17px;font-weight:700;margin-bottom:16px;}
.pp-opts{display:flex;flex-direction:column;gap:8px;}
.pp-opt{display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-radius:13px;border:none;background:var(--inp);cursor:pointer;width:100%;text-align:left;}
.pp-color{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.pp-name{font-size:15px;font-weight:600;}
.pp-desc{font-size:12px;color:var(--muted);margin-top:1px;}

/* ── ТЕМА ── */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;}
#ov.on{display:block;}
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:var(--card);
  border-radius:20px 20px 0 0;padding:0 20px calc(var(--sb)+20px);
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
#sheet.on{transform:translateY(0);}
.shdl{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 18px;}
.sht{font-size:17px;font-weight:700;margin-bottom:14px;}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.tdot{aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:transparent;font-weight:700;}
.tdot.on{border-color:var(--text);color:#fff;}
.dkrow{display:flex;align-items:center;justify-content:space-between;
  padding:14px;background:var(--inp);border-radius:14px;cursor:pointer;}
.dkl{font-size:15px;font-weight:600;}
.sw{width:51px;height:31px;border-radius:16px;background:var(--border);position:relative;transition:.2s;}
.sw.on{background:#34c759;}
.swk{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s;}
.sw.on .swk{left:22px;}

/* ── ПОДТВЕРЖДЕНИЕ ── */
#cm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;
  display:none;align-items:flex-end;padding-bottom:var(--sb);}
#cm.on{display:flex;}
.cmb{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:22px;}
.cmt{font-size:17px;font-weight:700;text-align:center;margin-bottom:6px;}
.cmx{font-size:14px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5;}
.cba{display:flex;flex-direction:column;gap:8px;}
.cbtn{width:100%;padding:15px;border-radius:14px;border:none;font-size:17px;font-weight:600;cursor:pointer;}
.cbtn.d{background:#ff3b30;color:#fff;}
.cbtn.c{background:var(--inp);color:var(--text);}

/* ── ПУСТОЕ СОСТОЯНИЕ ── */
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px;line-height:1.7;}
.ei{font-size:48px;margin-bottom:12px;}
</style>
</head>
<body>

<div id="sb"></div>
<div id="hdr">
  <div class="h1">
    <div class="logo">Планер</div>
    <button class="ico" onclick="openSheet()">🎨</button>
  </div>
  <div class="wbar">
    <span class="wstat" id="wst"></span>
    <div class="wtrack"><div class="wfill" id="wf" style="width:0"></div></div>
    <span class="wstat" id="wpct"></span>
  </div>
</div>
<div id="wnav">
  <button class="warr" onclick="shW(-1)">‹</button>
  <div class="wlabel" id="wlbl"></div>
  <div class="wfuture" id="wfut" style="display:none">Будущая неделя</div>
  <button class="warr" onclick="shW(1)">›</button>
  <button class="warr" onclick="goNow()" style="font-size:13px">📅</button>
</div>
<div id="daynav"></div>

<div id="content"></div>

<div id="tabs">
  <button class="tb on" onclick="setTab('tasks',this)"><span class="tbi">✅</span><span class="tbl">Задачи</span></button>
  <button class="tb" onclick="setTab('diary',this)"><span class="tbi">📖</span><span class="tbl">Дневник</span></button>
  <button class="tb" onclick="setTab('stats',this)"><span class="tbi">📊</span><span class="tbl">Итоги</span></button>
  <button class="tb" onclick="setTab('all',this)"><span class="tbi">🗂</span><span class="tbl">История</span></button>
</div>

<!-- Дедлайн -->
<div id="dlpicker">
  <div class="dlbox">
    <h3>⏰ Срок выполнения</h3>
    <input type="date" class="dl-inp" id="dl-date"/>
    <div class="dl-btns">
      <button class="dl-btn rm" onclick="clearDL()">Убрать</button>
      <button class="dl-btn cl" onclick="closeDL()">Отмена</button>
      <button class="dl-btn ok" onclick="saveDL()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Приоритет -->
<div id="ppicker">
  <div class="ppbox">
    <h3>🎯 Приоритет задачи</h3>
    <div class="pp-opts">
      <button class="pp-opt" onclick="setPrio(0,'#ff3b30')">
        <div class="pp-color" style="background:#ff3b30"></div>
        <div><div class="pp-name">Высокий</div><div class="pp-desc">Срочно и важно — сделать сегодня</div></div>
      </button>
      <button class="pp-opt" onclick="setPrio(1,'#ff9500')">
        <div class="pp-color" style="background:#ff9500"></div>
        <div><div class="pp-name">Средний</div><div class="pp-desc">Важно, но не срочно</div></div>
      </button>
      <button class="pp-opt" onclick="setPrio(2,'#4a9e7f')">
        <div class="pp-color" style="background:#4a9e7f"></div>
        <div><div class="pp-name">Обычный</div><div class="pp-desc">Плановые задачи</div></div>
      </button>
      <button class="pp-opt" onclick="setPrio(3,'#8e8e93')">
        <div class="pp-color" style="background:#8e8e93"></div>
        <div><div class="pp-name">Низкий</div><div class="pp-desc">Когда будет время</div></div>
      </button>
    </div>
  </div>
</div>

<!-- Тема -->
<div id="ov" onclick="closeSheet()"></div>
<div id="sheet">
  <div class="shdl"></div>
  <div class="sht">Оформление</div>
  <div class="tgrid" id="tgrid"></div>
  <div class="dkrow" onclick="togDk()">
    <div class="dkl">🌙 Тёмный режим</div>
    <div class="sw" id="dsw"><div class="swk"></div></div>
  </div>
</div>

<!-- Сброс -->
<div id="cm">
  <div class="cmb">
    <div class="cmt">Сбросить неделю?</div>
    <div class="cmx">Все задачи и записи за эту неделю будут удалены без возможности восстановления.</div>
    <div class="cba">
      <button class="cbtn d" onclick="doReset()">Удалить</button>
      <button class="cbtn c" onclick="closeCm()">Отмена</button>
    </div>
  </div>
</div>

<script>
// ── ДАННЫЕ ──
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const SH=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MOODS=["😴","😐","🙂","😊","🤩"];
const PRIOS=[
  {name:"Высокий",color:"#ff3b30"},
  {name:"Средний",color:"#ff9500"},
  {name:"Обычный",color:"#4a9e7f"},
  {name:"Низкий",color:"#8e8e93"},
];
const THEMES=[
  {n:"Зелёный",a:"#4a9e7f"},{n:"Синий",a:"#3a7fd5"},
  {n:"Оранжевый",a:"#e07b39"},{n:"Фиолетовый",a:"#7c5cbf"},
  {n:"Розовый",a:"#c4566a"},{n:"Бирюзовый",a:"#3a9fa8"},
  {n:"Жёлтый",a:"#c9a227"},{n:"Красный",a:"#e03a3a"},
  {n:"Мятный",a:"#3ab87a"},{n:"Небесный",a:"#0a84ff"},
  {n:"Персиковый",a:"#e06c5a"},{n:"Сиреневый",a:"#9b6be0"},
  {n:"Изумрудный",a:"#2ecc71"},{n:"Янтарный",a:"#e0a020"},
  {n:"Индиго",a:"#4f6dcc"},{n:"Графитовый",a:"#5a6473"},
];
const SK="plnr_v5";

let cw=wkKey(new Date()), dayIdx=todayIdx(), tab="tasks";
let ti=+(localStorage.getItem("ti")||0), dk=localStorage.getItem("dk")==="1";
let D={};
let editDI=-1, editTI=-1; // для пикеров

// ── ХРАНИЛИЩЕ ──
function load(){try{D=JSON.parse(localStorage.getItem(SK)||"{}");}catch(e){D={};}}
function save(){try{localStorage.setItem(SK,JSON.stringify(D));}catch(e){}}
function gw(k){
  if(!D[k])D[k]={days:DAYS.map(()=>({
    tasks:[],
    notes:"",sleep:"7",energy:"3",mood:"🙂",lesson:"",gratitude:"",thoughts:""
  }))};
  // Совместимость: tasks — массив объектов
  D[k].days.forEach(d=>{
    if(!Array.isArray(d.tasks))d.tasks=[];
  });
  return D[k];
}

// ── ЗАДАЧА (объект) ──
function newTask(text=""){return{t:text,d:false,prio:2,deadline:""};}

// ── ДАТЫ ──
function monday(date){
  const d=new Date(date),day=d.getDay(),df=day===0?-6:1-day;
  d.setDate(d.getDate()+df);d.setHours(0,0,0,0);return d;
}
function wkKey(date){return monday(date).toISOString().slice(0,10);}
function shiftKey(k,n){const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n*7);return wkKey(d);}
function fd(k,off){
  const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+off);
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
function fdFull(k,off){
  const d=new Date(k+"T00:00:00");d.setDate(d.getDate()+off);
  return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long"});
}
function fwk(k){return fd(k,0)+" – "+fd(k,6);}
function todayIdx(){const d=new Date(),n=d.getDay();return n===0?6:n-1;}
function isFuture(k){return k>wkKey(new Date());}
function isCurrentWeek(k){return k===wkKey(new Date());}
function fmtDeadline(str){
  if(!str)return"";
  const d=new Date(str+"T00:00:00");
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/(1000*60*60*24));
  const label=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"short"});
  if(diff<0)return{text:`Просрочено ${label}`,overdue:true};
  if(diff===0)return{text:"Срок сегодня",overdue:true};
  if(diff===1)return{text:"Срок завтра",overdue:false};
  return{text:`До ${label}`,overdue:false};
}

// ── ПРОГРЕСС ──
function dayPct(k,di){
  const w=D[k];if(!w)return 0;
  const t=w.days[di].tasks,f=t.filter(x=>x.t.trim());
  return f.length?Math.round(f.filter(x=>x.d).length/f.length*100):0;
}
function wkStats(k){
  const w=gw(k);
  const tot=w.days.reduce((s,d)=>s+d.tasks.filter(t=>t.t.trim()).length,0);
  const dn=w.days.reduce((s,d)=>s+d.tasks.filter(t=>t.t.trim()&&t.d).length,0);
  const avg=tot?Math.round(dn/tot*100):0;
  const best=w.days.reduce((b,_,i)=>dayPct(k,i)>dayPct(k,b)?i:b,0);
  return{tot,dn,avg,best};
}

// ── ТЕМА ──
function applyTheme(){
  const t=THEMES[ti];
  document.documentElement.style.setProperty("--a",t.a);
  // Calc transparent version
  const b=parseInt(t.a.slice(1),16);
  const r=(b>>16)&255,g=(b>>8)&255,bl=b&255;
  document.documentElement.style.setProperty("--a2",`rgba(${r},${g},${bl},${dk?.2:.12})`);
  document.body.classList.toggle("dk",dk);
  const sw=document.getElementById("dsw");if(sw)sw.classList.toggle("on",dk);
  const mc=document.querySelector("meta[name=theme-color]");if(mc)mc.content=t.a;
}
function buildTGrid(){
  document.getElementById("tgrid").innerHTML=THEMES.map((t,i)=>
    `<div class="tdot ${i===ti?"on":""}" style="background:${t.a}" onclick="pickT(${i})" title="${t.n}">✓</div>`
  ).join("");
}
function pickT(i){ti=i;localStorage.setItem("ti",i);applyTheme();buildTGrid();render();}
function togDk(){dk=!dk;localStorage.setItem("dk",dk?"1":"0");applyTheme();render();}
function openSheet(){document.getElementById("sheet").classList.add("on");document.getElementById("ov").classList.add("on");}
function closeSheet(){document.getElementById("sheet").classList.remove("on");document.getElementById("ov").classList.remove("on");}

// ── НАВИГАЦИЯ ──
function shW(n){cw=shiftKey(cw,n);render();}
function goNow(){cw=wkKey(new Date());dayIdx=todayIdx();render();}
function setTab(name,btn){tab=name;document.querySelectorAll(".tb").forEach(b=>b.classList.remove("on"));btn.classList.add("on");render();}
function setDay(i){dayIdx=i;render();}

// ── SVG КОЛЬЦО ──
function ring(pct,col,sz=100){
  const r=(sz-12)/2,c=2*Math.PI*r,d=(pct/100)*c;
  const fs=sz>80?18:sz>55?14:10,trk=dk?"#2c2c2e":"#e5e5ea";
  return`<svg width="${sz}" height="${sz}" class="rsvg">
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${trk}" stroke-width="10"/>
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="10"
      stroke-dasharray="${d} ${c-d}" stroke-linecap="round" style="transition:stroke-dasharray .4s"/>
    <text x="${sz/2}" y="${sz/2+fs*.4}" text-anchor="middle" font-size="${fs}"
      font-weight="800" fill="${col}" class="rtxt">${pct}%</text>
  </svg>`;
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── ШАПКА ──
function renderHeader(){
  const nh=document.getElementById("hdr").offsetHeight+
           document.getElementById("sb").offsetHeight+
           document.getElementById("wnav").offsetHeight+
           document.getElementById("daynav").offsetHeight;
  document.getElementById("content").style.paddingTop=nh+"px";

  const{tot,dn,avg}=wkStats(cw);
  document.getElementById("wst").textContent=`${dn} / ${tot}`;
  document.getElementById("wpct").textContent=`${avg}%`;
  document.getElementById("wf").style.width=avg+"%";
  document.getElementById("wlbl").textContent=fwk(cw);

  const fut=document.getElementById("wfut");
  fut.style.display=isFuture(cw)?"block":"none";

  // Таблетки дней
  const w=gw(cw);
  const todayW=wkKey(new Date()),todayD=todayIdx();
  document.getElementById("daynav").innerHTML=DAYS.map((name,i)=>{
    const tasks=w.days[i].tasks.filter(t=>t.t.trim());
    const pct=tasks.length?Math.round(tasks.filter(t=>t.d).length/tasks.length*100):0;
    const hasTasks=tasks.length>0;
    const isOn=(tab==="tasks"||tab==="diary")&&i===dayIdx;
    const isToday=isCurrentWeek(cw)&&i===todayD;
    return`<button class="dpill ${isOn?"on":""} ${hasTasks?"has":""} ${isToday&&!isOn?"today":""}"
      onclick="setDay(${i})">
      <span class="ds">${SH[i]}</span>
      <span class="dn2">${fd(cw,i).slice(0,2)}</span>
      <span class="ddot"></span>
      ${hasTasks?`<span class="dpct">${pct}%</span>`:""}
    </button>`;
  }).join("");
}

// ── ЗАДАЧИ ──
function renderTasks(){
  const col=THEMES[ti].a;
  const w=gw(cw);
  const d=w.days[dayIdx];
  const pct=dayPct(cw,dayIdx);
  const filled=d.tasks.filter(t=>t.t.trim()).length;
  const done=d.tasks.filter(t=>t.t.trim()&&t.d).length;

  const futureBanner=isFuture(cw)?`<div class="future-banner">
    <div class="fb-icon">🚀</div>
    <div class="fb-text">Будущая неделя — планируй заранее!<br>Задачи сохранятся и появятся в нужный момент.</div>
  </div>`:"";

  const taskRows=d.tasks.map((task,ti2)=>{
    if(!task.t.trim()&&!task===undefined)return"";
    const pc=PRIOS[task.prio]||PRIOS[2];
    const dl=task.deadline?fmtDeadline(task.deadline):null;
    return`<div class="trow" id="tr-${dayIdx}-${ti2}">
      <div class="pbar" style="background:${pc.color}"></div>
      <div class="chk ${task.d?"on":""}" onclick="togT(${dayIdx},${ti2})"></div>
      <div class="tmain">
        <input class="tinp ${task.d?"x":""}" value="${esc(task.t)}"
          oninput="setT(${dayIdx},${ti2},this.value)"
          placeholder="Задача..."/>
        ${dl?`<div class="tdline ${dl.overdue?"overdue":""}">⏰ ${dl.text}</div>`:""}
      </div>
      <div class="tactions">
        <div class="pdot" style="background:${pc.color}" onclick="openPrio(${dayIdx},${ti2})" title="${pc.name}"></div>
        <div class="ddBtn" onclick="openDL(${dayIdx},${ti2})">📅</div>
        <div class="ddBtn" onclick="delTask(${dayIdx},${ti2})" style="font-size:14px;cursor:pointer;opacity:.4">✕</div>
      </div>
    </div>`;
  }).join("");

  return`
    ${futureBanner}
    <div style="height:12px"></div>
    <div class="card">
      <div class="ring-area">
        ${ring(pct,col,100)}
        <div class="rinfo">
          <div class="rrow"><div class="rval">${done}</div><div class="rlbl">Выполнено</div></div>
          <div class="rrow"><div class="rval" style="color:var(--muted)">${filled-done}</div><div class="rlbl">Осталось</div></div>
          <div class="rrow"><div class="rval">${filled}</div><div class="rlbl">Всего</div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ch"><span class="ct">Задачи — ${DAYS[dayIdx]}</span><span class="cb">${fdFull(cw,dayIdx)}</span></div>
      ${taskRows||`<div style="padding:20px 16px;color:var(--muted);font-size:14px;text-align:center">Нет задач. Добавьте первую!</div>`}
      <div class="plegend">
        ${PRIOS.map(p=>`<div class="pl"><div class="plc" style="background:${p.color}"></div>${p.name}</div>`).join("")}
      </div>
      <div class="add-row">
        <input class="add-inp" id="add-inp" placeholder="Добавить задачу..." 
          onkeydown="if(event.key==='Enter')addTask()"/>
        <button class="add-btn" onclick="addTask()">+</button>
      </div>
    </div>
  `;
}

// ── ДНЕВНИК ──

  const futureBanner=isFuture(cw)?`<div class="future-banner">
    <div class="fb-icon">📖</div>
    <div class="fb-text">Будущая неделя — запиши намерения на эту неделю.</div>
  </div>`:"";
  return`
    ${futureBanner}
    <div style="height:12px"></div>
    <div class="card">
      <div class="df"><div class="dl">🌙 Сон (часов)</div>
        <div class="slrow">${["5","6","7","8","9","10"].map(v=>
          `<button class="slb ${d.sleep===v?"on":""}" onclick="setF(${dayIdx},'sleep','${v}')">${v}</button>`).join("")}
        </div>
      </div>
      <div class="df"><div class="dl">⚡ Уровень энергии</div>
        <div class="erow">${["1","2","3","4","5"].map(v=>
          `<button class="eb ${d.energy===v?"on":""}" onclick="setF(${dayIdx},'energy','${v}')">${v}</button>`).join("")}
        </div>

        <div class="mrow">${MOODS.map(m=>
          `<button class="mb ${d.mood===m?"on":""}" onclick="setF(${dayIdx},'mood','${m}')">${m}</button>`).join("")}
        </div>
      </div>
      <div class="df"><div class="dl">💡 Урок дня</div>
        <textarea class="dta" rows="2" placeholder="Чему научился сегодня?"
          oninput="setF(${dayIdx},'lesson',this.value)">${esc(d.lesson)}</textarea>
      </div>
      <div class="df"><div class="dl">🙏 Благодарность</div>
        <textarea class="dta" rows="2" placeholder="За что благодарен?"
          oninput="setF(${dayIdx},'gratitude',this.value)">${esc(d.gratitude)}</textarea>
      </div>
      <div class="df"><div class="dl">💭 Мысли</div>
        <textarea class="dta" rows="3" placeholder="Свободные мысли..."

// ── ИТОГИ ──
function renderStats(){
  const col=THEMES[ti].a;
  const{tot,dn,avg,best}=wkStats(cw);
  const w=gw(cw);

  const cards=[
    {i:"✅",l:"Выполнено",v:`${dn} / ${tot}`},
    {i:"📊",l:"Прогресс",v:`${avg}%`},
    {i:"🏆",l:"Лучший день",v:SH[best]},
    {i:"❌",l:"Не выполнено",v:`${tot-dn}`},
  ].map(c=>`<div class="sc"><div class="si">${c.i}</div><div class="sv">${c.v}</div><div class="sl2">${c.l}</div></div>`).join("");

  const rings=DAYS.map((name,di)=>{
    const p=dayPct(cw,di);
    const f=w.days[di].tasks.filter(t=>t.t.trim()).length;
    const d2=w.days[di].tasks.filter(t=>t.t.trim()&&t.d).length;
    return`<div class="wri"><div class="wrd">${SH[di]}</div>${ring(p,col,60)}<div class="wrc">${d2}/${f}</div></div>`;
  }).join("");

  const trows=[
    {l:"🌙 Сон",f:"sleep",fmt:v=>`${v}ч`},
    {l:"⚡ Энергия",f:"energy",fmt:v=>`${v}/5`},
    {l:"😊 Настроение",f:"mood",fmt:v=>v},
  ].map(r=>`<tr><td style="padding:8px 16px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap">${r.l}</td>
    ${w.days.map(d=>`<td style="padding:8px 6px;text-align:center;font-size:14px">${r.fmt(d[r.f])}</td>`).join("")}</tr>`).join("");

  return`<div style="height:12px"></div>
    <div class="sgrid">${cards}</div>
    <div class="card"><div class="ch"><span class="ct">Прогресс по дням</span></div>
      <div class="wrrow">${rings}</div>
    </div>
    <div class="card"><div class="ch"><span class="ct">Дневник недели</span></div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr><th style="padding:8px 16px;text-align:left;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">Показатель</th>
            ${SH.map(s=>`<th style="padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)">${s}</th>`).join("")}
          </tr></thead><tbody>${trows}</tbody>
        </table>
      </div>
    </div>
    <div style="padding:8px 16px 20px;text-align:center">
      <button onclick="askReset()" style="background:transparent;border:1.5px solid var(--border);
        border-radius:14px;padding:12px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;width:100%">
        🗑 Сбросить текущую неделю
      </button>
    </div>`;
}

// ── ИСТОРИЯ ──
function renderAll(){
  const col=THEMES[ti].a;
  const todayW=wkKey(new Date());
  // Собираем все ключи + добавляем будущие недели
  const existing=Object.keys(D).sort().reverse();
  // Добавляем следующие 4 недели если их нет
  const future=[];
  for(let i=1;i<=4;i++){
    const k=shiftKey(todayW,i);
    if(!existing.includes(k))future.push(k);
  }
  const all=[...future,...existing].sort().reverse();

  if(!all.length)return`<div class="empty"><div class="ei">📅</div>Пока нет данных.<br>Начните заполнять планер!</div>`;

  return`<div style="height:12px"></div>`+all.map(key=>{
    const w=D[key];
    const tot=w?w.days.reduce((s,d)=>s+d.tasks.filter(t=>t.t.trim()).length,0):0;
    const dn=w?w.days.reduce((s,d)=>s+d.tasks.filter(t=>t.t.trim()&&t.d).length,0):0;
    const avg=tot?Math.round(dn/tot*100):0;
    const isCur=key===cw,isToday=key===todayW,isFut=key>todayW;
    const days=w?w.days:DAYS.map(()=>({tasks:[]}));
    const rings=days.map((d,di)=>{
      const f=d.tasks.filter(t=>t.t.trim()).length;
      const d2=d.tasks.filter(t=>t.t.trim()&&t.d).length;
      const p=f?Math.round(d2/f*100):0;
      return`<div class="hri"><div class="hril">${SH[di]}</div>${ring(p,col,38)}</div>`;
    }).join("");
    return`<div class="hc ${isCur?"cur":""} ${isFut?"future":""}" onclick="goWeek('${key}')">
      <div class="hh">
        <div>
          <div class="hwl">${isFut?"🚀 ":isToday?"📅 ":""}${fwk(key)}</div>
          <div class="hsub">${isFut?"Будущая неделя — нажмите для планирования":`Выполнено: ${dn} из ${tot} задач${isCur?" · текущая":""}`}</div>
        </div>
        <div class="hpct">${isFut?"—":avg+"%"}</div>
      </div>
      <div class="hrr">${rings}</div>
    </div>`;
  }).join("");
}

function goWeek(k){cw=k;tab="tasks";dayIdx=isCurrentWeek(k)?todayIdx():0;
  document.querySelectorAll(".tb").forEach((b,i)=>b.classList.toggle("on",i===0));render();}

// ── ИЗМЕНЕНИЕ ДАННЫХ ──
function togT(di,ti2){
  const t=gw(cw).days[di].tasks[ti2];
  if(!t||!t.t.trim())return;
  t.d=!t.d;save();render();
}
function setT(di,ti2,v){
  const tasks=gw(cw).days[di].tasks;
  if(!tasks[ti2])return;
  tasks[ti2].t=v;if(!v.trim())tasks[ti2].d=false;
  aS();
}
function addTask(){
  const inp=document.getElementById("add-inp");
  const v=(inp&&inp.value||"").trim();
  const tasks=gw(cw).days[dayIdx].tasks;
  tasks.push(newTask(v));
  save();render();
  // Фокус обратно
  setTimeout(()=>{const i=document.getElementById("add-inp");if(i)i.focus();},50);
}
function delTask(di,ti2){
  const tasks=gw(cw).days[di].tasks;
  tasks.splice(ti2,1);save();render();
}
function setF(di,f,v){gw(cw).days[di][f]=v;aS();if(f==="energy"||f==="mood"||f==="sleep")render();}
let st=null;
function aS(){clearTimeout(st);st=setTimeout(()=>{save();renderHeader();},400);}

// ── ПРИОРИТЕТ ──
function openPrio(di,ti2){editDI=di;editTI=ti2;document.getElementById("ppicker").classList.add("on");}
function setPrio(p,color){
  if(editTI>=0){
    const tasks=gw(cw).days[editDI].tasks;
    if(tasks[editTI])tasks[editTI].prio=p;
    save();
  }
  document.getElementById("ppicker").classList.remove("on");
  render();
}

// ── ДЕДЛАЙН ──
function openDL(di,ti2){
  editDI=di;editTI=ti2;
  const task=gw(cw).days[di].tasks[ti2];
  const inp=document.getElementById("dl-date");
  if(inp)inp.value=task&&task.deadline||"";
  document.getElementById("dlpicker").classList.add("on");
}
function closeDL(){document.getElementById("dlpicker").classList.remove("on");}
function saveDL(){
  const v=document.getElementById("dl-date").value;
  const tasks=gw(cw).days[editDI].tasks;
  if(tasks[editTI])tasks[editTI].deadline=v;
  save();closeDL();render();
}
function clearDL(){
  const tasks=gw(cw).days[editDI].tasks;
  if(tasks[editTI])tasks[editTI].deadline="";
  save();closeDL();render();
}

// ── СБРОС ──
function askReset(){document.getElementById("cm").classList.add("on");}
function closeCm(){document.getElementById("cm").classList.remove("on");}
function doReset(){delete D[cw];save();closeCm();render();}

// ── СВАЙП ──
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(tab!=="tasks"&&tab!=="diary")return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>55){
    if(dx<0){dayIdx<6?dayIdx++:(cw=shiftKey(cw,1),dayIdx=0);}
    else{dayIdx>0?dayIdx--:(cw=shiftKey(cw,-1),dayIdx=6);}
    render();
  }
},{passive:true});

// ── РЕНДЕР ──
function render(){
  renderHeader();
  const m=document.getElementById("content");
  if(tab==="tasks")      m.innerHTML=renderTasks();
  else if(tab==="diary") m.innerHTML=renderDiary();
  else if(tab==="stats") m.innerHTML=renderStats();
  else if(tab==="all")   m.innerHTML=renderAll();
  m.scrollTop=0;
}

load();applyTheme();buildTGrid();render();
window.addEventListener("beforeunload",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save();});
window.addEventListener("resize",renderHeader);
</script>
